name: publish npm release

on:
  release:
    types: [published]

concurrency:
  group: npm-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'screenrig/cli' && github.event.release.prerelease == false
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Use an npm CLI with trusted publishing support
        run: npm install --global npm@11.5.1
      - name: Verify immutable release identity
        id: package
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node scripts/check-release-tag.mjs "${RELEASE_TAG}"
          printf 'version=%s\n' "$(node scripts/calver.mjs from-tag "${RELEASE_TAG}")" >> "${GITHUB_OUTPUT}"
      - name: Install exact dependencies without a release cache
        run: npm ci
      - name: Run complete public package gates
        run: |
          npm run check:public
          npm run check
          npm run smoke:mock
          npm run pack:dry
      - name: Stamp CalVer onto the npm package
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/calver.mjs stamp --root . --version "$(node scripts/calver.mjs from-tag "${RELEASE_TAG}")"
      - name: Publish the exact public package with trusted OIDC
        run: npm publish --access public

  clean-install:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20.11.1"
          package-manager-cache: false
      - name: Install and execute the exact npm release
        run: node scripts/check-npm-install.mjs --spec "screenrig@${{ needs.publish.outputs.version }}"

  github-release-artifact:
    needs: clean-install
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - name: Build stable offline CLI archive and checksum
        run: |
          npm run pack:release
          sha256sum screenrig-cli.tgz > screenrig-cli.tgz.sha256
      - name: Attach stable artifacts to the existing GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "${RELEASE_TAG}" screenrig-cli.tgz screenrig-cli.tgz.sha256
