# What the CLI vendors. `rig contracts sync cli` rewrites it; CI runs
# `sha256sum --strict -c contracts.sha256`.

[[source]]
repo = "backend"

[source.files]
"src/generated/resource-ids.ts" = "packages/protocol/src/resource-ids.ts"
"assets/playlist-write-v2.schema.json" = "packages/protocol/schema/playlist-write-v2.schema.json"
"src/generated/playlist-write-semantics.ts" = "packages/protocol/src/playlist-write-semantics.ts"
# The public OpenAPI: the contract without the staff routes. This repository
# is public, so it never vendors api/openapi.yaml.
"vendor/protocol/openapi.gen.ts" = "api/public/openapi.gen.ts"
"vendor/openapi.yaml" = "api/public/openapi.yaml"
"assets/screenrig.runtime.js" = "contracts/sdk/dist/screenrig.runtime.js"
# The declaration file for TypeScript applications, built beside the runtime.
"assets/screenrig.d.ts" = "contracts/sdk/dist/screenrig.runtime.d.ts"
# The SDK bridge conformance corpora `app dev` runs its host against: the base
# protocol, the device kinds and the page kinds (visibility, timing, context).
"vendor/protocol/fixtures/sdk-bridge" = "packages/protocol/fixtures/sdk-bridge"
"vendor/protocol/fixtures/sdk-bridge-device" = "packages/protocol/fixtures/sdk-bridge-device"
"vendor/protocol/fixtures/sdk-bridge-page" = "packages/protocol/fixtures/sdk-bridge-page"
