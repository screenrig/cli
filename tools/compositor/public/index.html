<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Compositor lab</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="bar">
      <div class="nav">
        <strong>Compositor lab</strong>
        <label class="page-label">
          Page
          <select id="page"></select>
        </label>
        <button id="prev" type="button" aria-label="Previous page">←</button>
        <button id="next" type="button" aria-label="Next page">→</button>
      </div>
      <div class="actions">
        <button id="generate" type="button">Generate</button>
        <p id="status" class="muted"></p>
      </div>
    </header>
    <section class="stage" id="stage">
      <p id="empty" class="muted">No page yet.</p>
    </section>
    <section class="source">
      <h2>Source</h2>
      <textarea id="input" spellcheck="false"></textarea>
    </section>
    <script src="/app.js" type="module"></script>
  </body>
</html>
