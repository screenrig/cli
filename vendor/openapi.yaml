    NativeIdentityChallengeRequest:
      type: object
      additionalProperties: false
      required: [kid]
      properties:
        kid: { type: string, pattern: "^[A-Za-z0-9_-]{43}$", description: RFC 7638 SHA-256 JWK thumbprint of the enrolled public key. }
    NativeIdentityChallenge:
      type: object
