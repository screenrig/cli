        height: { type: integer, minimum: 1, maximum: 100000, description: "Device-independent pixels of the playback surface used for the last resolveLayout. Not canvas author size and not encoded screenshot size. Maximum is 100000." }
        pixel_ratio: { type: number, exclusiveMinimum: 0, maximum: 32, description: "Device pixel ratio next to the layout surface. Finite. Range-checked only; not proven hardware." }
        presentation: { type: string, enum: [output, windowed] }
