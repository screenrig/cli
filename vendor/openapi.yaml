    Event: { type: object, additionalProperties: true, required: [cursor, sequence, type, severity, message, at], properties: { cursor: { type: string }, sequence: { type: integer }, type: { type: string }, severity: { type: string }, request_id: { type: string }, operation_id: { type: string }, message: { type: string }, actor: { $ref: "#/components/schemas/EventActor" }, agent: { $ref: "#/components/schemas/EventAgent" }, command: { $ref: "#/components/schemas/EventCommand" }, resource: { type: object, additionalProperties: true }, details: { type: object, additionalProperties: true }, at: { type: string } } }
    EventCommand:
      type: object
      additionalProperties: false
      required: [name, method]
      description: >-
        The agent request that caused this event. Optional and absent on every
        event a dashboard user, a player, or a worker produced. It is descriptive
        attribution only and is never authorization.

        Every field is written by the server from the route it matched or from the
        problem registry. A command object cannot carry an argument vector, a
        request body, a header, or any text the caller chose, and there is
        deliberately no field for one.

        name and method appear on every event an agent request committed. The
        outcome fields appear ONLY on an agent.command event, which is the record
        for a request that committed no domain event: a committed domain event is
        itself the proof that the request succeeded.
      properties:
        name:
          type: string
          description: >-
            Route-derived operation name such as screens.archive or media.create.
            Built from the matched pattern's literal segments, so every part of it
            is a string the server published. A route with no recognizable shape
            is reported as unknown rather than echoing the request.
        method: { type: string, enum: [POST, PUT, PATCH, DELETE], description: "Reads are not recorded: they change nothing." }
        outcome:
          type: string
          enum: [ok, blocked, failed]
          description: "agent.command only. ok is a 2xx or 3xx. blocked is a 4xx, meaning the server refused it. failed is a 5xx, meaning the server broke. The distinction is the first thing an operator wants."
        status: { type: integer, description: "agent.command only. The one authoritative status. When a problem was recorded this is the status the problem registry assigns that code, not a status observed on the way out." }
        problem_code: { type: string, description: "agent.command only. Stable problem code the server refused with, such as application_in_use. Absent on success. Use it to look up current copy for a code." }
        error:
          type: string
          description: >-
            agent.command only, and present only alongside problem_code. The
            problem registry TITLE for that code, captured when the record was
            written. It is never the problem document's detail, because detail is
            free text supplied per call site and can be built from request bytes.
            Storing the title at write time also means reworded copy does not
            rewrite history and a retired code stays readable.
    EventActor:
      type: object
      additionalProperties: false
      required: [user_id, display_name]
      description: >-
        Dashboard user that caused this mutation. Optional and absent on every
        event an agent, the CLI, a player, or a worker produced, so the field
        distinguishes a dashboard mutation rather than labelling all traffic. It
        is descriptive attribution only and is never authorization. display_name
        is the name the user chose at registration and is not verified.
      properties:
        user_id: { type: string }
        display_name: { type: string, minLength: 1, maxLength: 80 }
