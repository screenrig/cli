  /runtime/v1/screenshot:
    servers: [{ url: https://play.screenrig.ai, description: Trusted player/runtime origin }]
    put:
      operationId: putRuntimeScreenshot
      description: >-
        Uploads the current pending still WebP for the session screen. Path
        does not name screen_id; the paired runtime session binds it. Header
        ScreenRig-Capture-Id must be the current pending capture_id. Content-Type
        is exactly image/webp. Body is raw WebP, not empty, at most 2097152
        bytes. The server validates RIFF/WEBP magic, decodes one still frame,
        and stores the uploaded bytes unchanged. Animated WebP is
        invalid_request. Missing, unknown, expired, or non-current capture_id
        is resource_conflict. Unpaired sessions are forbidden. Prepaid remaining
        credit is not a gate and these bytes are not counted in used_bytes.
        One slot per screen is replaced. screen.screenshot_ready details name
        capture_id, bytes, width, height, and sha256; they never include pixels
        or an object key.
      security: [{ pairedRuntimeCookie: [] }, { nativeSessionAuthorization: [] }]
      parameters: [{ $ref: "#/components/parameters/ScreenshotCaptureIDHeader" }]
      requestBody: { required: true, content: { image/webp: { schema: { type: string, format: binary } } } }
      responses:
        "204": { description: Still WebP stored as the current slot., headers: { Cache-Control: { schema: { type: string, enum: [no-store] } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /runtime/v1/observation:
    servers: [{ url: https://play.screenrig.ai, description: Trusted player/runtime origin }]
    put:
      operationId: putRuntimeObservation
      description: >-
        Reports the playback surface the paired player used for the last
        resolveLayout. Path does not name screen_id; the paired runtime session
        binds it. Body is JSON ScreenObservation: observed_at plus exactly one
        surface. Numbers are device-independent pixels and the device pixel
        ratio next to that layout surface, not canvas author size and not
        encoded screenshot size. They are range-checked only and are never
        proven hardware or authorization. Last write wins and replaces the
        whole surfaces array. An identical surfaces tuple (id, width, height,
        pixel_ratio, presentation) does not emit screen.surface_changed; a
        later observed_at on the same tuple is ignored. Unpaired and anonymous
        public sessions are forbidden. Native cookies are rejected; browser
        must not adopt header profiles. Prepaid remaining credit is not a
        gate. Observation is absent from GET /api/v1/screens until the first
        accepted report. ScreenPatch cannot write it.
      security: [{ pairedRuntimeCookie: [] }, { nativeSessionAuthorization: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ScreenObservation" } } } }
      responses:
        "204": { description: Observation stored as the current surfaces array., headers: { Cache-Control: { schema: { type: string, enum: [no-store] } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
