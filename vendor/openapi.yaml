  /{asset_path}:
    servers:
      - url: https://r-{release_host_label}.apps.screenrig.ai
        variables:
          release_host_label: { default: 0123456789abcdef0123456789abcdef01234567, description: Domain-separated 160-bit lowercase hexadecimal digest label derived deterministically from the immutable prefixed release ID. }
    get:
      operationId: consumeLaunchTicketOrGetReleaseAsset
      description: >-
        Exact-release-host operation. With a ticket query, atomically consumes the single-use 30-second ticket,
        binds Host/release/screen/content-generation/manifest/grant, sets only the exact-host release-grant cookie,
        and redirects to the same path without the ticket. Without a ticket, validates that cookie on every GET/HEAD.
        The asset_path parameter is greedy (x-screenrig-greedy-path) and is resolved only beneath the ready release root.
        Runtime/account/device cookies and account bearer tokens never authorize this operation.
      x-screenrig-greedy-path: true
      security:
        - releaseLaunchTicket: []
        - releaseGrantCookie: []
      parameters:
        - { name: asset_path, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/SecFetchSite" }
        - { $ref: "#/components/parameters/SecFetchMode" }
        - { $ref: "#/components/parameters/SecFetchDest" }
      responses:
        "200": { description: Exact-host grant-authorized immutable asset., headers: { Referrer-Policy: { schema: { type: string, enum: [no-referrer] } }, X-Content-Type-Options: { schema: { type: string, enum: [nosniff] } }, ETag: { schema: { type: string } } } }
        "302": { description: Ticket consumed once; release-grant cookie issued; ticket removed from Location., headers: { Location: { schema: { type: string } }, Set-Cookie: { schema: { type: string } }, Cache-Control: { schema: { type: string, enum: [no-store] } }, Referrer-Policy: { schema: { type: string, enum: [no-referrer] } } } }
        "403": { description: "Wrong Host/release/screen/generation/grant, stale/replayed ticket, invalid cookie, contradictory Fetch Metadata, or disallowed method.", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "404": { description: Asset absent without exposing release filesystem shape., content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /runtime/v1/apps/{application_id}/kv:
