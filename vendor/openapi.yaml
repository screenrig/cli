      responses:
        "200": { description: Feature requests owned by the calling account., content: { application/json: { schema: { $ref: "#/components/schemas/FeedbackList" } } } }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: requestFeature
      description: >-
        Records one immutable feature request against the calling account. A
        submission cannot be updated or deleted; a correction is a new submission. An
        exact retry carrying the same Idempotency-Key returns the original submission
        for twenty-four hours instead of creating a duplicate, and a different body
        under that key returns idempotency_mismatch. Never place credentials,
        cookies, Authorization headers, completion nonces, signed URLs, or object
        keys in title, body, or context; recognizable ScreenRig credential material
        is rejected with invalid_request and is not stored.
      security: [{ accountBearer: [] }]
