  /dashboard/v1/links/claim:
    servers: [{ url: https://dashboard.screenrig.ai, description: Backend-owned account dashboard origin }]
    post:
      operationId: claimDashboardLink
      x-rate-limit-policies: [{ name: dashboard-claim-ip, quota: 30, windowSeconds: 600 }]
      x-rate-limit-admitted-response-headers: [RateLimit-Policy, RateLimit]
      description: >-
        Claims one dashboard link. The token is presented in the request body
        only, because it rides the browser URL fragment and a fragment never
        reaches the server. No cookie is required and no ScreenRig-*
        Authorization header is ever accepted on this path family. next is the
        only discriminator a client may branch on. ready means a valid dashboard
        session for the same account already exists and this is a no-op sign-in.
        register_passkey means production mode with no session; the response
        sets the short-lived setup cookie and the client continues with a
        WebAuthn registration ceremony. create_session means the server is in
        dashboard development-authentication mode; the response sets the setup
        cookie and the client continues with POST /dashboard/v1/sessions. An
        unknown token, a malformed token, and a claim presented from a session
        bound to a different account all return dashboard_link_invalid, so the
        route is not an account or token existence oracle. An elapsed link is
        dashboard_link_expired and an already-claimed link is
        dashboard_link_consumed. The response never echoes the token and never
        carries provisioning material.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/DashboardLinkClaimRequest" } } } }
      responses:
        "200":
          description: >-
            Link claimed. Set-Cookie carries the session cookie for ready and
            the short-lived setup cookie for register_passkey and
            create_session. The body carries no token and no cookie value.
          headers:
            Cache-Control: { schema: { type: string, enum: [no-store] } }
            Referrer-Policy: { schema: { type: string, enum: [no-referrer] } }
            Set-Cookie: { schema: { type: string } }
            RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }
            RateLimit: { $ref: "#/components/headers/RateLimit" }
          content: { application/json: { schema: { $ref: "#/components/schemas/DashboardLinkClaim" } } }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "410": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimitedProblem" }
        "503": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /dashboard/v1/webauthn/registrations:
    servers: [{ url: https://dashboard.screenrig.ai, description: Backend-owned account dashboard origin }]
    post:
      operationId: startDashboardPasskeyRegistration
      description: >-
        Starts one WebAuthn registration ceremony and returns the creation
        options verbatim for navigator.credentials.create. Either the setup
        cookie or an established session cookie authorizes it: a link claim
        registers a first passkey for a new user, and a signed-in user adds
        another passkey to their own account without a new link. The relying
        party is the dashboard host, credentials are discoverable, user
        verification is required, and attestation is none. The ceremony is
        bound to the presenting cookie and expires with DashboardCeremonyTTL of
        five minutes. When the server runs dashboard development
        authentication, this route returns passkeys_disabled.
        display_name is required with the setup cookie, because the creation
        options must name the new user, and is rejected with a session cookie,
        because that user already has a name.
      security: [{ dashboardSetup: [] }, { dashboardSession: [] }]
      requestBody: { required: false, content: { application/json: { schema: { $ref: "#/components/schemas/DashboardPasskeyRegistrationStart" } } } }
      responses:
        "201": { description: WebAuthn creation options bound to this ceremony., headers: { Cache-Control: { schema: { type: string, enum: [no-store] } } }, content: { application/json: { schema: { $ref: "#/components/schemas/DashboardPasskeyRegistration" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimitedProblem" }
        default: { $ref: "#/components/responses/Problem" }
  /dashboard/v1/webauthn/registrations/complete:
    servers: [{ url: https://dashboard.screenrig.ai, description: Backend-owned account dashboard origin }]
    post:
      operationId: completeDashboardPasskeyRegistration
      description: >-
        Verifies one registration ceremony and stores the credential. A setup
        cookie creates the user the ceremony named and mints the session
        cookie. A session cookie adds a credential to the signed-in user and
        does not create a user or replace the session. A ceremony that is
        unknown, elapsed, already used, or bound to a different cookie returns
        passkey_invalid, and so does a response the relying party cannot
        verify. When the server runs dashboard development authentication, this
        route returns passkeys_disabled.
      security: [{ dashboardSetup: [] }, { dashboardSession: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/DashboardPasskeyRegistrationComplete" } } } }
      responses:
        "200": { description: Credential stored. Set-Cookie is present only when this call created the session., headers: { Cache-Control: { schema: { type: string, enum: [no-store] } }, Set-Cookie: { schema: { type: string } } }, content: { application/json: { schema: { $ref: "#/components/schemas/DashboardSession" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimitedProblem" }
        default: { $ref: "#/components/responses/Problem" }
  /dashboard/v1/webauthn/assertions:
    servers: [{ url: https://dashboard.screenrig.ai, description: Backend-owned account dashboard origin }]
    post:
      operationId: startDashboardPasskeyAssertion
      x-rate-limit-policies: [{ name: dashboard-assertion-ip, quota: 30, windowSeconds: 600 }]
      x-rate-limit-admitted-response-headers: [RateLimit-Policy, RateLimit]
      description: >-
        Starts one usernameless WebAuthn assertion ceremony and returns the
        request options verbatim for navigator.credentials.get. No cookie is
        required, and no allowCredentials list is published, so the route
        reveals nothing about which users or credentials exist. The ceremony
        expires with DashboardCeremonyTTL of five minutes. When the server runs
        dashboard development authentication, this route returns
        passkeys_disabled.
      responses:
        "201": { description: WebAuthn request options bound to this ceremony., headers: { Cache-Control: { schema: { type: string, enum: [no-store] } }, RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }, RateLimit: { $ref: "#/components/headers/RateLimit" } }, content: { application/json: { schema: { $ref: "#/components/schemas/DashboardPasskeyAssertion" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimitedProblem" }
        default: { $ref: "#/components/responses/Problem" }
  /dashboard/v1/webauthn/assertions/complete:
    servers: [{ url: https://dashboard.screenrig.ai, description: Backend-owned account dashboard origin }]
    post:
      operationId: completeDashboardPasskeyAssertion
      description: >-
        Verifies one usernameless assertion and mints the dashboard session
        cookie for the user the discoverable credential identifies. No cookie
        authenticates the request. A ceremony that is unknown, elapsed, or
        already used returns passkey_invalid, and so does an assertion the
        relying party cannot verify or a sign counter that moves backwards.
        The credential identifier is not authorization on its own: the signed
        assertion is. When the server runs dashboard development
        authentication, this route returns passkeys_disabled.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/DashboardPasskeyAssertionComplete" } } } }
      responses:
        "200": { description: Session cookie minted from a verified assertion., headers: { Cache-Control: { schema: { type: string, enum: [no-store] } }, Set-Cookie: { schema: { type: string } } }, content: { application/json: { schema: { $ref: "#/components/schemas/DashboardSession" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimitedProblem" }
        default: { $ref: "#/components/responses/Problem" }
  /dashboard/v1/sessions:
    servers: [{ url: https://dashboard.screenrig.ai, description: Backend-owned account dashboard origin }]
    post:
      operationId: createDashboardSession
      x-rate-limit-policies: [{ name: dashboard-password-email, quota: 10, windowSeconds: 600 }, { name: dashboard-password-ip, quota: 30, windowSeconds: 600 }]
      x-rate-limit-admitted-response-headers: [RateLimit-Policy, RateLimit]
      description: >-
        With email and password, verifies the password credential on the
        existing account identified by its normalized enrolled email. It never
        creates an account, dashboard user, tenant, or agent and provides no
        signup or recovery behavior. Unknown emails, accounts without a
        password, and mismatches all return the same unauthorized response.
        Admission is limited independently by normalized email and client IP.
        Success mints exactly the same __Host-screenrig-dashboard cookie and
        server-side account session as a verified passkey assertion.

        The display_name body is a separate localhost-only
        development-authentication shape requiring the setup cookie. It mints a
        no-proof development user and session only when DashboardDevAuth is on;
        production explicitly refuses that shape. DashboardDevAuth is never
        consulted or accepted as password proof.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - { $ref: "#/components/schemas/DashboardPasswordLogin" }
                - { $ref: "#/components/schemas/DashboardSessionCreate" }
      responses:
        "200": { description: Existing account session minted from a verified password., headers: { Cache-Control: { schema: { type: string, enum: [no-store] } }, Set-Cookie: { schema: { type: string } }, RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }, RateLimit: { $ref: "#/components/headers/RateLimit" } }, content: { application/json: { schema: { $ref: "#/components/schemas/DashboardSession" } } } }
        "201": { description: Local development-mode session cookie minted from a setup cookie., headers: { Cache-Control: { schema: { type: string, enum: [no-store] } }, Set-Cookie: { schema: { type: string } }, RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }, RateLimit: { $ref: "#/components/headers/RateLimit" } }, content: { application/json: { schema: { $ref: "#/components/schemas/DashboardSession" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimitedProblem" }
        "503": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /dashboard/v1/password:
    servers: [{ url: https://dashboard.screenrig.ai, description: Backend-owned account dashboard origin }]
    put:
      operationId: setDashboardPassword
      description: >-
        Adds or replaces the Argon2id password credential on the signed-in
        user's existing account. The account must already carry its enrolled
        email. This creates no account or dashboard user and does not remove or
        alter any passkey. Replacing the password makes this session user the
        actor for later password sessions on the same account.
      security: [{ dashboardSession: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/DashboardPasswordSet" } } } }
      responses:
        "204": { description: Account password added or replaced. }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /dashboard/v1/session:
    servers: [{ url: https://dashboard.screenrig.ai, description: Backend-owned account dashboard origin }]
    get:
      operationId: getDashboardSession
      description: >-
        Returns the current dashboard session. Authority is the session cookie
        and the server-side session row it names; the user identifier in the
        body is descriptive and is never authorization. A returning visit calls
        this first, and treats 401 as the signal to offer password login or a
        usernameless assertion ceremony. dev_auth reports the server mode so the client
        needs no build-time flag, environment check, or hostname test.
      security: [{ dashboardSession: [] }]
      responses:
        "200": { description: Current dashboard session., headers: { Cache-Control: { schema: { type: string, enum: ["private, no-store"] } } }, content: { application/json: { schema: { $ref: "#/components/schemas/DashboardSession" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /dashboard/v1/logout:
    servers: [{ url: https://dashboard.screenrig.ai, description: Backend-owned account dashboard origin }]
    post:
      operationId: logoutDashboardSession
      description: >-
        Deletes the server-side session row and expires the session cookie. It
        does not delete the user and does not remove any credential. It is
        intrinsically idempotent and takes no Idempotency-Key.
      security: [{ dashboardSession: [] }]
      responses:
        "204": { description: Session row deleted and session cookie expired., headers: { Cache-Control: { schema: { type: string, enum: [no-store] } }, Set-Cookie: { schema: { type: string } } } }
        "401": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /dashboard/v1/users:
    servers: [{ url: https://dashboard.screenrig.ai, description: Backend-owned account dashboard origin }]
    get:
      operationId: listDashboardUsers
      description: >-
        Lists the dashboard users of the session's account. An account holds N
        users, and every user holds equal read and delete authority; there are
        no roles in v1. There is no user delete in v1, because the
        last-user-lockout hazard is unresolved. Another account's users are
        never returned and are not addressable by identifier.
      security: [{ dashboardSession: [] }]
      responses:
        "200": { description: Dashboard users of the session's account., headers: { Cache-Control: { schema: { type: string, enum: ["private, no-store"] } } }, content: { application/json: { schema: { $ref: "#/components/schemas/DashboardUserList" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /dashboard/v1/agents:
    servers: [{ url: https://dashboard.screenrig.ai, description: Backend-owned account dashboard origin }]
    get:
      operationId: listDashboardAgents
      description: Lists every pending, active, revoked, cancelled, and expired agent of the session account with safe installation metadata, last use, authenticated request count, and directly attributable metered credits. No bearer, recipient key bytes, envelope, or account identifier is returned.
      security: [{ dashboardSession: [] }]
      responses:
        "200": { description: Account agents., headers: { Cache-Control: { schema: { type: string, enum: ["private, no-store"] } } }, content: { application/json: { schema: { $ref: "#/components/schemas/AgentList" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /dashboard/v1/agents/{id}/events:
    servers: [{ url: https://dashboard.screenrig.ai, description: Backend-owned account dashboard origin }]
    get:
      operationId: listDashboardAgentEvents
      description: >-
        This agent's history, newest first, as ONE record per trigger. It carries
        both what the agent asked for and what changed as a result. A request that
        changed something is its domain event, stamped with the command that caused
        it. A request that changed nothing — refused, failed, or an event-less
        success — is one agent.command event. There is no separate commands
        endpoint; showing the same trigger on two panels was the defect this
        replaced.

        Lifecycle events for this agent are included. Worker, player, and
        dashboard-only activity is never inferred as agent activity.

        Two requests are two triggers. A retry after a refusal is a second record,
        never a rewrite of the first.

        Reads are not recorded, because they change nothing and a polling agent
        would bury every real action. Anonymous enrollment and connection creation
        are excluded. Requests using temporary ScreenRig-Agent-Connect authority
        are also excluded, because that authority has not authenticated an account
        agent installation.

        Every part of the command stamp is derived from the route this server
        matched or from the problem registry. There is no argument vector, no
        request body, no header, and no free text anywhere in a record, so nothing
        needs redacting and no caller can write chosen text into an
        operator-visible surface. Resource identifiers appear because an
        identifier is never authorization and is already published on events.

        Paging keys on sequence, descending. Pass the returned next_cursor as
        after to continue. next_cursor is empty when the page is short, which is
        the end of the history: a concurrent append only takes a higher sequence,
        and retention removes the lowest sequences first, so a cursor never
        duplicates or skips a surviving record. Offset paging is not supported.

        Every search parameter is an exact-match or range predicate on a
        server-written token. A malformed cursor or filter value is refused with
        invalid_request. A limit outside 1-200 is clamped to the default rather
        than refused.

        Records expire on the account's own event retention window.
      security: [{ dashboardSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/ResourceID" }
        - { name: after, in: query, description: "Cursor from a previous page's next_cursor.", schema: { type: string, pattern: "^ev1_" } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: command, in: query, description: "Exact route-derived command name, such as screens.archive.", schema: { type: string, maxLength: 80, pattern: "^[a-z0-9_-]+(\\.[a-z0-9_-]+)*$" } }
        - { name: type, in: query, description: "Exact event type, such as agent.command or screen.archived.", schema: { type: string, maxLength: 80, pattern: "^[a-z0-9_-]+(\\.[a-z0-9_-]+)*$" } }
        - { name: resource_type, in: query, description: "Exact kind of object the request acted on.", schema: { type: string, pattern: "^[a-z_]{1,32}$" } }
        - { name: resource_id, in: query, description: "Exact identifier of the object the request acted on.", schema: { type: string, pattern: "^[a-z]+_[A-Za-z0-9_-]{1,60}$" } }
        - { name: outcome, in: query, description: "Present only on agent.command records; a domain event implies ok.", schema: { type: string, enum: [ok, blocked, failed] } }
        - { name: problem_code, in: query, description: "Exact stable problem code the server refused with.", schema: { type: string, pattern: "^[a-z_]{1,64}$" } }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: until, in: query, schema: { type: string, format: date-time } }
      responses:
        "200": { description: "Agent history.", content: { application/json: { schema: { $ref: "#/components/schemas/EventList" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /dashboard/v1/agents/{id}/disconnect/assertions:
    servers: [{ url: https://dashboard.screenrig.ai, description: Backend-owned account dashboard origin }]
    post:
      operationId: startDashboardAgentDisconnectAssertion
      description: Starts a fresh five-minute passkey assertion bound to this exact agent disconnect. An existing dashboard session alone is insufficient. Development-authentication mode returns an explicit-confirmation challenge instead and never enables that exception in production.
      security: [{ dashboardSession: [] }]
      parameters: [{ $ref: "#/components/parameters/ResourceID" }]
      responses:
        "201": { description: Fresh passkey assertion. Production response., content: { application/json: { schema: { $ref: "#/components/schemas/DashboardAgentAuthorization" } } } }
        "200": { description: Guarded development confirmation., content: { application/json: { schema: { $ref: "#/components/schemas/DashboardAgentAuthorization" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /dashboard/v1/agents/{id}/disconnect:
    servers: [{ url: https://dashboard.screenrig.ai, description: Backend-owned account dashboard origin }]
    post:
      operationId: disconnectDashboardAgent
      description: Completes the fresh passkey step-up and revokes the selected agent and its bearer. Disconnecting an approved pending agent atomically marks its connection cancelled and deletes its credential issuance, so collection and activation cannot continue. A dashboard user may disconnect the last active agent because the registered passkey remains independent administrative authority.
      security: [{ dashboardSession: [] }]
      parameters: [{ $ref: "#/components/parameters/ResourceID" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/DashboardAgentAuthorizationComplete" } } } }
      responses:
        "204": { description: Agent disconnected. }
        default: { $ref: "#/components/responses/Problem" }
  /dashboard/v1/agent-connections/{id}:
    servers: [{ url: https://dashboard.screenrig.ai, description: Backend-owned account dashboard origin }]
    get:
      operationId: getDashboardAgentConnection
      description: Safe review metadata for a connection id opened by the CLI. The id is not authority; the authenticated dashboard session selects the account.
      security: [{ dashboardSession: [] }]
      parameters: [{ $ref: "#/components/parameters/ResourceID" }]
      responses:
        "200": { description: Safe connection metadata., content: { application/json: { schema: { $ref: "#/components/schemas/AgentConnection" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /dashboard/v1/agent-connections/{id}/approve/assertions:
    servers: [{ url: https://dashboard.screenrig.ai, description: Backend-owned account dashboard origin }]
    post:
      operationId: startDashboardAgentApprovalAssertion
      description: Starts a fresh five-minute passkey assertion bound to this exact connection approval for a passkey session. A password-authenticated session instead receives explicit password-session confirmation metadata; its existing account session authorizes approval without invoking the development-authentication bypass.
      security: [{ dashboardSession: [] }]
      parameters: [{ $ref: "#/components/parameters/ResourceID" }]
      responses:
        "201": { description: Fresh passkey assertion., content: { application/json: { schema: { $ref: "#/components/schemas/DashboardAgentAuthorization" } } } }
        "200": { description: Guarded password-session or development confirmation., content: { application/json: { schema: { $ref: "#/components/schemas/DashboardAgentAuthorization" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /dashboard/v1/agent-connections/{id}/approve:
    servers: [{ url: https://dashboard.screenrig.ai, description: Backend-owned account dashboard origin }]
    post:
      operationId: approveDashboardAgentConnection
      description: Completes the fresh passkey assertion or confirms an authenticated password session, binds the connection to that same session account, and creates a pending agent and pending bearer. Dashboard development authentication remains a separately guarded localhost-only exception and is never the password path. At most 200 live pending or active agents count toward admission; cancelled, revoked, and expired agents do not. The dashboard response contains safe agent metadata only; it never contains the bearer or credential envelope.
      security: [{ dashboardSession: [] }]
      parameters: [{ $ref: "#/components/parameters/ResourceID" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/DashboardAgentAuthorizationComplete" } } } }
      responses:
        "200": { description: Pending agent safe metadata., content: { application/json: { schema: { $ref: "#/components/schemas/Agent" } } } }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /dashboard/v1/agent-connections/{id}/deny/assertions:
    servers: [{ url: https://dashboard.screenrig.ai, description: Backend-owned account dashboard origin }]
    post:
      operationId: startDashboardAgentDenialAssertion
      description: Starts a fresh assertion bound to denying this exact connection.
      security: [{ dashboardSession: [] }]
      parameters: [{ $ref: "#/components/parameters/ResourceID" }]
      responses:
        "201": { description: Fresh passkey assertion., content: { application/json: { schema: { $ref: "#/components/schemas/DashboardAgentAuthorization" } } } }
        "200": { description: Guarded development confirmation., content: { application/json: { schema: { $ref: "#/components/schemas/DashboardAgentAuthorization" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /dashboard/v1/agent-connections/{id}/deny:
    servers: [{ url: https://dashboard.screenrig.ai, description: Backend-owned account dashboard origin }]
    post:
      operationId: denyDashboardAgentConnection
      description: Completes a fresh step-up and denies this connection without creating an agent or credential.
      security: [{ dashboardSession: [] }]
      parameters: [{ $ref: "#/components/parameters/ResourceID" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/DashboardAgentAuthorizationComplete" } } } }
      responses:
        "204": { description: Connection denied. }
        default: { $ref: "#/components/responses/Problem" }
  /dashboard/v1/summary:
    servers: [{ url: https://dashboard.screenrig.ai, description: Backend-owned account dashboard origin }]
    get:
      operationId: getDashboardSummary
      description: >-
        Account network-status counters for the session's account. Screen
        online counts are derived from live paired runtime event streams, the
        same derivation Screen.online publishes; they are not a stored boolean
        and not a player heartbeat. Media bytes are the durable bytes of ready
        media only.
      security: [{ dashboardSession: [] }]
      responses:
        "200": { description: Account summary counters., headers: { Cache-Control: { schema: { type: string, enum: ["private, no-store"] } } }, content: { application/json: { schema: { $ref: "#/components/schemas/DashboardSummary" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /dashboard/v1/account:
    servers: [{ url: https://dashboard.screenrig.ai, description: Backend-owned account dashboard origin }]
    get:
      operationId: getDashboardAccount
      description: >-
        Status, the unverified contact address, enforced limits, usage, retention,
        and public whole-credit state for the session's account, on the cookie.
        The address is display-only: no route updates it, and the dashboard signs
        in with a passkey, never with an address.

        Every derived value is resolved from the account's private plan identifier
        at read time and none is stored, so a published limit cannot drift from
        enforcement. The plan identifier itself remains unpublished.

        Credit comes from the same snapshot GET /dashboard/v1/balance reads, so
        the two can never disagree, and it is absent rather than zero when that
        snapshot is unavailable. A zero would read as an exhausted account.

        Read-only. This route does not change account configuration.
      security: [{ dashboardSession: [] }]
      responses:
        "200": { description: "Account status, unverified contact address, enforced limits, usage, retention, and public whole-credit state.", headers: { Cache-Control: { schema: { type: string, enum: ["private, no-store"] } } }, content: { application/json: { schema: { $ref: "#/components/schemas/DashboardAccount" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /dashboard/v1/balance:
    servers: [{ url: https://dashboard.screenrig.ai, description: Backend-owned account dashboard origin }]
    get:
      operationId: getDashboardBalance
      description: >-
        Returns the session account's public whole-credit balance. This
        cookie-authenticated read never debits, so it remains available at zero
        after an unpaid billable dashboard-stream event closes the SSE response.
        It is the dashboard recovery surface; the cookie-only dashboard never
        presents an account bearer to GET /api/v1/account.
      security: [{ dashboardSession: [] }]
      responses:
        "200": { description: Public whole-credit balance., headers: { Cache-Control: { schema: { type: string, enum: ["private, no-store"] } } }, content: { application/json: { schema: { $ref: "#/components/schemas/DashboardBalance" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /dashboard/v1/screens:
    servers: [{ url: https://dashboard.screenrig.ai, description: Backend-owned account dashboard origin }]
    get:
      operationId: listDashboardScreens
      description: Default list returns pairing_pending and active screens of the session's account. Pass state=archived to list archived screens only.
      security: [{ dashboardSession: [] }]
      parameters: [{ $ref: "#/components/parameters/ScreenListState" }]
      responses:
        "200": { description: Screens, headers: { Cache-Control: { schema: { type: string, enum: ["private, no-store"] } } }, content: { application/json: { schema: { $ref: "#/components/schemas/ScreenList" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /dashboard/v1/screens/{id}:
    servers: [{ url: https://dashboard.screenrig.ai, description: Backend-owned account dashboard origin }]
    parameters: [{ $ref: "#/components/parameters/ResourceID" }]
    get:
      operationId: getDashboardScreen
      description: >-
        Returns one pairing_pending, active, or archived screen. Authority is
        the session's account owning the screen; the identifier is not
        authorization. A screen of any other account is not_found. Deleted
        screens are not found. There is no dashboard screen create, patch, or
        delete: the dashboard is a read, list, and delete surface, screens
        archive rather than delete, and authoring stays in the agent
        conversation and the CLI.
      security: [{ dashboardSession: [] }]
      responses:
        "200": { description: Screen, headers: { Cache-Control: { schema: { type: string, enum: ["private, no-store"] } } }, content: { application/json: { schema: { $ref: "#/components/schemas/Screen" } } } }
        "401": { $ref: "#/components/responses/Problem" }
