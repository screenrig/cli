        text: { type: string, minLength: 1, maxLength: 120, description: "1 to 120 characters. Line feed is the only accepted line break. At most three lines. Other control characters and recognizable ScreenRig credential material are rejected." }
        duration_ms: { type: integer, minimum: 2000, maximum: 60000, default: 10000, description: Visible duration in milliseconds. Omitted values default to 10000. }
