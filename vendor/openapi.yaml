      required: [kid, public_key, signature]
      properties:
        kid: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
        public_key: { $ref: "#/components/schemas/PlayerPublicKey" }
        signature: { type: string, minLength: 80, maxLength: 4096, description: Compact EdDSA JWS. }
    NativePairingCompletion: { type: object, additionalProperties: false, required: [screen, public_url], properties: { screen: { $ref: "#/components/schemas/Screen" }, public_url: { type: string, format: uri } } }
    BrowserProvisioningExchange: { type: object, additionalProperties: false, required: [provisioning_token, exchange_id], properties: { provisioning_token: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }, exchange_id: { type: string, pattern: "^xchg_[A-Za-z0-9_-]{43}$" } } }
    BrowserProvisioningCompletion: { type: object, additionalProperties: false, required: [screen, public_url], properties: { screen: { $ref: "#/components/schemas/Screen" }, public_url: { type: string, format: uri } } }
    BrowserLinkSession: { type: object, additionalProperties: false, required: [session_id, code, display_code, status, expires_at], properties: { session_id: { type: string, pattern: "^blink_" }, code: { type: string, pattern: "^[23456789ABCDEFGHJKMNPQRSTUVWXYZ]{6}$" }, display_code: { type: string, pattern: "^[23456789ABCDEFGHJKMNPQRSTUVWXYZ]{3}-[23456789ABCDEFGHJKMNPQRSTUVWXYZ]{3}$" }, status: { type: string, enum: [waiting, claimed] }, expires_at: { type: string, format: date-time } } }
    BrowserLinkStatus: { type: object, additionalProperties: false, required: [session_id, code, display_code, status, continuation_path, expires_at], properties: { session_id: { type: string, pattern: "^blink_" }, code: { type: string, pattern: "^[23456789ABCDEFGHJKMNPQRSTUVWXYZ]{6}$" }, display_code: { type: string, pattern: "^[23456789ABCDEFGHJKMNPQRSTUVWXYZ]{3}-[23456789ABCDEFGHJKMNPQRSTUVWXYZ]{3}$" }, status: { type: string, enum: [waiting, claimed] }, continuation_path: { type: string, enum: [/runtime/v1/browser-links/continue] }, expires_at: { type: string, format: date-time } } }
    BrowserLinkEvent: { type: object, additionalProperties: false, required: [session_id, status, event_id, expires_at], properties: { session_id: { type: string, pattern: "^blink_" }, status: { type: string, enum: [waiting, claimed] }, event_id: { type: string, enum: ["1", "2"] }, expires_at: { type: string, format: date-time } } }
    BrowserLinkClaimRequest: { type: object, additionalProperties: false, required: [code], properties: { code: { type: string, pattern: "^[23456789ABCDEFGHJKMNPQRSTUVWXYZ]{3}-?[23456789ABCDEFGHJKMNPQRSTUVWXYZ]{3}$" } } }
    BrowserLinkClaimScreen: { type: object, additionalProperties: false, required: [id, public_id, state, public_url], properties: { id: { type: string }, public_id: { type: string }, state: { type: string, enum: [pairing_pending] }, public_url: { type: string, format: uri, pattern: "^[^#]+$" } } }
    BrowserLinkClaim: { type: object, additionalProperties: false, required: [session_id, status, screen], properties: { session_id: { type: string, pattern: "^blink_" }, status: { type: string, enum: [claimed] }, screen: { $ref: "#/components/schemas/BrowserLinkClaimScreen" } } }
    RuntimeSessionRequest: { type: object, additionalProperties: false, required: [public_id], properties: { public_id: { type: string } } }
    DeviceSessionRequest: { type: object, additionalProperties: false, properties: { public_id: { type: string, minLength: 1 } } }
    RuntimeSession: { type: object, additionalProperties: false, required: [paired, capabilities, event_cursor, public_url], properties: { paired: { type: boolean }, capabilities: { type: array, items: { type: string, enum: [manifest.read, events.read, content.read, kv.read, kv.write, runtime.report, presence.write] } }, event_cursor: { type: string }, public_url: { type: string, format: uri } } }
    NativeRuntimeSession: { type: object, additionalProperties: false, required: [paired, capabilities, event_cursor, public_url, runtime_credential], properties: { paired: { type: boolean, enum: [true] }, capabilities: { type: array, items: { type: string, enum: [manifest.read, events.read, content.read, kv.read, kv.write, runtime.report, presence.write] } }, event_cursor: { type: string }, public_url: { type: string, format: uri }, runtime_credential: { type: string, pattern: "^srs_[A-Za-z0-9_-]+$" } } }
    RuntimeManifest:
      type: object
      additionalProperties: false
      description: Immutable runtime manifest using the deterministic screenrig.canvas/v1 canvas, rectangle, fit, and source-order contract.
      required: [schemaVersion, manifestRevision, grantId, contentGeneration, screenId, screenLabel, playlistRevision, generatedAt, pages]
      properties:
        schemaVersion: { type: integer, enum: [2] }
        manifestRevision: { type: string }
        grantId: { type: string }
        contentGeneration: { type: integer }
        screenId: { type: string }
        screenLabel: { type: string }
        playlistId: { type: string }
        playlistRevision: { type: integer }
        generatedAt: { type: string }
        timezone: { type: string, description: "IANA time zone identifier of the screen. Emitted only when the screen has one. Every page visibility rule in this manifest is evaluated in this zone. A manifest that carries any page visibility always carries it." }
        pages: { type: array, items: { $ref: "#/components/schemas/RuntimePage" } }
    RuntimePage:
      type: object
      additionalProperties: false
      required: [contractVersion, id, canvas, transition, advance, placements]
      properties:
        contractVersion: { type: string, enum: [screenrig.canvas/v1] }
        id: { type: string }
        canvas: { $ref: "#/components/schemas/RuntimeCanvas" }
        transition: { $ref: "#/components/schemas/RuntimeTransition" }
        advance: { $ref: "#/components/schemas/RuntimeAdvance" }
        visibility: { $ref: "#/components/schemas/PageVisibility", description: "Emitted only on pages that author a schedule. It is the identical snake_case object stored on the playlist page, deliberately outside contractVersion screenrig.canvas/v1." }
        placements: { type: array, minItems: 1, maxItems: 24, items: { $ref: "#/components/schemas/RuntimePlacement" }, description: Source array order is the deterministic tie-breaker for equal layers. }
    RuntimeCanvas:
      type: object
      additionalProperties: false
      required: [width, height, viewportFit, background]
      properties:
        width: { type: number, exclusiveMinimum: 0 }
        height: { type: number, exclusiveMinimum: 0 }
        viewportFit: { type: string, enum: [contain, cover, fill] }
        background: { $ref: "#/components/schemas/CanvasBackground" }
    RuntimeRect:
      type: object
      additionalProperties: false
      required: [x, y, width, height]
      properties:
        x: { type: number }
        y: { type: number }
        width: { type: number, exclusiveMinimum: 0 }
        height: { type: number, exclusiveMinimum: 0 }
    RuntimeIntrinsicSize:
      type: object
      additionalProperties: false
      required: [width, height]
      properties:
        width: { type: number, exclusiveMinimum: 0 }
        height: { type: number, exclusiveMinimum: 0 }
    RuntimeTransition:
      type: object
      additionalProperties: false
      required: [type, durationMs]
      properties:
        type: { type: string, enum: [crossfade] }
        durationMs: { type: integer }
    RuntimeAdvance:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode: { type: string, enum: [duration, application, media_end] }
        afterMs: { type: integer }
        maxMs: { type: integer }
    RuntimePlacement:
      oneOf:
        - { $ref: "#/components/schemas/RuntimeApplicationPlacement" }
        - { $ref: "#/components/schemas/RuntimeImagePlacement" }
        - { $ref: "#/components/schemas/RuntimeVideoPlacement" }
        - { $ref: "#/components/schemas/RuntimeIframePlacement" }
    RuntimeApplicationPlacement:
      type: object
      additionalProperties: false
      required: [id, content, rect, layer, contentFit, capabilityHandle, capabilityExpiresAt]
      properties:
        id: { type: string }
        content: { $ref: "#/components/schemas/RuntimeApplicationContent" }
        rect: { $ref: "#/components/schemas/RuntimeRect" }
        layer: { type: integer, minimum: 0, maximum: 1024 }
        contentFit: { type: string, enum: [fill] }
        controller: { type: boolean }
        capabilityHandle: { type: string, minLength: 32, description: Opaque parent-only capability; never forward it into the uploaded iframe. }
        capabilityExpiresAt: { type: string, format: date-time, description: Five-minute expiry. Refresh the manifest before this time to obtain a replacement handle. }
    RuntimeImagePlacement:
      type: object
      additionalProperties: false
      required: [id, content, rect, layer, contentFit]
      properties:
        id: { type: string }
        content: { $ref: "#/components/schemas/RuntimeImageContent" }
        rect: { $ref: "#/components/schemas/RuntimeRect" }
        layer: { type: integer, minimum: 0, maximum: 1024 }
        contentFit: { type: string, enum: [contain, cover, fill] }
    RuntimeVideoPlacement:
      type: object
      additionalProperties: false
      required: [id, content, rect, layer, contentFit]
      properties:
        id: { type: string }
        content: { $ref: "#/components/schemas/RuntimeVideoContent" }
        rect: { $ref: "#/components/schemas/RuntimeRect" }
        layer: { type: integer, minimum: 0, maximum: 1024 }
        contentFit: { type: string, enum: [contain, cover, fill] }
    RuntimeIframePlacement:
      type: object
      additionalProperties: false
      required: [id, content, rect, layer, contentFit]
      properties:
        id: { type: string }
        content: { $ref: "#/components/schemas/RuntimeIframeContent" }
        rect: { $ref: "#/components/schemas/RuntimeRect" }
        layer: { type: integer, minimum: 0, maximum: 1024 }
        contentFit: { type: string, enum: [fill] }
    RuntimeContent:
      oneOf:
        - { $ref: "#/components/schemas/RuntimeApplicationContent" }
        - { $ref: "#/components/schemas/RuntimeImageContent" }
        - { $ref: "#/components/schemas/RuntimeVideoContent" }
        - { $ref: "#/components/schemas/RuntimeIframeContent" }
      discriminator: { propertyName: type }
    RuntimeApplicationContent:
      type: object
      additionalProperties: false
      required: [type, applicationId, releaseId, launchUrl, origin, protocol, grantId, package]
      properties:
        type: { type: string, enum: [application] }
        applicationId: { type: string }
        releaseId: { type: string }
        launchUrl: { type: string }
        origin: { type: string }
        protocol: { type: string, enum: ["1"] }
        grantId: { type: string }
        package: { $ref: "#/components/schemas/RuntimeApplicationPackage" }
    RuntimeApplicationPackage:
      type: object
      additionalProperties: false
      description: >-
        Immutable normalized package built only from the independently validated application tree. Native players
        verify bytes and SHA-256 before atomically retaining this release for offline last-known-good restoration.
        The URL is an authorization-bound transport reference, not a public or durable object URL.
      required: [version, url, bytes, sha256, entrypoint, contentType]
      properties:
        version: { type: string, enum: ["screenrig.webapp-package/v1"] }
        url: { type: string, format: uri, description: "Same-origin protected path under /content/v1/manifests/{manifest_revision}/releases/{release_id}/package; production uses https://play.screenrig.ai." }
        bytes: { type: integer, minimum: 1, maximum: 272629760 }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        entrypoint: { type: string, enum: [index.html] }
        contentType: { type: string, enum: ["application/vnd.screenrig.webapp-package+tar+gzip"] }
    RuntimeImageContent:
      type: object
      additionalProperties: false
      required: [type, items, oneAtATime, grantId]
      properties:
        type: { type: string, enum: [image] }
        items: { type: array, minItems: 1, maxItems: 32, items: { $ref: "#/components/schemas/RuntimeImageItem" } }
        oneAtATime: { type: boolean }
        grantId: { type: string }
        alt: { type: string }
        dwellMs: { type: integer, minimum: 1000, maximum: 86400000 }
    RuntimeImageItem:
      type: object
      additionalProperties: false
      required: [mediaId, src, intrinsicSize, sha256, bytes, contentType]
      properties:
        mediaId: { type: string }
        src: { type: string }
        intrinsicSize: { $ref: "#/components/schemas/RuntimeIntrinsicSize" }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$", description: Immutable content digest for integrity and optional native caching; not an authorization capability. }
        bytes: { type: integer, minimum: 1, maximum: 1073741824 }
        contentType: { type: string, enum: [image/png, image/jpeg, image/webp, image/gif] }
    RuntimeVideoContent:
      type: object
      additionalProperties: false
      required: [type, items, oneAtATime, muted, loop, grantId]
      properties:
        type: { type: string, enum: [video] }
        items: { type: array, minItems: 1, maxItems: 32, items: { $ref: "#/components/schemas/RuntimeVideoItem" } }
        oneAtATime: { type: boolean }
        muted: { type: boolean }
        loop: { type: boolean }
        grantId: { type: string }
    RuntimeVideoItem:
      type: object
      additionalProperties: false
      required: [mediaId, src, intrinsicSize, sha256, bytes, contentType]
      properties:
        mediaId: { type: string }
        src: { type: string }
        intrinsicSize: { $ref: "#/components/schemas/RuntimeIntrinsicSize" }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$", description: Immutable content digest for integrity and optional native caching; not an authorization capability. }
        bytes: { type: integer, minimum: 1, maximum: 1073741824 }
        contentType: { type: string, enum: [video/mp4, video/webm] }
        codecs: { $ref: "#/components/schemas/RuntimeCodecs" }
    RuntimeCodecs:
      type: string
      maxLength: 128
      pattern: "^[A-Za-z0-9]{3,9}(\\.[A-Za-z0-9]{1,10}){0,5}(,[A-Za-z0-9]{3,9}(\\.[A-Za-z0-9]{1,10}){0,5})*$"
      description: >-
        Server-derived RFC 6381 codec list for this exact rendition, never
        client-declared. It is a sibling of contentType, not a parameter inside
        it; a player composes a capability query as contentType, a semicolon, and
        codecs="VALUE". Every stored ready video carries a derived codec, because
        video whose codec cannot be established is rejected at upload rather than
        stored without it. This property is optional for one reason only: runtime
        content schemas are additionalProperties:false, so emission stays off
        until every player pinned in components.lock.json accepts the field. It
        becomes required once that rollout completes. A player must not read an
        absent value as an unsupported codec. This release emits exactly one
        video-track entry; the comma-separated grammar is published now so a later
        audio entry is additive.
    RuntimeIframeContent:
      type: object
      additionalProperties: false
      required: [type, src, title]
      properties:
        type: { type: string, enum: [iframe] }
        src: { type: string }
        title: { type: string }
    RuntimeReport:
      oneOf:
        - { $ref: "#/components/schemas/ManifestActivatedReport" }
        - { $ref: "#/components/schemas/PlaybackVideoStartedReport" }
        - { $ref: "#/components/schemas/ApplicationEventReport" }
        - { $ref: "#/components/schemas/RuntimeConditionReport" }
    ManifestActivatedReport: { type: object, additionalProperties: false, required: [severity, code, context], properties: { severity: { type: string, enum: [info] }, code: { type: string, enum: [manifest.activated] }, context: { $ref: "#/components/schemas/ManifestActivatedContext" } } }
    ManifestActivatedContext: { type: object, additionalProperties: false, required: [manifest_revision], properties: { manifest_revision: { type: string, pattern: "^man_" } } }
    PlaybackVideoStartedReport: { type: object, additionalProperties: false, required: [severity, code, context], properties: { severity: { type: string, enum: [info] }, code: { type: string, enum: [playback.video_started] }, context: { $ref: "#/components/schemas/PlaybackVideoStartedContext" } } }
    PlaybackVideoStartedContext: { type: object, additionalProperties: false, required: [media_id, manifest_revision, page_id], properties: { media_id: { type: string, pattern: "^med_" }, manifest_revision: { type: string, pattern: "^man_" }, page_id: { type: string, pattern: "^[A-Za-z][A-Za-z0-9_-]{0,63}$" } } }
    ApplicationEventReport: { type: object, additionalProperties: false, required: [severity, code, context], properties: { severity: { type: string, enum: [info] }, code: { type: string, enum: [application.event] }, context: { $ref: "#/components/schemas/ApplicationEventContext" } } }
    ApplicationEventContext: { type: object, additionalProperties: false, required: [placement_id, code], properties: { placement_id: { type: string, pattern: "^[A-Za-z][A-Za-z0-9_-]{0,63}$" }, code: { type: string, pattern: "^[A-Za-z0-9._-]{1,64}$" } } }
    RuntimeConditionReport: { type: object, additionalProperties: false, required: [severity, code, context], properties: { severity: { type: string, enum: [info, warning, error] }, code: { type: string, pattern: "^[a-z0-9._-]{1,80}$", not: { enum: [manifest.activated, playback.video_started, application.event] } }, context: { type: object, additionalProperties: true } } }
    ReleaseLaunch: { type: object, additionalProperties: false, required: [launch_url, expires_at], properties: { launch_url: { type: string }, expires_at: { type: string } } }
    ProblemField: { type: object, additionalProperties: false, required: [field, code, detail], properties: { field: { type: string }, code: { type: string }, detail: { type: string } } }
    NextAction: { type: object, additionalProperties: false, required: [command, reason], properties: { command: { type: string }, reason: { type: string } } }
    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status, detail, instance, code, request_id, errors]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
