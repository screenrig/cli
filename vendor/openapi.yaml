        refetch: { type: integer, minimum: 0, maximum: 9007199254740991 }
        repair: { type: integer, minimum: 0, maximum: 9007199254740991 }
        failed: { type: integer, minimum: 0, maximum: 9007199254740991 }
    ScreenStorageShortfall:
      type: object
      additionalProperties: false
      required: [at, fit, required_bytes, capacity_bytes, excluded_page_count]
      description: >-
        Present while the player's reported fit is partial, transition_blocked,
