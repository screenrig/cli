        change screen revision or manifest authority and is never authorization.
      properties:
        at: { type: string, format: date-time }
        fit: { type: string, enum: [partial, transition_blocked, none_fit] }
        required_bytes: { type: integer, minimum: 0, maximum: 9007199254740991 }
        capacity_bytes: { type: integer, minimum: 0, maximum: 9007199254740991 }
        excluded_page_count: { type: integer, minimum: 0, maximum: 100 }
    ScreenStorageForecast:
      type: object
      additionalProperties: false
      required: [manifest_revision, fit, excluded_page_count, basis, received_at]
      description: >-
        Approximate steady-state target selection (plan A.3 only, no
        transition) from the last reported capacity and the screen's desired
        manifest. Absent without a storage report, which consumers read as
        unknown. basis is reported_capacity. Recomputed when a storage report
        arrives and when the screen's manifest revision changes. Never
