        archive rather than delete, and authoring stays in the agent
        conversation and the CLI.
      security: [{ dashboardSession: [] }]
      responses:
        "200": { description: Screen, headers: { Cache-Control: { schema: { type: string, enum: ["private, no-store"] } } }, content: { application/json: { schema: { $ref: "#/components/schemas/Screen" } } } }
