    PlaylistImagePrimitiveWrite: { type: object, additionalProperties: false, required: [id, primitive, selector, rect, layer, content_fit], properties: { id: { type: string, pattern: "^[A-Za-z][A-Za-z0-9_-]{0,63}$" }, primitive: { type: string, enum: [image] }, selector: { $ref: "#/components/schemas/PlaylistMediaSelector" }, alt: { type: string, maxLength: 300 }, dwell_ms: { type: integer, minimum: 1000, maximum: 86400000, description: Required on media_end image primitives. Forbidden on duration and application pages. }, rect: { $ref: "#/components/schemas/PlaylistRect" }, layer: { type: integer, minimum: 0, maximum: 1024 }, content_fit: { type: string, enum: [contain, cover, fill] }, enter: { $ref: "#/components/schemas/PrimitiveEnter" } } }
    PlaylistVideoPrimitiveWrite: { type: object, additionalProperties: false, required: [id, primitive, selector, rect, layer, content_fit], properties: { id: { type: string, pattern: "^[A-Za-z][A-Za-z0-9_-]{0,63}$" }, primitive: { type: string, enum: [video] }, selector: { $ref: "#/components/schemas/PlaylistMediaSelector" }, muted: { type: boolean, enum: [true], default: true }, loop: { type: boolean, default: false }, rect: { $ref: "#/components/schemas/PlaylistRect" }, layer: { type: integer, minimum: 0, maximum: 1024 }, content_fit: { type: string, enum: [contain, cover, fill] }, enter: { $ref: "#/components/schemas/PrimitiveEnter" } } }
    PlaylistIframePrimitiveWrite: { type: object, additionalProperties: false, required: [id, primitive, src, title, rect, layer, content_fit], properties: { id: { type: string, pattern: "^[A-Za-z][A-Za-z0-9_-]{0,63}$" }, primitive: { type: string, enum: [iframe] }, src: { type: string, format: uri, pattern: "^https://" }, title: { type: string, minLength: 1, maxLength: 200 }, rect: { $ref: "#/components/schemas/PlaylistRect" }, layer: { type: integer, minimum: 0, maximum: 1024 }, content_fit: { type: string, enum: [fill] }, enter: { $ref: "#/components/schemas/PrimitiveEnter" } } }
    PlaylistApplicationPrimitive: { allOf: [{ $ref: "#/components/schemas/PlaylistApplicationPrimitiveWrite" }] }
    PlaylistImagePrimitive: { type: object, additionalProperties: false, required: [id, primitive, selector, resolved_media, rect, layer, content_fit, controller], properties: { id: { type: string }, primitive: { type: string, enum: [image] }, selector: { $ref: "#/components/schemas/PlaylistMediaSelector" }, resolved_media: { type: array, minItems: 1, maxItems: 32, items: { $ref: "#/components/schemas/PlaylistResolvedMedia" }, description: Server-resolved selector matches. Clients must not send this field. }, alt: { type: string, maxLength: 300 }, dwell_ms: { type: integer, minimum: 1000, maximum: 86400000 }, rect: { $ref: "#/components/schemas/PlaylistRect" }, layer: { type: integer, minimum: 0, maximum: 1024 }, content_fit: { type: string, enum: [contain, cover, fill] }, controller: { type: boolean, enum: [false] }, enter: { $ref: "#/components/schemas/PrimitiveEnter" } } }
    PlaylistVideoPrimitive: { type: object, additionalProperties: false, required: [id, primitive, selector, resolved_media, muted, loop, rect, layer, content_fit, controller], properties: { id: { type: string }, primitive: { type: string, enum: [video] }, selector: { $ref: "#/components/schemas/PlaylistMediaSelector" }, resolved_media: { type: array, minItems: 1, maxItems: 32, items: { $ref: "#/components/schemas/PlaylistResolvedMedia" }, description: Server-resolved selector matches. Clients must not send this field. }, muted: { type: boolean, enum: [true] }, loop: { type: boolean }, rect: { $ref: "#/components/schemas/PlaylistRect" }, layer: { type: integer, minimum: 0, maximum: 1024 }, content_fit: { type: string, enum: [contain, cover, fill] }, controller: { type: boolean, enum: [false] }, enter: { $ref: "#/components/schemas/PrimitiveEnter" } } }
    PlaylistIframePrimitive: { type: object, additionalProperties: false, required: [id, primitive, src, title, rect, layer, content_fit, controller], properties: { id: { type: string }, primitive: { type: string, enum: [iframe] }, src: { type: string, format: uri, pattern: "^https://" }, title: { type: string, minLength: 1, maxLength: 200 }, rect: { $ref: "#/components/schemas/PlaylistRect" }, layer: { type: integer, minimum: 0, maximum: 1024 }, content_fit: { type: string, enum: [fill] }, controller: { type: boolean, enum: [false] }, enter: { $ref: "#/components/schemas/PrimitiveEnter" } } }
    PlaylistMediaSelector:
      oneOf:
        - { $ref: "#/components/schemas/PlaylistMediaSelectorByID" }
        - { $ref: "#/components/schemas/PlaylistMediaSelectorByIDs" }
        - { $ref: "#/components/schemas/PlaylistMediaSelectorByAll" }
        - { $ref: "#/components/schemas/PlaylistMediaSelectorByTag" }
      discriminator: { propertyName: by }
