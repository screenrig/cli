        default: { $ref: "#/components/responses/Problem" }
  /api/v1/events:
    get:
      operationId: listEvents
      description: >-
        Lists durable project events ascending by sequence. Paging is
        contiguous: pass the returned next_cursor as after to continue exactly
        where the page stopped. next_cursor is the cursor of the last returned
        event while newer events already exist, and null at the end of the
        history. limit defaults to 50 and accepts 1-200; a value outside that
        range is refused with invalid_request and an errors[] member naming
        limit. Offset paging is not supported.
      security: [{ projectBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/AfterCursor" }, { $ref: "#/components/parameters/EventListLimit" }]
      responses:
        "200": { description: Durable events, content: { application/json: { schema: { $ref: "#/components/schemas/EventList" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/events/stream:
    get:
      operationId: streamEvents
      description: >-
        Replayable project listen stream. Opening this request costs 1 credit
        as the listen subscribe. Credit headers are omitted. Later billed
        events cost 1 credit each; screen.*, runtime.*, and application.event
        are exempt screen-conversation messages. Heartbeats and the retry
        preamble never charge. stream.cursor and stream.resync_required are
        billed. Debit idempotency is sse-event:<project_id>:<sequence>, so
        reconnect replay is free. An unpaid billed event is not written and
        the stream closes.
      security: [{ projectBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/AfterCursor" }, { $ref: "#/components/parameters/LastEventID" }]
      responses:
        "200": { description: "Replayable SSE stream. The query cursor takes precedence over Last-Event-ID. Invalid, future, or pre-retention cursors receive stream.resync_required at the current head and close. No ScreenRig-Credits-* headers.", content: { text/event-stream: { schema: { type: string } } } }
        "402": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/project/capabilities:
    get:
      operationId: getProjectCapabilities
      description: The calling project's plan, independent advertiser/screens flags with their revision, and the derived effective capability set. Never reflects a client claim; an unknown plan fails closed as forbidden.
      security: [{ projectBearer: [] }]
      responses:
        "200": { description: Project capabilities., headers: { Cache-Control: { schema: { type: string, enum: ["private, no-store"] } } }, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectCapabilities" } } } }
        "403": { description: "forbidden - the project plan is not in the catalog.", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/billing/balance:
    get:
      operationId: getBillingBalance
      description: The calling project's source-aware balance snapshot. All millicredit amounts are canonical decimal strings. It is a snapshot, not authority to pay; rails_available is false while card, tax and cash-out rail are unavailable.
      security: [{ projectBearer: [] }]
      responses:
        "200": { description: Balance snapshot., content: { application/json: { schema: { $ref: "#/components/schemas/BillingBalance" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/billing/statement:
    get:
      operationId: getBillingStatement
      description: Stable cursor pagination over immutable posted journal entries for the calling project. Holds are not posted entries. Corrections link to the original event instead of rewriting it. There is no arbitrary grant or payout mutation on this surface.
      security: [{ projectBearer: [] }]
      parameters:
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200": { description: Statement page., content: { application/json: { schema: { $ref: "#/components/schemas/BillingStatement" } } } }
        "400": { description: "invalid_request - limit is out of range.", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/advertising/network:
    get:
      operationId: getAdvertisingNetwork
      description: The calling seller's one network, including its resolved ScreenRig serving fee. Sellers cannot change that fee.
      security: [{ projectBearer: [] }]
      responses:
        "200": { description: Network., content: { application/json: { schema: { $ref: "#/components/schemas/AdvertisingNetwork" } } } }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createAdvertisingNetwork
      description: Creates the calling seller's one network if absent. Requires screens=true. Idempotent; repeating returns the same network.
      security: [{ projectBearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdvertisingNetworkCreate" } } } }
      responses:
        "200": { description: Network., content: { application/json: { schema: { $ref: "#/components/schemas/AdvertisingNetwork" } } } }
        "403": { description: "forbidden - the project lacks screen capability or has an unknown plan.", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/advertising/network/rate:
    post:
      operationId: setAdvertisingDefaultRate
      description: Sets the seller's project default rate per 15 seconds of completed playback. A change that alters an accepted campaign's effective rate pauses that whole campaign with price_change_pending; a masked or no-op change does not. If-Match carries the network revision.
      security: [{ projectBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/IfMatch" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdvertisingRate" } } } }
      responses:
        "200": { description: Updated network., content: { application/json: { schema: { $ref: "#/components/schemas/AdvertisingNetwork" } } } }
        "412": { description: "revision_conflict - If-Match is stale.", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/advertising/inventory:
    get:
      operationId: listAdvertisingInventory
      description: The calling seller's opted-in inventory.
      security: [{ projectBearer: [] }]
      responses:
        "200": { description: Inventory., content: { application/json: { schema: { $ref: "#/components/schemas/AdvertisingInventoryList" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/advertising/inventory/{screen_id}:
    put:
      operationId: putAdvertisingInventory
      description: Upserts one owned screen's inventory. Verifies screen ownership. A rate override of null restores inheritance, not zero. A change that alters an accepted campaign's effective rate pauses that campaign.
      security: [{ projectBearer: [] }]
      parameters: [{ name: screen_id, in: path, required: true, schema: { type: string } }, { $ref: "#/components/parameters/IfMatch" }, { $ref: "#/components/parameters/OptionalIdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdvertisingInventoryWrite" } } } }
      responses:
        "200": { description: Stored inventory., content: { application/json: { schema: { $ref: "#/components/schemas/AdvertisingInventory" } } } }
        "403": { description: "forbidden - the screen is not owned by this project.", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "412": { description: "revision_conflict.", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/advertising/slots:
    get:
      operationId: listAdvertisingSlots
      security: [{ projectBearer: [] }]
      responses:
        "200": { description: Slots., content: { application/json: { schema: { $ref: "#/components/schemas/AdvertisingSlotList" } } } }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createAdvertisingSlot
      description: Creates a reusable seller slot. Images are 5-30 seconds and videos at most the platform ceiling of 120 seconds. Ads are always muted.
      security: [{ projectBearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdvertisingSlotWrite" } } } }
      responses:
        "201": { description: Slotslot., content: { application/json: { schema: { $ref: "#/components/schemas/AdvertisingSlot" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/advertising/slots/{id}:
    post:
      operationId: updateAdvertisingSlot
      description: Updates one seller slot. If-Match carries the slot revision. A rate override change re-runs the pricing fence.
      security: [{ projectBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/ResourceID" }, { $ref: "#/components/parameters/IfMatch" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdvertisingSlotWrite" } } } }
      responses:
        "200": { description: Updated slot., content: { application/json: { schema: { $ref: "#/components/schemas/AdvertisingSlot" } } } }
        "412": { description: "revision_conflict.", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/advertising/memberships:
    get:
      operationId: listAdvertisingMemberships
      security: [{ projectBearer: [] }]
      responses:
        "200": { description: Memberships., content: { application/json: { schema: { $ref: "#/components/schemas/AdvertisingMembershipList" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/advertising/memberships/{id}:
    post:
      operationId: updateAdvertisingMembership
      description: Explicit seller policy/scope edit. An active membership is changed here, never by sending a second invitation. Scope changes stop new selection; financial history is preserved.
      security: [{ projectBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/ResourceID" }, { $ref: "#/components/parameters/IfMatch" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdvertisingMembershipScope" } } } }
      responses:
        "200": { description: Updated membership., content: { application/json: { schema: { $ref: "#/components/schemas/AdvertisingMembership" } } } }
        "412": { description: "revision_conflict.", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/advertising/memberships/{id}/revoke:
    post:
      operationId: revokeAdvertisingMembership
      description: Revokes one membership. Stops new selection for that network; it does not clear the advertiser flag, other memberships, or settled history.
      security: [{ projectBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/ResourceID" }]
      responses:
        "200": { description: Revoked membership., content: { application/json: { schema: { $ref: "#/components/schemas/AdvertisingMembership" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/advertising/networks:
    get:
      operationId: listAdvertisingJoinedNetworks
      description: Networks the calling advertiser currently belongs to, with the scope and review policy it was granted. Screen count is not a guaranteed impression count.
      security: [{ projectBearer: [] }]
      responses:
        "200": { description: Joined networks., content: { application/json: { schema: { $ref: "#/components/schemas/AdvertisingJoinedNetworkList" } } } }
        "403": { description: "forbidden - the project lacks the advertiser flag.", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/advertising/networks/{seller_project_id}/inventory:
    get:
      operationId: listAdvertisingJoinedInventory
      description: Opted-in inventory and reusable slots inside the caller's membership. Never exposes the seller's screenshots, playlists, or project-wide data.
      security: [{ projectBearer: [] }]
      parameters: [{ name: seller_project_id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Permitted inventory and slots., content: { application/json: { schema: { $ref: "#/components/schemas/AdvertisingJoinedInventory" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/advertising/creatives:
    get:
      operationId: listAdvertisingCreatives
      security: [{ projectBearer: [] }]
      responses:
        "200": { description: Creatives., content: { application/json: { schema: { $ref: "#/components/schemas/AdvertisingCreativeList" } } } }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createAdvertisingCreative
      description: Binds one ready owned media revision to an immutable creative. Does not copy bytes, re-upload, or re-charge generation. Unknown or non-ready media is rejected.
      security: [{ projectBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/OptionalIdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdvertisingCreativeCreate" } } } }
      responses:
        "201": { description: Creative., content: { application/json: { schema: { $ref: "#/components/schemas/AdvertisingCreative" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/advertising/creatives/{id}:
    get:
      operationId: getAdvertisingCreative
      security: [{ projectBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/ResourceID" }]
      responses:
        "200": { description: Creative., content: { application/json: { schema: { $ref: "#/components/schemas/AdvertisingCreative" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/advertising/campaigns:
    get:
      operationId: listAdvertisingCampaigns
      security: [{ projectBearer: [] }]
      responses:
        "200": { description: Campaigns., content: { application/json: { schema: { $ref: "#/components/schemas/AdvertisingCampaignList" } } } }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createAdvertisingCampaign
      description: Creates a draft campaign. Drafts hold no money, reserve nothing, and authorize no delivery. Activation requires an explicitly accepted quote.
      security: [{ projectBearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdvertisingCampaignDraft" } } } }
      responses:
        "201": { description: Draft campaign., content: { application/json: { schema: { $ref: "#/components/schemas/AdvertisingCampaign" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/advertising/campaigns/{id}:
    get:
      operationId: getAdvertisingCampaign
      security: [{ projectBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/ResourceID" }]
      responses:
        "200": { description: Campaign., content: { application/json: { schema: { $ref: "#/components/schemas/AdvertisingCampaign" } } } }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: updateAdvertisingCampaign
      description: Updates a draft campaign. If-Match carries the campaign revision. A budget reduction below already spent plus committed reservations is rejected with the minimum permitted value.
      security: [{ projectBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/ResourceID" }, { $ref: "#/components/parameters/IfMatch" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdvertisingCampaignDraft" } } } }
      responses:
        "200": { description: Updated campaign., content: { application/json: { schema: { $ref: "#/components/schemas/AdvertisingCampaign" } } } }
        "412": { description: "revision_conflict.", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/advertising/campaigns/{id}/quote:
    post:
      operationId: quoteAdvertisingCampaign
      description: Prices the campaign's current effective rates, formats, durations, flight and caps before activation. The quote is time-bounded and becomes stale when any pricing generation or effective rate changes.
      security: [{ projectBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/ResourceID" }, { $ref: "#/components/parameters/IfMatch" }]
      responses:
        "201": { description: Quote., content: { application/json: { schema: { $ref: "#/components/schemas/AdvertisingQuote" } } } }
        "412": { description: "revision_conflict.", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/advertising/campaigns/{id}/activate:
    post:
      operationId: activateAdvertisingCampaign
      description: Explicitly accepts the named current quote and activates the campaign. Atomically checks ownership, membership, quote expiry, rate revisions, accepted scope and same-project denial, then records purchase terms. No wallet debit and no seller revenue occur from accepting terms. The same key with the same body replays; a changed body is a conflict.
      security: [{ projectBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/ResourceID" }, { $ref: "#/components/parameters/IfMatch" }, { $ref: "#/components/parameters/OptionalIdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdvertisingQuoteAccept" } } } }
      responses:
        "200": { description: Active or pending-review campaign., content: { application/json: { schema: { $ref: "#/components/schemas/AdvertisingCampaign" } } } }
        "409": { description: "quote_stale or self_deal or resource_conflict.", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/advertising/campaigns/{id}/pause:
    post:
      operationId: pauseAdvertisingCampaign
      description: Pauses new reservations for this campaign. Already-started valid ads normally finish and are charged on completion.
      security: [{ projectBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/ResourceID" }, { $ref: "#/components/parameters/IfMatch" }]
      responses:
        "200": { description: Paused campaign., content: { application/json: { schema: { $ref: "#/components/schemas/AdvertisingCampaign" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/advertising/campaigns/{id}/resume:
    post:
      operationId: resumeAdvertisingCampaign
      description: Resumes a manually paused campaign. It cannot clear a price_change_pending block; a top-up, schedule tick, or seller action cannot supply that consent.
      security: [{ projectBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/ResourceID" }, { $ref: "#/components/parameters/IfMatch" }]
      responses:
        "200": { description: Resumed campaign., content: { application/json: { schema: { $ref: "#/components/schemas/AdvertisingCampaign" } } } }
        "409": { description: "price_change_pending - accept current rates first.", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/advertising/campaigns/{id}/accept-rates:
    post:
      operationId: acceptAdvertisingRates
      description: The buyer's explicit acceptance of changed effective rates, bound to quote ID, campaign revision and current pricing generations. It atomically replaces future delivery terms, records the actor and time, and clears the sticky price-change block. Another concurrent rate change leaves the campaign paused.
      security: [{ projectBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/ResourceID" }, { $ref: "#/components/parameters/IfMatch" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdvertisingQuoteAccept" } } } }
      responses:
        "200": { description: Reactivated campaign., content: { application/json: { schema: { $ref: "#/components/schemas/AdvertisingCampaign" } } } }
        "409": { description: "price_change_pending or quote_stale.", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/advertising/reviews:
    get:
      operationId: listAdvertisingReviews
      description: Creative versions submitted to the calling seller for review. A seller sees only exact submitted creative, never the buyer's library.
      security: [{ projectBearer: [] }]
      responses:
        "200": { description: Reviews., content: { application/json: { schema: { $ref: "#/components/schemas/AdvertisingReviewList" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/advertising/reviews/{id}/approve:
    post:
      operationId: approveAdvertisingReview
      description: Approves one exact submitted creative revision. Approval does not choose the buyer's budget or grant access to its media library.
      security: [{ projectBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/ResourceID" }]
      responses:
        "200": { description: Approved review., content: { application/json: { schema: { $ref: "#/components/schemas/AdvertisingReview" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/advertising/reviews/{id}/reject:
    post:
      operationId: rejectAdvertisingReview
      security: [{ projectBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/ResourceID" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdvertisingReviewRejection" } } } }
      responses:
        "200": { description: Rejected review., content: { application/json: { schema: { $ref: "#/components/schemas/AdvertisingReview" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/advertising/reports/spend:
    get:
      operationId: getAdvertisingSpend
      description: Buyer-scoped spend and delivery counts for one campaign. Amounts are decimal mcr strings. It never exposes the seller's income, bank status, or project-wide usage.
      security: [{ projectBearer: [] }]
      parameters: [{ name: campaign_id, in: query, required: true, schema: { type: string } }]
      responses:
        "200": { description: Spend report., content: { application/json: { schema: { $ref: "#/components/schemas/AdvertisingSpendReport" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/advertising/reports/delivery:
    get:
      operationId: getAdvertisingDelivery
      description: Seller-scoped gross, serving fee and net for one window, with its own delivery evidence. It never exposes the buyer's wallet or other networks. Only authorized completed-play evidence establishes billable delivery.
      security: [{ projectBearer: [] }]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
      responses:
        "200": { description: Delivery report., content: { application/json: { schema: { $ref: "#/components/schemas/AdvertisingDeliveryReport" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/playback:
    get:
      operationId: listPlaybackAggregates
      security: [{ projectBearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/PlaybackScreenID" }
        - { $ref: "#/components/parameters/PlaybackMediaID" }
        - { $ref: "#/components/parameters/PlaybackDay" }
      responses:
        "200": { description: "Daily playback aggregates for the calling project, images and videos alike. One row per screen, media, and UTC day. Newest days first. Identifiers filter the caller's own rows and are never a cross-project lookup.", content: { application/json: { schema: { $ref: "#/components/schemas/PlaybackAggregateList" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/applications/{application_id}/kv:
    get:
      operationId: listKV
      security: [{ projectBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/ApplicationID" }]
      responses:
        "200": { description: KV entries, content: { application/json: { schema: { $ref: "#/components/schemas/KVList" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/applications/{application_id}/kv/{key}:
    parameters: [{ $ref: "#/components/parameters/ApplicationID" }, { name: key, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getKV
      security: [{ projectBearer: [] }]
      responses:
        "200": { description: KV entry, content: { application/json: { schema: { $ref: "#/components/schemas/KVEntry" } } } }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: putKV
      security: [{ projectBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/OptionalIfMatch" }, { $ref: "#/components/parameters/OptionalIdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/KVWrite" } } } }
      responses:
        "200": { description: KV entry, content: { application/json: { schema: { $ref: "#/components/schemas/KVEntry" } } } }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteKV
      security: [{ projectBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/IfMatch" }, { $ref: "#/components/parameters/OptionalIdempotencyKey" }]
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/media:
    get:
      operationId: listMedia
      security: [{ projectBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/MediaTagQuery" }, { $ref: "#/components/parameters/MediaPrimitiveQuery" }]
      responses:
        "200": { description: Media, content: { application/json: { schema: { $ref: "#/components/schemas/MediaList" } } } }
  /api/v1/media/generations:
    post:
      operationId: createMediaGeneration
      description: >-
        Generate one still image from a prompt, store it as ready private project
        media, and return a MediaGeneration object on the original POST. The handler
        waits for the vendor still and does not return a pollable Operation. The
        response is MediaGeneration: the ready Media object plus usage (quality,
        credits, usd). It never includes image bytes, b64_json, object keys, signed
