    PlaylistMediaSelectorByTag: { type: object, additionalProperties: false, required: [by, tag], properties: { by: { type: string, enum: [tag] }, tag: { type: string, pattern: "^[A-Za-z0-9]{1,32}$" }, one_at_a_time: { type: boolean, default: false } } }
    PlaylistResolvedMedia: { type: object, additionalProperties: false, required: [media_id, intrinsic_size], properties: { media_id: { type: string, pattern: "^med_" }, intrinsic_size: { $ref: "#/components/schemas/PlaylistIntrinsicSize" } } }
    CanvasColor: { type: string, pattern: "^#[0-9A-F]{8}$", description: Canonical uppercase sRGB RRGGBBAA. }
    LinearGradientStop:
      type: object
      additionalProperties: false
      required: [at, color]
      description: One stop on a top-to-bottom linear canvas background. at=0 is the top edge, at=1 is the bottom edge.
      properties:
        at: { type: number, minimum: 0, maximum: 1 }
        color: { $ref: "#/components/schemas/CanvasColor" }
    LinearGradientBackground:
      type: object
      additionalProperties: false
      required: [type, stops]
      description: Top-to-bottom linear gradient. There is no angle field. stops has 2 through 8 entries, strictly increasing at in [0, 1], first at=0, last at=1.
      properties:
        type: { type: string, enum: [linear] }
        stops: { type: array, minItems: 2, maxItems: 8, items: { $ref: "#/components/schemas/LinearGradientStop" } }
    CanvasBackground:
      oneOf:
        - { $ref: "#/components/schemas/CanvasColor" }
        - { $ref: "#/components/schemas/LinearGradientBackground" }
      description: "Solid canonical uppercase #RRGGBBAA, or a top-to-bottom linear gradient."
    PlaylistIntrinsicSize: { type: object, additionalProperties: false, required: [width, height], properties: { width: { type: number, exclusiveMinimum: 0 }, height: { type: number, exclusiveMinimum: 0 } } }
    PlaylistList: { type: object, additionalProperties: false, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Playlist" } } } }
    CommentsWrite:
      type: object
      additionalProperties: false
      required: [comments]
      properties:
        comments: { type: object, additionalProperties: true, description: "Opaque agent JSON object. Compact UTF-8 serialization must be at most 1024 bytes. Nested objects, arrays, and strings are allowed. Arrays, strings, numbers, booleans, and null are rejected as the comments value itself." }
    Comments:
      type: object
      additionalProperties: false
      required: [comments]
      properties:
        comments:
          oneOf:
            - { type: object, additionalProperties: true }
            - { type: "null" }
          description: "Opaque agent JSON object when set. Null when the target exists and comments are unset."
    ScreenPatch: { type: object, additionalProperties: false, minProperties: 1, properties: { name: { type: string, minLength: 1, maxLength: 120 }, playlist_id: { type: string }, timezone: { type: string, minLength: 1, maxLength: 64, description: "IANA time zone identifier, for example America/Los_Angeles. It is the zone every page visibility rule on this screen is evaluated in. Changing it remints the manifest revision. A screen assigned a playlist that uses page visibility must have one." } } }
    PairScreen: { type: object, additionalProperties: false, required: [code], properties: { code: { type: string, pattern: "^[23456789ABCDEFGHJKMNPQRSTUVWXYZ]{6}$" }, label: { type: string, minLength: 1, maxLength: 120 } } }
    ProvisionScreen: { type: object, additionalProperties: false, properties: { label: { type: string, minLength: 1, maxLength: 120 } } }
    ScreenProvisioning: { type: object, additionalProperties: false, required: [screen, public_url, provisioning_url, expires_at], properties: { screen: { $ref: "#/components/schemas/Screen" }, public_url: { type: string, format: uri }, provisioning_url: { type: string, pattern: "^https?://[^#]+/s/[^#]+#provision=[A-Za-z0-9_-]{43}$" }, expires_at: { type: string, format: date-time } } }
    Screen:
      type: object
      additionalProperties: false
      required: [id, public_id, label, revision, manifest_revision, content_access_generation, state, online, created_at, updated_at]
      properties:
        id: { type: string }
        public_id: { type: string }
        label: { type: string }
        playlist_id: { type: string }
        timezone: { type: string, description: "IANA time zone identifier. Absent until it is set. Page visibility rules are evaluated in this zone." }
        observation: { $ref: "#/components/schemas/ScreenObservation" }
        comments: { type: object, additionalProperties: true, description: "Opaque agent JSON object, compact UTF-8 ≤ 1024 bytes. Absent when unset. ScreenRig never reads or uses it. ScreenPatch cannot write it. Not on the runtime manifest and never authorization." }
        revision: { type: integer }
        manifest_revision: { type: integer }
        content_access_generation: { type: integer }
        state: { type: string, enum: [pairing_pending, active, archived] }
        online:
          type: boolean
          description: >-
            True iff at least one paired GET /runtime/v1/events stream for this
            screen is currently connected, including a short reconnect window
            matching the EventSource retry of 3000ms. Anonymous and unpaired
            sessions may hold events.read and do not count. Always present: false
            until the first paired runtime SSE connect, and false for
            pairing_pending screens that have never opened runtime SSE. Derived
            from the live stream, not a player heartbeat or presence.write report.
            Read-only on the account API; ScreenPatch, pairing bodies, session
            bodies, and the runtime manifest cannot write it.
        last_online_at:
          type: string
          format: date-time
          description: >-
            Instant a paired runtime events stream last became connected. Present
            after the first successful paired runtime SSE connect. Unchanged by a
            reconnect that lands inside the online window. When offline, it is the
            last time the screen was online. Account cannot write it.
        last_ip:
          type: string
          maxLength: 45
          description: >-
            Last client IP observed when a paired runtime SSE connected, IPv4 or
            IPv6 textual form. Absent until the first paired runtime SSE connect.
            Operational metadata; IDs and IPs are never authorization. Account
            cannot write it.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ScreenList: { type: object, additionalProperties: false, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Screen" } } } }
    ScreenObservation:
      type: object
      additionalProperties: false
      required: [observed_at, surfaces]
      description: >-
