        kid: { type: string, pattern: "^[A-Za-z0-9_-]{43}$", description: Optional RFC 7638 SHA-256 JWK thumbprint; the server computes kid from the JWK. }
    NativePairingStart:
      type: object
      additionalProperties: true
      required: [kid, public_key, signature]
      description: Proof of private-key possession is required before enrollment or locator creation. Sign a fresh pairing.start challenge bound to the exact Idempotency-Key; unsigned starts are rejected. The optional host object is a hint about the device, not a credential; it is stored on the screen at claim and may open a recovery offer project-side. Unknown body members are ignored. The host hint is read tolerantly. An unknown host key is ignored and a malformed host field is dropped, never refused (docs/player-compatibility.md §1.1.1).
      properties:
