        "200": { description: Per-candidate filled or empty results in request order., headers: { Cache-Control: { schema: { type: string, enum: ["no-store"] } }, RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }, RateLimit: { $ref: "#/components/headers/RateLimit" } }, content: { application/json: { schema: { $ref: "#/components/schemas/RuntimeAdslotResolveResponse" } } } }
        "400": { description: "invalid_request - batch size, duplicate keys, or forecast window is invalid.", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "409": { description: "resource_conflict - a candidate was reused with a different request hash.", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /runtime/v1/adslots/events:
    servers: [{ url: https://play.screenrig.ai, description: Trusted player/runtime origin }]
    post:
      operationId: reportAdslotEvents
      description: Authenticated playback evidence. Events dedupe on screen and event ID. A valid completion consumes its held reservation once at the reserved price and fee, credits the seller gross and debits the serving fee in one transaction. A confirmed non-play terminal event releases the hold once. Completion received after release is unbillable and never debits fresh credits. Completion before start is held pending reconciliation.
