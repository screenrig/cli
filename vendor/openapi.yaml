      responses:
        "200": { description: Per-event outcomes., headers: { Cache-Control: { schema: { type: string, enum: ["no-store"] } } }, content: { application/json: { schema: { $ref: "#/components/schemas/RuntimeAdslotEventResponse" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /runtime/v1/observation:
    servers: [{ url: https://play.screenrig.ai, description: Trusted player/runtime origin }]
    put:
      operationId: putRuntimeObservation
      description: >-
        Reports the playback surface the paired player used for the last
        resolveLayout. Path does not name screen_id; the paired runtime session
        binds it. Body is JSON ScreenObservation: observed_at plus exactly one
        surface. Numbers are device-independent pixels and the device pixel
        ratio next to that layout surface, not canvas author size and not
        encoded screenshot size. They are range-checked only and are never
        proven hardware or authorization. Last write wins and replaces the
        whole surfaces array. An identical surfaces tuple (id, width, height,
        pixel_ratio, presentation) does not emit screen.surface_changed; a
        later observed_at on the same tuple is ignored. Unpaired and anonymous
        public sessions are forbidden. Native cookies are rejected; browser
        must not adopt header profiles. Prepaid remaining credit is not a
        gate. Observation is absent from GET /api/v1/screens until the first
        accepted report. ScreenPatch cannot write it.
