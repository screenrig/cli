        invalid_request. The shape exists so a client cannot persist argument values,
        credentials, or free-form environment data through it.
      properties:
        cli_version: { type: string, maxLength: 64, pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+([-+][0-9A-Za-z.-]{1,40})?$", description: "Semantic version of the calling client." }
        command: { type: string, maxLength: 128, pattern: "^[a-z][a-z0-9-]{0,31}( [a-z][a-z0-9-]{0,31}){0,3}$", description: "Command path only, as up to four lowercase words. Option flags and argument values are rejected." }
        platform: { type: string, maxLength: 40, pattern: "^[a-z0-9]{1,16}/[a-z0-9_]{1,16}$", description: "Operating system and architecture, for example linux/x64." }
    FeedbackSubmission:
      type: object
      additionalProperties: false
