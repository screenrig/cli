        observed_at: { type: string, format: date-time, description: Player clock at the observation. Last write wins; an identical surfaces tuple ignores a later timestamp. }
        surfaces: { type: array, minItems: 1, maxItems: 1, items: { $ref: "#/components/schemas/ScreenObservationSurface" } }
