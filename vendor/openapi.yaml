        fit: { type: string, enum: [fits, partial, none_fit] }
        excluded_page_count: { type: integer, minimum: 0 }
        basis: { type: string, enum: [reported_capacity] }
        received_at: { type: string, format: date-time }
    ScreenStorageForecastRequest:
      type: object
      additionalProperties: false
      required: [playlist_id]
      description: >-
        Body of the pre-assignment fit dry run. playlist_id must be a playlist
