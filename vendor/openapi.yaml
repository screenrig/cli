        timezone: { type: string, description: "IANA time zone identifier of the screen. Emitted only when the screen has one. Every page visibility rule in this manifest is evaluated in this zone. A manifest that carries any page visibility always carries it." }
        pages: { type: array, items: { $ref: "#/components/schemas/RuntimePage" } }
    RuntimePage:
      type: object
      additionalProperties: false
      required: [contractVersion, id, canvas, transition, advance, primitives]
      properties:
        contractVersion: { type: string, enum: [screenrig.canvas/v1] }
        id: { type: string }
        canvas: { $ref: "#/components/schemas/RuntimeCanvas" }
        transition: { $ref: "#/components/schemas/RuntimeTransition" }
        advance: { $ref: "#/components/schemas/RuntimeAdvance" }
        visibility: { $ref: "#/components/schemas/PageVisibility", description: "Emitted only on pages that author a schedule. It is the identical snake_case object stored on the playlist page, deliberately outside contractVersion screenrig.canvas/v1." }
        primitives: { type: array, minItems: 1, maxItems: 24, items: { $ref: "#/components/schemas/RuntimePrimitive" }, description: Source array order is the deterministic tie-breaker for equal layers. }
    RuntimeCanvas:
      type: object
      additionalProperties: false
      required: [width, height, viewportFit, background]
      properties:
        width: { type: number, exclusiveMinimum: 0 }
        height: { type: number, exclusiveMinimum: 0 }
        viewportFit: { type: string, enum: [contain, cover, fill] }
        background: { $ref: "#/components/schemas/CanvasBackground" }
    RuntimeRect:
      type: object
      additionalProperties: false
      required: [x, y, width, height]
      properties:
        x: { type: number }
        y: { type: number }
        width: { type: number, exclusiveMinimum: 0 }
        height: { type: number, exclusiveMinimum: 0 }
    RuntimeIntrinsicSize:
      type: object
      additionalProperties: false
      required: [width, height]
      properties:
        width: { type: number, exclusiveMinimum: 0 }
        height: { type: number, exclusiveMinimum: 0 }
    RuntimeTransition:
      type: object
      additionalProperties: false
      required: [type, durationMs]
      description: Authored page transition. The runtime mint passes type through; it does not rewrite swipe to crossfade.
      properties:
        type: { type: string, enum: [crossfade, swipe-left, swipe-right, swipe-up, swipe-down] }
        durationMs: { type: integer }
    RuntimeAdvance:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode: { type: string, enum: [duration, application, media_end] }
        afterMs: { type: integer }
        maxMs: { type: integer }
    RuntimePrimitive:
      oneOf:
        - { $ref: "#/components/schemas/RuntimeApplicationPrimitive" }
        - { $ref: "#/components/schemas/RuntimeImagePrimitive" }
        - { $ref: "#/components/schemas/RuntimeVideoPrimitive" }
        - { $ref: "#/components/schemas/RuntimeIframePrimitive" }
      discriminator: { propertyName: primitive }
    RuntimeApplicationPrimitive:
      type: object
      additionalProperties: false
      required: [id, primitive, applicationId, releaseId, launchUrl, origin, protocol, grantId, package, rect, layer, contentFit, capabilityHandle, capabilityExpiresAt]
      properties:
        id: { type: string }
        primitive: { type: string, enum: [application] }
        applicationId: { type: string }
        releaseId: { type: string }
        launchUrl: { type: string }
        origin: { type: string }
        protocol: { type: string, enum: ["1"] }
        grantId: { type: string }
        package: { $ref: "#/components/schemas/RuntimeApplicationPackage" }
        rect: { $ref: "#/components/schemas/RuntimeRect" }
        layer: { type: integer, minimum: 0, maximum: 1024 }
        contentFit: { type: string, enum: [fill] }
        controller: { type: boolean }
        enter: { $ref: "#/components/schemas/PrimitiveEnter" }
        capabilityHandle: { type: string, minLength: 32, description: Opaque parent-only capability; never forward it into the uploaded iframe. }
        capabilityExpiresAt: { type: string, format: date-time, description: Five-minute expiry. Refresh the manifest before this time to obtain a replacement handle. }
    RuntimeImagePrimitive:
      type: object
      additionalProperties: false
      required: [id, primitive, selector, resolvedMedia, grantId, rect, layer, contentFit]
      properties:
        id: { type: string }
        primitive: { type: string, enum: [image] }
        selector: { $ref: "#/components/schemas/RuntimeMediaSelector" }
        resolvedMedia: { type: array, minItems: 1, maxItems: 32, items: { $ref: "#/components/schemas/RuntimeImageResolvedMedia" } }
        grantId: { type: string }
        alt: { type: string }
        dwellMs: { type: integer, minimum: 1000, maximum: 86400000 }
        rect: { $ref: "#/components/schemas/RuntimeRect" }
        layer: { type: integer, minimum: 0, maximum: 1024 }
        contentFit: { type: string, enum: [contain, cover, fill] }
        enter: { $ref: "#/components/schemas/PrimitiveEnter" }
    RuntimeVideoPrimitive:
      type: object
      additionalProperties: false
      required: [id, primitive, selector, resolvedMedia, muted, loop, grantId, rect, layer, contentFit]
      properties:
        id: { type: string }
        primitive: { type: string, enum: [video] }
        selector: { $ref: "#/components/schemas/RuntimeMediaSelector" }
        resolvedMedia: { type: array, minItems: 1, maxItems: 32, items: { $ref: "#/components/schemas/RuntimeVideoResolvedMedia" } }
        muted: { type: boolean }
        loop: { type: boolean }
        grantId: { type: string }
        rect: { $ref: "#/components/schemas/RuntimeRect" }
        layer: { type: integer, minimum: 0, maximum: 1024 }
        contentFit: { type: string, enum: [contain, cover, fill] }
        enter: { $ref: "#/components/schemas/PrimitiveEnter" }
    RuntimeIframePrimitive:
      type: object
      additionalProperties: false
      required: [id, primitive, src, title, rect, layer, contentFit]
      properties:
        id: { type: string }
        primitive: { type: string, enum: [iframe] }
        src: { type: string }
        title: { type: string }
        rect: { $ref: "#/components/schemas/RuntimeRect" }
        layer: { type: integer, minimum: 0, maximum: 1024 }
        contentFit: { type: string, enum: [fill] }
        enter: { $ref: "#/components/schemas/PrimitiveEnter" }
    RuntimeMediaSelector:
      oneOf:
        - { $ref: "#/components/schemas/RuntimeMediaSelectorByID" }
        - { $ref: "#/components/schemas/RuntimeMediaSelectorByIDs" }
        - { $ref: "#/components/schemas/RuntimeMediaSelectorByAll" }
        - { $ref: "#/components/schemas/RuntimeMediaSelectorByTag" }
      discriminator: { propertyName: by }
    RuntimeMediaSelectorByID: { type: object, additionalProperties: false, required: [by, mediaId, oneAtATime], properties: { by: { type: string, enum: [id] }, mediaId: { type: string, pattern: "^med_" }, oneAtATime: { type: boolean, enum: [false] } } }
    RuntimeMediaSelectorByIDs: { type: object, additionalProperties: false, required: [by, mediaIds, oneAtATime], properties: { by: { type: string, enum: [ids] }, mediaIds: { type: array, minItems: 1, maxItems: 32, uniqueItems: true, items: { type: string, pattern: "^med_" } }, oneAtATime: { type: boolean } } }
    RuntimeMediaSelectorByAll: { type: object, additionalProperties: false, required: [by, oneAtATime], properties: { by: { type: string, enum: [all] }, oneAtATime: { type: boolean } } }
    RuntimeMediaSelectorByTag: { type: object, additionalProperties: false, required: [by, tag, oneAtATime], properties: { by: { type: string, enum: [tag] }, tag: { type: string, pattern: "^[A-Za-z0-9]{1,32}$" }, oneAtATime: { type: boolean } } }
    RuntimeApplicationPackage:
      type: object
      additionalProperties: false
      description: >-
        Immutable normalized package built only from the independently validated application tree. Native players
        verify bytes and SHA-256 before atomically retaining this release for offline last-known-good restoration.
        The URL is an authorization-bound transport reference, not a public or durable object URL.
      required: [version, url, bytes, sha256, entrypoint, contentType]
      properties:
        version: { type: string, enum: ["screenrig.webapp-package/v1"] }
        url:
          type: string
          format: uri-reference
          description: &manifest-bound-route >-
            Manifest-bound route. The runtime origin is the origin this session
            fetched /runtime/v1/manifest from; that origin is deployment
            configuration, so this binding is normative prose rather than a
            machine-readable constraint. A consumer resolves this value — an
            absolute URL or a root-relative path — against the runtime origin
            and requires all of the following of the resolved URL: its scheme,
            host, and effective port equal the runtime origin's, with
            default-port normalization (443 for https, 80 for http); it carries
            no query component, no fragment, and no user info; and its path is
            byte-for-byte exactly the route emitted for this field —
            /content/v1/manifests/{manifest_revision}/media/{media_id} for an
            image or video item, with the containing manifest revision and the
            item's mediaId, or
            /content/v1/manifests/{manifest_revision}/releases/{release_id}/package
            for an application package, with the containing manifest revision
            and the content's releaseId. A value that fails this binding makes
            the whole manifest invalid: the consumer rejects the manifest at
            parse time, before any credentialed fetch, and never requests the
            route. The sibling sha256 pins bytes after transfer; hash-pinning
            is never destination authorization and never relaxes this binding.
        bytes: { type: integer, minimum: 1, maximum: 272629760 }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        entrypoint: { type: string, enum: [index.html] }
        contentType: { type: string, enum: ["application/vnd.screenrig.webapp-package+tar+gzip"] }
    RuntimeImageResolvedMedia:
      type: object
      additionalProperties: false
      required: [mediaId, src, intrinsicSize, sha256, bytes, contentType]
      properties:
        mediaId: { type: string }
        src: { type: string, format: uri-reference, description: *manifest-bound-route }
        intrinsicSize: { $ref: "#/components/schemas/RuntimeIntrinsicSize" }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$", description: Immutable content digest for integrity and optional native caching; not an authorization capability. }
        bytes: { type: integer, minimum: 1, maximum: 1073741824 }
        contentType: { type: string, enum: [image/png, image/jpeg, image/webp, image/gif] }
    RuntimeVideoResolvedMedia:
      type: object
      additionalProperties: false
      required: [mediaId, src, intrinsicSize, sha256, bytes, contentType]
      properties:
        mediaId: { type: string }
        src: { type: string, format: uri-reference, description: *manifest-bound-route }
        intrinsicSize: { $ref: "#/components/schemas/RuntimeIntrinsicSize" }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$", description: Immutable content digest for integrity and optional native caching; not an authorization capability. }
        bytes: { type: integer, minimum: 1, maximum: 1073741824 }
        contentType: { type: string, enum: [video/mp4, video/webm] }
        codecs: { $ref: "#/components/schemas/RuntimeCodecs" }
    RuntimeCodecs:
      type: string
      maxLength: 128
      pattern: "^[A-Za-z0-9]{3,9}(\\.[A-Za-z0-9]{1,10}){0,5}(,[A-Za-z0-9]{3,9}(\\.[A-Za-z0-9]{1,10}){0,5})*$"
      description: >-
        Server-derived RFC 6381 codec list for this exact rendition, never
        client-declared. It is a sibling of contentType, not a parameter inside
        it; a player composes a capability query as contentType, a semicolon, and
        codecs="VALUE". Every stored ready video carries a derived codec, because
        video whose codec cannot be established is rejected at upload rather than
        stored without it. This property is optional for one reason only: runtime
        content schemas are additionalProperties:false, so emission stays off
        until every player pinned in components.lock.json accepts the field. It
        becomes required once that rollout completes. A player must not read an
        absent value as an unsupported codec. This release emits exactly one
        video-track entry; the comma-separated grammar is published now so a later
        audio entry is additive.
    RuntimeReport:
      oneOf:
        - { $ref: "#/components/schemas/ManifestActivatedReport" }
        - { $ref: "#/components/schemas/PlaybackVideoStartedReport" }
        - { $ref: "#/components/schemas/ApplicationEventReport" }
        - { $ref: "#/components/schemas/RuntimeConditionReport" }
    ManifestActivatedReport: { type: object, additionalProperties: false, required: [severity, code, context], properties: { severity: { type: string, enum: [info] }, code: { type: string, enum: [manifest.activated] }, context: { $ref: "#/components/schemas/ManifestActivatedContext" } } }
    ManifestActivatedContext: { type: object, additionalProperties: false, required: [manifest_revision], properties: { manifest_revision: { type: string, pattern: "^man_" } } }
    PlaybackVideoStartedReport: { type: object, additionalProperties: false, required: [severity, code, context], properties: { severity: { type: string, enum: [info] }, code: { type: string, enum: [playback.video_started] }, context: { $ref: "#/components/schemas/PlaybackVideoStartedContext" } } }
    PlaybackVideoStartedContext: { type: object, additionalProperties: false, required: [media_id, manifest_revision, page_id], properties: { media_id: { type: string, pattern: "^med_" }, manifest_revision: { type: string, pattern: "^man_" }, page_id: { type: string, pattern: "^[A-Za-z][A-Za-z0-9_-]{0,63}$" } } }
    ApplicationEventReport: { type: object, additionalProperties: false, required: [severity, code, context], properties: { severity: { type: string, enum: [info] }, code: { type: string, enum: [application.event] }, context: { $ref: "#/components/schemas/ApplicationEventContext" } } }
    ApplicationEventContext: { type: object, additionalProperties: false, required: [primitive_id, code], properties: { primitive_id: { type: string, pattern: "^[A-Za-z][A-Za-z0-9_-]{0,63}$" }, code: { type: string, pattern: "^[A-Za-z0-9._-]{1,64}$" } } }
    RuntimeConditionReport: { type: object, additionalProperties: false, required: [severity, code, context], properties: { severity: { type: string, enum: [info, warning, error] }, code: { type: string, pattern: "^[a-z0-9._-]{1,80}$", not: { enum: [manifest.activated, playback.video_started, application.event] } }, context: { type: object, additionalProperties: true } } }
    ReleaseLaunch: { type: object, additionalProperties: false, required: [launch_url, expires_at], properties: { launch_url: { type: string }, expires_at: { type: string } } }
    DashboardDisplayName:
      type: string
      minLength: 1
      maxLength: 80
      description: >-
        Name a dashboard user chose for itself. It exists so that a mutation can
        be attributed on the event log. It is not verified, it is not an email
        address, it is not unique within an account, and it is never
        authorization. Leading and trailing whitespace is trimmed, control
        characters are rejected, and recognizable ScreenRig credential material
        is rejected with invalid_request and is not stored.
    DashboardLink:
      type: object
      additionalProperties: false
      required: [url, expires_at]
      properties:
        url:
          type: string
          description: >-
            Absolute dashboard URL whose fragment carries the single-use token.
            Treat the whole string as a credential: open it, do not log it, do
            not print it, and do not store it. The server never sees the
            fragment, so the claiming client strips it before its first network
            call.
        expires_at: { type: string, format: date-time, description: "Instant the unclaimed link stops being claimable, ten minutes after mint. This is DashboardLinkTTL, a separate clock from the handoff locator and from native pairing." }
    DashboardLinkClaimRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, pattern: "^[A-Za-z0-9_-]{43}$", description: "Single-use 256-bit token taken from the URL fragment, unpadded base64url. It is presented in the body exactly once and never in a query, path, or header." }
    DashboardLinkClaim:
      type: object
      additionalProperties: false
      required: [next, dev_auth]
      description: >-
        Result of one link claim. next is the only discriminator a client may
        branch on, and dev_auth is the only server-mode signal it receives, so
        no dashboard client needs a build-time flag, an environment check, or a
        hostname test. The response carries no token, no cookie value, and no
        provisioning material.
      properties:
        next: { type: string, enum: [ready, register_passkey, create_session], description: "ready is a no-op sign-in on an existing same-account session. register_passkey is production mode with no session. create_session is dashboard development-authentication mode." }
        dev_auth: { type: boolean, description: "True when the server runs dashboard development authentication and the four WebAuthn ceremony routes therefore return passkeys_disabled. False in production, where the display_name development shape of POST /dashboard/v1/sessions returns forbidden; its email/password shape remains real password verification." }
    DashboardPasskeyRegistrationStart:
      type: object
      additionalProperties: false
      description: Optional registration-start body. Send display_name with the setup cookie; omit the body entirely with a session cookie.
      properties:
        display_name: { $ref: "#/components/schemas/DashboardDisplayName" }
    EventAgent:
      type: object
      additionalProperties: false
      required: [agent_id, name, agent_type]
      description: Safe agent principal attribution present only when the event was directly caused by an authenticated agent bearer. It is never authorization.
      properties:
        agent_id: { type: string, pattern: "^agt_" }
        name: { type: string, maxLength: 80 }
        agent_type: { type: string, maxLength: 32 }
    DashboardPasskeyRegistration:
      type: object
      additionalProperties: false
      required: [ceremony_id, creation_options]
      properties:
        ceremony_id: { type: string, description: "Opaque handle for this ceremony. It is bound to the presenting cookie and is not a credential on its own." }
        creation_options: { type: object, additionalProperties: true, description: "WebAuthn PublicKeyCredentialCreationOptions, passed verbatim to navigator.credentials.create. The relying party is the dashboard host, credentials are discoverable, user verification is required, and attestation is none." }
    DashboardPasskeyRegistrationComplete:
      type: object
      additionalProperties: false
      required: [ceremony_id, credential]
      properties:
        ceremony_id: { type: string }
        credential: { type: object, additionalProperties: true, description: WebAuthn registration response serialized from the PublicKeyCredential the authenticator returned. }
    DashboardPasskeyAssertion:
      type: object
      additionalProperties: false
      required: [ceremony_id, request_options]
      properties:
        ceremony_id: { type: string }
        request_options: { type: object, additionalProperties: true, description: "WebAuthn PublicKeyCredentialRequestOptions, passed verbatim to navigator.credentials.get. It publishes no allowCredentials list, so it is not a user or credential existence oracle." }
    DashboardPasskeyAssertionComplete:
      type: object
      additionalProperties: false
      required: [ceremony_id, credential]
      properties:
        ceremony_id: { type: string }
        credential: { type: object, additionalProperties: true, description: WebAuthn assertion response serialized from the PublicKeyCredential the authenticator returned. }
    DashboardSessionCreate:
      type: object
      additionalProperties: false
      required: [display_name]
      description: Development-authentication-only session mint body. It carries no credential and no proof of possession, which is why the route is forbidden outside development authentication.
      properties:
        display_name: { $ref: "#/components/schemas/DashboardDisplayName" }
    DashboardPasswordLogin:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, minLength: 3, maxLength: 254, description: Existing account email supplied at enrollment. Normalization matches enrollment and the value is never echoed in a problem response or log. }
        password: { type: string, minLength: 12, maxLength: 128, writeOnly: true }
    DashboardPasswordSet:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: { type: string, minLength: 12, maxLength: 128, writeOnly: true, description: Stored only as a fixed-parameter Argon2id hash. }
    DashboardSession:
      type: object
      additionalProperties: false
      required: [user_id, account_id, display_name, dev_auth, expires_at]
      description: >-
        Current dashboard session. Every field is descriptive: authority is the
        session cookie and the server-side row it names, never these
        identifiers. All users of an account hold equal read and delete
        authority, so this object publishes no role.
      properties:
        user_id: { type: string }
        account_id: { type: string }
        display_name: { $ref: "#/components/schemas/DashboardDisplayName" }
        dev_auth: { type: boolean, description: True when the server runs dashboard development authentication. }
        expires_at: { type: string, format: date-time, description: Instant the twenty-four-hour session row stops being accepted. Logout deletes the row before this time. }
    DashboardUser:
      type: object
      additionalProperties: false
      required: [user_id, display_name, credential_count, created_at]
      properties:
        user_id: { type: string }
        display_name: { $ref: "#/components/schemas/DashboardDisplayName" }
        credential_count: { type: integer, minimum: 0, description: "Number of stored passkeys. It is zero for a user created through development-authentication session mint, which stores no credential." }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time, description: Instant this user last presented a valid session. Absent until the first authenticated request after creation. }
    DashboardUserList: { type: object, additionalProperties: false, required: [items], properties: { items: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/DashboardUser" } } } }
    DashboardAgentAuthorization:
      type: object
      additionalProperties: false
      description: A passkey session returns ceremony_id and request_options. A password session returns password_session=true and confirmation_required=true. Development-authentication mode returns dev_auth=true and confirmation_required=true as a distinct localhost-only exception.
      properties:
        ceremony_id: { type: string }
        request_options: { type: object, additionalProperties: true }
        password_session: { type: boolean, enum: [true] }
        dev_auth: { type: boolean, enum: [true] }
        confirmation_required: { type: boolean, enum: [true] }
    DashboardAgentAuthorizationComplete:
      type: object
      additionalProperties: false
      properties:
        ceremony_id: { type: string }
        credential: { type: object, additionalProperties: true }
        dev_confirm: { type: boolean, description: Must be true only on a server running dashboard development authentication; rejected as a substitute for a production passkey assertion. }
        session_confirm: { type: boolean, description: Must be true only to approve an agent connection from a password-authenticated account session; it is not accepted as passkey proof or development confirmation. }
    DashboardSummary:
      type: object
      additionalProperties: false
      required: [screens, media, applications]
      properties:
        screens: { $ref: "#/components/schemas/DashboardScreenSummary" }
        media: { $ref: "#/components/schemas/DashboardMediaSummary" }
        applications: { $ref: "#/components/schemas/DashboardApplicationSummary" }
    DashboardAccount:
      type: object
      additionalProperties: false
      required: [status, created_at, email, email_verified, screen_count, screen_limit, used_bytes, reserved_bytes, content_limit_bytes, event_retention_days]
      description: Status, contact address, enforced limits, usage, retention, and public whole-credit state for one account. The internal plan identifier remains unpublished.
      properties:
        status: { type: string, enum: [active, cancelled, deleted] }
        created_at: { type: string, format: date-time }
        email: { type: string, minLength: 3, maxLength: 254, description: "Required contact address supplied at enrollment, preserving its capitalization after surrounding whitespace is trimmed. No dashboard route updates it. It identifies this same account for password login only after an authenticated user sets a password; possession of the address alone grants nothing." }
        email_verified: { type: boolean, enum: [false], description: "Always false. The address is stored unverified and ScreenRig sends no mail. Show it as unverified; do not present it as a recovery channel." }
        screen_count: { type: integer, minimum: 0, description: Paired and pairing-pending screens together. Archived screens are excluded. }
        screen_limit: { type: integer, minimum: 0, description: "Plan screen cap. Zero means no cap, not a cap of zero." }
        used_bytes: { type: integer, minimum: 0, description: "Every durable byte the account owns: committed media, expanded release trees, and key/value entries." }
        reserved_bytes: { type: integer, minimum: 0, description: Bytes held by uploads in flight. }
        content_limit_bytes: { type: integer, minimum: 0, description: "Plan storage cap. Zero means no cap, not a cap of zero." }
        event_retention_days: { type: integer, minimum: 1, description: "Plan event retention window. Agent command records are events, so they expire on this same window." }
        credit_remaining: { type: integer, minimum: 0, description: "Absent when the credit snapshot is unavailable, which is not the same as zero." }
        credit_included: { type: integer, minimum: 0 }
        credit_reset: { type: string, format: date-time }
    DashboardBalance:
      type: object
      additionalProperties: false
      required: [credit_remaining, credit_included, credit_reset]
      properties:
        credit_remaining: { type: integer, minimum: 0, description: "Remaining prepaid credits as a whole integer. Never negative." }
        credit_included: { type: integer, minimum: 0, description: "Whole credits in the account's recurring included grant." }
        credit_reset: { type: string, format: date-time, description: "Next instant at which the recurring included grant resets." }
    DashboardScreenSummary:
      type: object
      additionalProperties: false
      required: [total, online, pairing_pending, active, archived]
      description: >-
        Screen counters for the session's account. total is pairing_pending plus
        active and excludes archived, matching account screen_count. online is
        derived from live paired runtime event streams exactly as Screen.online
        is; it is not a stored boolean and not a player heartbeat.
      properties:
        total: { type: integer, minimum: 0 }
        online: { type: integer, minimum: 0 }
        pairing_pending: { type: integer, minimum: 0 }
        active: { type: integer, minimum: 0 }
        archived: { type: integer, minimum: 0 }
    DashboardMediaSummary:
      type: object
      additionalProperties: false
      required: [count, bytes]
      description: Ready media counters for the session's account. bytes counts stored media bytes only; it is not the account used_bytes total, which also covers release trees and key/value entries.
      properties:
        count: { type: integer, minimum: 0 }
        bytes: { type: integer, minimum: 0 }
    DashboardApplicationSummary:
      type: object
      additionalProperties: false
      required: [count]
      properties:
        count: { type: integer, minimum: 0 }
