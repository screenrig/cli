        public_id: { type: string }
        label: { type: string }
        playlist_id: { type: string }
        state: { type: string, enum: [pairing_pending, active, archived] }
        revision: { type: integer }
        manifest_revision: { type: integer }
        content_access_generation: { type: integer }
        online: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    BrowserLinkSession: { type: object, additionalProperties: false, required: [session_id, code, display_code, status, expires_at], properties: { session_id: { type: string, pattern: "^blink_" }, code: { type: string, pattern: "^[23456789ABCDEFGHJKMNPQRSTUVWXYZ]{6}$" }, display_code: { type: string, pattern: "^[23456789ABCDEFGHJKMNPQRSTUVWXYZ]{3}-[23456789ABCDEFGHJKMNPQRSTUVWXYZ]{3}$" }, status: { type: string, enum: [waiting, claimed] }, expires_at: { type: string, format: date-time } } }
    BrowserLinkStatus: { type: object, additionalProperties: false, required: [session_id, code, display_code, status, continuation_path, expires_at], properties: { session_id: { type: string, pattern: "^blink_" }, code: { type: string, pattern: "^[23456789ABCDEFGHJKMNPQRSTUVWXYZ]{6}$" }, display_code: { type: string, pattern: "^[23456789ABCDEFGHJKMNPQRSTUVWXYZ]{3}-[23456789ABCDEFGHJKMNPQRSTUVWXYZ]{3}$" }, status: { type: string, enum: [waiting, claimed] }, continuation_path: { type: string, enum: [/runtime/v1/browser-links/continue] }, expires_at: { type: string, format: date-time } } }
    BrowserLinkEvent: { type: object, additionalProperties: false, required: [session_id, status, event_id, expires_at], properties: { session_id: { type: string, pattern: "^blink_" }, status: { type: string, enum: [waiting, claimed] }, event_id: { type: string, enum: ["1", "2"] }, expires_at: { type: string, format: date-time } } }
    BrowserLinkClaimRequest: { type: object, additionalProperties: false, required: [code], properties: { code: { type: string, pattern: "^[23456789ABCDEFGHJKMNPQRSTUVWXYZ]{3}-?[23456789ABCDEFGHJKMNPQRSTUVWXYZ]{3}$" } } }
    BrowserLinkClaimScreen: { type: object, additionalProperties: false, required: [id, public_id, state, public_url], properties: { id: { type: string }, public_id: { type: string }, state: { type: string, enum: [pairing_pending] }, public_url: { type: string, format: uri, pattern: "^[^#]+$" } } }
    BrowserLinkClaim: { type: object, additionalProperties: false, required: [session_id, status, screen], properties: { session_id: { type: string, pattern: "^blink_" }, status: { type: string, enum: [claimed] }, screen: { $ref: "#/components/schemas/BrowserLinkClaimScreen" } } }
    RuntimeSessionRequest:
      type: object
      additionalProperties: true
      required: [public_id]
      description: Anonymous viewer mint. Unknown members are ignored (docs/player-compatibility.md §1.1).
      properties:
        public_id: { type: string }
        playback: { $ref: "#/components/schemas/PlaybackHandshake" }
        player: { $ref: "#/components/schemas/PlayerIdentity" }
    DeviceSessionRequest:
      type: object
      additionalProperties: true
      description: Cookie-paired browser mint. The body is optional. Unknown members are ignored (docs/player-compatibility.md §1.1).
      properties:
        public_id: { type: string, minLength: 1 }
        playback: { $ref: "#/components/schemas/PlaybackHandshake" }
        player: { $ref: "#/components/schemas/PlayerIdentity" }
    PlayerIdentity:
      type: object
      additionalProperties: true
      required: [kind]
      description: >-
        Player self-identification, sent only on the three mint routes
        (docs/player-compatibility.md §3.1). It is a hint and never
        authorization, and it is not covered by the native proof. It is read
        tolerantly: unknown members are ignored, an invalid optional member
        is dropped on its own, and a player that is not an object or has no
        valid kind declares nothing. It is never a 400. A paired mint
        stores it on the screen for the operator fleet histogram.
      properties:
        kind: { type: string, pattern: "^[a-z][a-z0-9-]{0,31}$", description: "Rendering codebase, not hardware. Registered: web, android, qt, windows, apple. Unknown kinds are stored as given." }
        version: { type: string, minLength: 1, maxLength: 40, description: "Running build's CalVer YY.MM.N with an optional -suffix. Only exactly YY.MM.N or YY.MM.N-direct is comparable; every other value is served and never refused." }
        build: { type: string, pattern: "^[0-9a-f]{7,40}$" }
        version_code: { type: integer, minimum: 1, maximum: 2147483647 }
        flavor: { type: string, pattern: "^[a-z0-9-]{1,32}$" }
        shell: { $ref: "#/components/schemas/PlayerShellIdentity" }
        compat: { type: array, maxItems: 64, items: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$", maxLength: 40 }, description: "Declared compat tokens. Invalid entries are dropped and duplicates collapse. The mint response echoes the granted subset as compat." }
    PlayerShellIdentity:
      type: object
      additionalProperties: true
      required: [kind]
      description: The shell a web Player runs under. Its compat tokens are recorded, never granted. An invalid kind drops the shell.
      properties:
        kind: { type: string, pattern: "^[a-z][a-z0-9-]{0,31}$", description: "Shell kind such as tizen or brightsign." }
        version: { type: string, minLength: 1, maxLength: 40 }
        build: { type: string, pattern: "^[0-9a-f]{7,40}$" }
        compat: { type: array, items: { type: string } }
    RuntimeOrigins:
      type: object
      additionalProperties: true
      required: [content]
      description: >-
        The delivered origin allowlist (docs/player-compatibility.md §2.3).
        Present on a mint response only for a Player granted origins-v1. The
        Player unions content with its compiled content origins and ignores
        an invalid entry. release_suffix replaces the compiled release suffix
        only when it is a valid DNS suffix of at least two labels; it is absent
        when the runtime origin serves releases itself (local development).
        The delivered set never changes the credential origin, and the
        backend never puts a URL on an origin this session's mint did not
        deliver. A Player stores the object it validated last-known-good
        under, so a later session without origins keeps that LKG valid.
      properties:
        content: { type: array, items: { type: string, format: uri }, description: "https origins with no path. The runtime origin first, then any operator-configured content origins." }
        release_suffix: { type: string, description: "DNS suffix of application release origins, such as apps.screenrig.ai." }
    RuntimeUpgradeNotice:
      type: object
      additionalProperties: true
      required: [state, player_kind, recommended]
      description: >-
        Present on a mint response when the player's comparable version is
        below the recommended version for player_kind
        (docs/player-compatibility.md §6.1). The Player starts a platform
        update check and shows nothing on glass. A reader ignores the member
        for a state it does not know.
      properties:
        state: { type: string, description: "Known value: recommended." }
        player_kind: { type: string, description: "The floor key: a player kind, or shell:<kind>." }
        min_supported: { type: string, description: "The configured minimum for player_kind, when one is set." }
        recommended: { type: string }
    PlaybackHandshake:
      type: object
      additionalProperties: true
      description: >-
        Optional playback handshake a Player declares at mint. It is a hint that
        selects behavior, never authorization: unknown members and entries of
        the wrong type are ignored, and a value that is not an object
        negotiates nothing. The mint response echoes the supported
        intersection as PlaybackGrant. adslot-v1 is granted only to paired
        sessions.
      properties:
        capabilities: { type: array, items: { type: string }, description: "Requested playback features. Known value: adslot-v1." }
        manifest_versions: { type: array, items: { type: integer }, description: "Manifest schemaVersion values the Player renders. Known values: 2 and 3." }
    PlaybackGrant:
      type: object
      additionalProperties: true
      description: >-
        The playback handshake the backend granted: the intersection of the
        mint's PlaybackHandshake and what this backend supports, signed into the
        session. Omitted from the session when nothing intersects, so a session
        minted without a handshake is unchanged. A Player uses
        /runtime/v2/manifest only when manifest_versions contains 3.
      properties:
        capabilities: { type: array, items: { type: string }, description: "Granted playback features. Known value: adslot-v1." }
        manifest_versions: { type: array, items: { type: integer }, description: "Granted manifest schemaVersion values: 2 for /runtime/v1/manifest, 3 for /runtime/v2/manifest." }
    RuntimeSession:
      type: object
      additionalProperties: true
      required: [paired, capabilities, event_cursor, public_url]
      description: Runtime-owned session (docs/player-compatibility.md §8). Readers ignore unknown members and unknown capabilities values. A new member is sent only to sessions whose grants cover it.
      properties:
        paired: { type: boolean }
        capabilities: { type: array, items: { type: string }, description: "Session scopes. Known values: manifest.read, events.read, content.read, kv.read, kv.write, runtime.report, presence.write." }
        event_cursor: { type: string }
        public_url: { type: string, format: uri }
        playback: { $ref: "#/components/schemas/PlaybackGrant" }
        compat: { type: array, items: { type: string }, description: "Granted compat tokens, in registry order. Present only when the mint carried a valid player, and [] when nothing was granted (docs/player-compatibility.md §4.1). Readers ignore tokens they do not know." }
        upgrade: { $ref: "#/components/schemas/RuntimeUpgradeNotice" }
        origins: { $ref: "#/components/schemas/RuntimeOrigins" }
    NativeRuntimeSession:
      type: object
      additionalProperties: true
      required: [paired, capabilities, event_cursor, public_url, runtime_credential]
      description: Runtime-owned native session (docs/player-compatibility.md §8). Readers ignore unknown members and unknown capabilities values. A new member is sent only to sessions whose grants cover it.
      properties:
        paired: { type: boolean, enum: [true] }
        capabilities: { type: array, items: { type: string }, description: "Session scopes. Known values: manifest.read, events.read, content.read, kv.read, kv.write, runtime.report, presence.write." }
        event_cursor: { type: string }
        public_url: { type: string, format: uri }
        runtime_credential: { type: string, pattern: "^srs_[A-Za-z0-9_-]+$" }
        playback: { $ref: "#/components/schemas/PlaybackGrant" }
        compat: { type: array, items: { type: string }, description: "Granted compat tokens, in registry order. Present only when the mint carried a valid player, and [] when nothing was granted (docs/player-compatibility.md §4.1)." }
        upgrade: { $ref: "#/components/schemas/RuntimeUpgradeNotice" }
        origins: { $ref: "#/components/schemas/RuntimeOrigins" }
    RuntimeManifest:
      type: object
      description: >-
        Immutable runtime manifest using the deterministic screenrig.canvas/v1 canvas, rectangle, fit, and source-order contract.
        Read-side additional properties are permitted so a player on this contract ignores unknown keys (compatibility rule 2). Write schemas stay closed.
      required: [schemaVersion, manifestRevision, grantId, contentGeneration, screenId, screenLabel, playlistRevision, generatedAt, pages]
      properties:
        schemaVersion: { type: integer, enum: [2] }
        manifestRevision: { type: string }
        grantId: { type: string }
        contentGeneration: { type: integer }
        screenId: { type: string }
        screenLabel: { type: string }
        playlistId: { type: string }
        playlistRevision: { type: integer }
        generatedAt: { type: string }
        playlistName: { type: string, description: "Name of the assigned playlist." }
        timezone: { type: string, description: "IANA time zone identifier of the screen. Every page visibility rule in this manifest is evaluated in this zone. Emitted when the screen has one (docs/player-compatibility.md §1.3)." }
        pages: { type: array, items: { $ref: "#/components/schemas/RuntimePage" } }
        diagnostics: { type: array, items: { $ref: "#/components/schemas/RuntimeManifestDiagnostic" }, description: "Page- and primitive-level projection omissions. Emitted when projection dropped a field, primitive, or page; a healthy manifest omits this key. Compatibility rule 4: HTTP 200 with pages [] and a non-empty diagnostics array is a degraded projection — the player keeps last-known-good, shows the offline chip, and does not persist. HTTP 200 with pages [] and no diagnostics is an authored empty assignment — the player replaces last-known-good and shows no-content." }
    RuntimeManifestDiagnostic:
      type: object
      additionalProperties: true
      required: [level, code, detail]
      description: One fail-safe runtime projection omission. Players and the CLI may show these; they are never authorization.
      properties:
        level: { type: string, description: "Always warning today. A reader treats a level it does not know as warning." }
        code: { type: string, description: "Stable machine code such as unknown_field, unknown_enter_type, unknown_motion_type, unknown_transition_type, capability_issue, invalid_stagger, invalid_enter, invalid_motion, invalid_primitive, invalid_page, or invalid_visibility." }
        pageId: { type: string }
        primitiveId: { type: string }
        detail: { type: string }
    RuntimePage:
      type: object
      required: [contractVersion, id, canvas, transition, advance, primitives]
      properties:
        contractVersion: { type: string, enum: [screenrig.canvas/v1] }
        id: { type: string }
        canvas: { $ref: "#/components/schemas/RuntimeCanvas" }
        transition: { $ref: "#/components/schemas/RuntimeTransition" }
        advance: { $ref: "#/components/schemas/RuntimeAdvance" }
        visibility: { $ref: "#/components/schemas/PageVisibility", description: "Emitted only on pages that author a schedule. It is the identical snake_case object stored on the playlist page, deliberately outside contractVersion screenrig.canvas/v1." }
        primitives: { type: array, minItems: 1, maxItems: 24, items: { $ref: "#/components/schemas/RuntimePrimitive" }, description: Source array order is the deterministic tie-breaker for equal layers. }
    RuntimeCanvas:
      type: object
      required: [width, height, viewportFit, background]
      properties:
        width: { type: number, exclusiveMinimum: 0 }
        height: { type: number, exclusiveMinimum: 0 }
        viewportFit: { type: string, enum: [contain, cover, fill] }
        background: { $ref: "#/components/schemas/CanvasBackground" }
    RuntimeRect:
      type: object
      required: [x, y, width, height]
      properties:
        x: { type: number }
        y: { type: number }
        width: { type: number, exclusiveMinimum: 0 }
        height: { type: number, exclusiveMinimum: 0 }
    RuntimeIntrinsicSize:
      type: object
      required: [width, height]
      properties:
        width: { type: number, exclusiveMinimum: 0 }
        height: { type: number, exclusiveMinimum: 0 }
    RuntimeTransition:
      type: object
      required: [type, durationMs]
      description: Authored page transition. The runtime mint passes type through; it does not rewrite swipe to crossfade.
      properties:
        type: { type: string, enum: [crossfade, swipe-left, swipe-right, swipe-up, swipe-down] }
        durationMs: { type: integer }
    RuntimeAdvance:
      type: object
      required: [mode]
      properties:
        mode: { type: string, enum: [duration, application, media_end] }
        afterMs: { type: integer }
        maxMs: { type: integer }
    RuntimePrimitive:
      oneOf:
        - { $ref: "#/components/schemas/RuntimeApplicationPrimitive" }
        - { $ref: "#/components/schemas/RuntimeImagePrimitive" }
        - { $ref: "#/components/schemas/RuntimeVideoPrimitive" }
        - { $ref: "#/components/schemas/RuntimeIframePrimitive" }
        - { $ref: "#/components/schemas/RuntimeStreamPrimitive" }
      discriminator: { propertyName: primitive }
    RuntimeApplicationPrimitive:
      type: object
      required: [id, primitive, applicationId, releaseId, launchUrl, origin, protocol, grantId, package, rect, layer, contentFit, capabilityHandle, capabilityExpiresAt]
      properties:
        id: { type: string }
        primitive: { type: string, enum: [application] }
        applicationId: { type: string }
        releaseId: { type: string }
        launchUrl: { type: string }
        origin: { type: string }
        protocol: { type: string, description: "SDK bridge protocol. Known value: \"1\". A reader drops the primitive for a protocol it does not implement." }
        grantId: { type: string }
        package: { $ref: "#/components/schemas/RuntimeApplicationPackage" }
        rect: { $ref: "#/components/schemas/RuntimeRect" }
        layer: { type: integer, minimum: 0, maximum: 1024 }
        contentFit: { type: string, enum: [fill] }
        controller: { type: boolean }
        enter: { $ref: "#/components/schemas/PrimitiveEnter" }
        motion: { $ref: "#/components/schemas/PrimitiveMotion" }
        capabilityHandle: { type: string, minLength: 32, description: Opaque parent-only capability; never forward it into the uploaded iframe. }
        capabilityExpiresAt: { type: string, format: date-time, description: Five-minute expiry. Refresh the manifest before this time to obtain a replacement handle. }
    RuntimeImagePrimitive:
      type: object
      required: [id, primitive, selector, resolvedMedia, grantId, rect, layer, contentFit]
      properties:
        id: { type: string }
        primitive: { type: string, enum: [image] }
        selector: { $ref: "#/components/schemas/RuntimeMediaSelector" }
        resolvedMedia: { type: array, minItems: 1, maxItems: 32, items: { $ref: "#/components/schemas/RuntimeImageResolvedMedia" } }
        grantId: { type: string }
        alt: { type: string }
        dwellMs: { type: integer, minimum: 1000, maximum: 86400000 }
        rect: { $ref: "#/components/schemas/RuntimeRect" }
        layer: { type: integer, minimum: 0, maximum: 1024 }
        contentFit: { type: string, enum: [contain, cover, fill] }
        enter: { $ref: "#/components/schemas/PrimitiveEnter" }
        motion: { $ref: "#/components/schemas/PrimitiveMotion" }
    RuntimeVideoPrimitive:
      type: object
      required: [id, primitive, selector, resolvedMedia, muted, loop, grantId, rect, layer, contentFit]
      properties:
        id: { type: string }
        primitive: { type: string, enum: [video] }
        selector: { $ref: "#/components/schemas/RuntimeMediaSelector" }
        resolvedMedia: { type: array, minItems: 1, maxItems: 32, items: { $ref: "#/components/schemas/RuntimeVideoResolvedMedia" } }
        muted: { type: boolean }
        loop: { type: boolean }
        grantId: { type: string }
        rect: { $ref: "#/components/schemas/RuntimeRect" }
        layer: { type: integer, minimum: 0, maximum: 1024 }
        contentFit: { type: string, enum: [contain, cover, fill] }
        enter: { $ref: "#/components/schemas/PrimitiveEnter" }
        motion: { $ref: "#/components/schemas/PrimitiveMotion" }
    StreamSource: {"oneOf": [{"$ref": "#/components/schemas/HLSStreamSource"}, {"$ref": "#/components/schemas/UDPStreamSource"}], "discriminator": {"propertyName": "protocol"}}
    HLSStreamSource: {"type": "object", "additionalProperties": false, "required": ["protocol", "url"], "properties": {"protocol": {"type": "string", "enum": ["hls"]}, "url": {"type": "string", "format": "uri", "maxLength": 2048, "pattern": "^https://"}}}
    UDPStreamSource: {"type": "object", "additionalProperties": false, "required": ["protocol", "group", "port"], "properties": {"protocol": {"type": "string", "enum": ["udp-mpegts"]}, "group": {"type": "string", "description": "IPv4 ASM group within 239.0.0.0/8. Raw MPEG-TS over UDP, not RTP."}, "port": {"type": "integer", "minimum": 1, "maximum": 65535}}}
    PlaylistStreamPrimitiveWrite: {"type": "object", "additionalProperties": false, "required": ["id", "primitive", "sources", "fallback_media_id", "rect", "layer", "content_fit"], "properties": {"id": {"type": "string"}, "primitive": {"type": "string", "enum": ["stream"]}, "sources": {"type": "array", "minItems": 1, "maxItems": 2, "items": {"$ref": "#/components/schemas/StreamSource"}}, "muted": {"type": "boolean", "default": true}, "rect": {"$ref": "#/components/schemas/PlaylistRect"}, "layer": {"type": "integer", "minimum": 0, "maximum": 1024}, "content_fit": {"type": "string", "enum": ["contain", "cover", "fill"]}, "fallback_media_id": {"type": "string", "pattern": "^med_"}, "enter": {"$ref": "#/components/schemas/PrimitiveEnter"}, "motion": {"$ref": "#/components/schemas/PrimitiveMotion"}}}
    PlaylistStreamPrimitive: {"type": "object", "additionalProperties": false, "required": ["id", "primitive", "sources", "fallback_media_id", "rect", "layer", "content_fit", "muted", "controller", "resolved_media"], "properties": {"id": {"type": "string"}, "primitive": {"type": "string", "enum": ["stream"]}, "sources": {"type": "array", "minItems": 1, "maxItems": 2, "items": {"$ref": "#/components/schemas/StreamSource"}}, "muted": {"type": "boolean", "default": true}, "rect": {"$ref": "#/components/schemas/PlaylistRect"}, "layer": {"type": "integer", "minimum": 0, "maximum": 1024}, "content_fit": {"type": "string", "enum": ["contain", "cover", "fill"]}, "fallback_media_id": {"type": "string", "pattern": "^med_"}, "enter": {"$ref": "#/components/schemas/PrimitiveEnter"}, "motion": {"$ref": "#/components/schemas/PrimitiveMotion"}, "controller": {"type": "boolean", "enum": [false]}, "resolved_media": {"type": "array", "minItems": 1, "maxItems": 1, "items": {"$ref": "#/components/schemas/PlaylistResolvedMedia"}}}}
    RuntimeStreamPrimitive: {"type": "object", "required": ["id", "primitive", "sources", "muted", "fallback", "grantId", "rect", "layer", "contentFit"], "properties": {"id": {"type": "string"}, "primitive": {"type": "string", "enum": ["stream"]}, "sources": {"type": "array", "minItems": 1, "maxItems": 2, "items": {"$ref": "#/components/schemas/StreamSource"}}, "muted": {"type": "boolean"}, "fallback": {"$ref": "#/components/schemas/RuntimeImageResolvedMedia"}, "grantId": {"type": "string"}, "rect": {"$ref": "#/components/schemas/RuntimeRect"}, "layer": {"type": "integer", "minimum": 0, "maximum": 1024}, "contentFit": {"type": "string", "enum": ["contain", "cover", "fill"]}, "enter": {"$ref": "#/components/schemas/PrimitiveEnter"}, "motion": {"$ref": "#/components/schemas/PrimitiveMotion"}}}
    RuntimeIframePrimitive:
      type: object
      required: [id, primitive, src, title, rect, layer, contentFit]
      properties:
        id: { type: string }
        primitive: { type: string, enum: [iframe] }
        src: { type: string }
        title: { type: string }
        rect: { $ref: "#/components/schemas/RuntimeRect" }
        layer: { type: integer, minimum: 0, maximum: 1024 }
        contentFit: { type: string, enum: [fill] }
        enter: { $ref: "#/components/schemas/PrimitiveEnter" }
        motion: { $ref: "#/components/schemas/PrimitiveMotion" }
    RuntimeMediaSelector:
      oneOf:
        - { $ref: "#/components/schemas/RuntimeMediaSelectorByID" }
        - { $ref: "#/components/schemas/RuntimeMediaSelectorByIDs" }
        - { $ref: "#/components/schemas/RuntimeMediaSelectorByAll" }
        - { $ref: "#/components/schemas/RuntimeMediaSelectorByTag" }
      discriminator: { propertyName: by }
    RuntimeMediaSelectorByID: { type: object, required: [by, mediaId, oneAtATime], properties: { by: { type: string, enum: [id] }, mediaId: { type: string, pattern: "^med_" }, oneAtATime: { type: boolean, enum: [false] } } }
    RuntimeMediaSelectorByIDs: { type: object, required: [by, mediaIds, oneAtATime], properties: { by: { type: string, enum: [ids] }, mediaIds: { type: array, minItems: 1, maxItems: 32, uniqueItems: true, items: { type: string, pattern: "^med_" } }, oneAtATime: { type: boolean } } }
    RuntimeMediaSelectorByAll: { type: object, required: [by, oneAtATime], properties: { by: { type: string, enum: [all] }, oneAtATime: { type: boolean } } }
    RuntimeMediaSelectorByTag: { type: object, required: [by, tag, oneAtATime], properties: { by: { type: string, enum: [tag] }, tag: { type: string, pattern: "^[A-Za-z0-9]{1,32}$" }, oneAtATime: { type: boolean } } }
    RuntimeApplicationPackage:
      type: object
      description: >-
        Immutable normalized package built only from the independently validated application tree. Native players
        verify bytes and SHA-256 before atomically retaining this release for offline last-known-good restoration.
        The URL is an authorization-bound transport reference, not a public or durable object URL.
      required: [version, url, bytes, sha256, entrypoint, contentType]
      properties:
        version: { type: string, enum: ["screenrig.webapp-package/v1"] }
        url:
          type: string
          format: uri-reference
          description: &manifest-bound-route >-
            Manifest-bound route. The runtime origin is the origin this session
            fetched /runtime/v1/manifest from; that origin is deployment
            configuration, so this binding is normative prose rather than a
            machine-readable constraint. A consumer resolves this value — an
            absolute URL or a root-relative path — against the runtime origin
            and requires all of the following of the resolved URL: its scheme,
            host, and effective port equal the runtime origin's, with
            default-port normalization (443 for https, 80 for http); it carries
            no query component, no fragment, and no user info; and its path is
            byte-for-byte exactly the route emitted for this field —
            /content/v1/manifests/{manifest_revision}/media/{media_id} for an
            image or video item, with the containing manifest revision and the
            item's mediaId, or
            /content/v1/manifests/{manifest_revision}/releases/{release_id}/package
            for an application package, with the containing manifest revision
            and the content's releaseId. A value that fails this binding makes
            the whole manifest invalid: the consumer rejects the manifest at
            parse time, before any credentialed fetch, and never requests the
            route. The sibling sha256 pins bytes after transfer; hash-pinning
            is never destination authorization and never relaxes this binding.
        bytes: { type: integer, minimum: 1, maximum: 272629760 }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        entrypoint: { type: string, enum: [index.html] }
        contentType: { type: string, enum: ["application/vnd.screenrig.webapp-package+tar+gzip"] }
        expandedBytes: { type: integer, minimum: 0, maximum: 262144000, description: "Uncompressed bytes of the normalized package tree. Absent on legacy releases; players then use the contract maximum of 262144000." }
        expandedFiles: { type: integer, minimum: 0, maximum: 5000, description: "File count of the normalized package tree, not counting directories. Absent on legacy releases; players then use the contract maximum of 5000." }
    RuntimeImageResolvedMedia:
      type: object
      required: [mediaId, src, intrinsicSize, sha256, bytes, contentType]
      properties:
        mediaId: { type: string }
        src: { type: string, format: uri-reference, description: *manifest-bound-route }
        intrinsicSize: { $ref: "#/components/schemas/RuntimeIntrinsicSize" }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$", description: Immutable content digest for integrity and optional native caching; not an authorization capability. }
        bytes: { type: integer, minimum: 1, maximum: 1073741824 }
        contentType: { type: string, enum: [image/png, image/jpeg, image/webp, image/gif] }
    RuntimeVideoResolvedMedia:
      type: object
      required: [mediaId, src, intrinsicSize, sha256, bytes, contentType]
      properties:
        mediaId: { type: string }
        src: { type: string, format: uri-reference, description: *manifest-bound-route }
        intrinsicSize: { $ref: "#/components/schemas/RuntimeIntrinsicSize" }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$", description: Immutable content digest for integrity and optional native caching; not an authorization capability. }
        bytes: { type: integer, minimum: 1, maximum: 1073741824 }
        contentType: { type: string, enum: [video/mp4, video/webm] }
        codecs: { $ref: "#/components/schemas/RuntimeCodecs" }
    RuntimeCodecs:
      type: string
      maxLength: 128
      pattern: "^[A-Za-z0-9]{3,9}(\\.[A-Za-z0-9]{1,10}){0,5}(,[A-Za-z0-9]{3,9}(\\.[A-Za-z0-9]{1,10}){0,5})*$"
      description: "Server-derived RFC 6381 codec list for this exact rendition, never client-declared. It is a sibling of contentType; a Player can form a capability query as contentType followed by codecs=\"VALUE\". A video whose codec cannot be derived is rejected at upload. The property is optional. An absent value does not mean that the codec is unsupported. A present value currently contains one video-track entry; the grammar permits comma-separated entries."
    RuntimeReport:
      description: Report bodies and contexts are read tolerantly (docs/player-compatibility.md §1.1). A code needs its own context members; other members are ignored. Players still send only the members below, because a pre-contract backend refuses any other.
      oneOf:
        - { $ref: "#/components/schemas/ManifestActivatedReport" }
        - { $ref: "#/components/schemas/PlaybackMediaStartedReport" }
        - { $ref: "#/components/schemas/PlaybackVideoStartedReport" }
        - { $ref: "#/components/schemas/PlaybackPageFailedReport" }
        - { $ref: "#/components/schemas/ApplicationEventReport" }
        - { $ref: "#/components/schemas/RuntimeConditionReport" }
    ManifestActivatedReport: { type: object, additionalProperties: true, required: [severity, code, context], properties: { severity: { type: string, enum: [info] }, code: { type: string, enum: [manifest.activated] }, context: { $ref: "#/components/schemas/ManifestActivatedContext" } } }
    ManifestActivatedContext: { type: object, additionalProperties: true, required: [manifest_revision], properties: { manifest_revision: { type: string, pattern: "^man_" } } }
    PlaybackMediaStartedReport: { type: object, additionalProperties: true, required: [severity, code, context], description: "One visible start of an image or video primitive on a page. Players send this once per page appearance of the media, for images exactly as for videos; loops inside one appearance are not restarts. The media must be on the session screen's grant at the reported manifest revision, and context.primitive must match the ready media's primitive or the report is rejected. Upserts the daily PlaybackAggregate for the screen, media, and UTC day.", properties: { severity: { type: string, enum: [info] }, code: { type: string, enum: [playback.media_started] }, context: { $ref: "#/components/schemas/PlaybackMediaStartedContext" } } }
    PlaybackMediaStartedContext: { type: object, additionalProperties: true, required: [media_id, manifest_revision, page_id, primitive], properties: { media_id: { type: string, pattern: "^med_" }, manifest_revision: { type: string, pattern: "^man_" }, page_id: { type: string, pattern: "^[A-Za-z][A-Za-z0-9_-]{0,63}$" }, primitive: { type: string, enum: [image, video], description: The primitive kind of the media that started. Must match the ready media. } } }
    PlaybackVideoStartedReport: { type: object, additionalProperties: true, required: [severity, code, context], description: "Report one visible video start. This uses the same daily aggregation as playback.media_started with primitive video. Send one report per start; sending both event types counts the start twice. Use playback.media_started when reporting both images and videos.", properties: { severity: { type: string, enum: [info] }, code: { type: string, enum: [playback.video_started] }, context: { $ref: "#/components/schemas/PlaybackVideoStartedContext" } } }
    PlaybackVideoStartedContext: { type: object, additionalProperties: true, required: [media_id, manifest_revision, page_id], properties: { media_id: { type: string, pattern: "^med_" }, manifest_revision: { type: string, pattern: "^man_" }, page_id: { type: string, pattern: "^[A-Za-z][A-Za-z0-9_-]{0,63}$" } } }
    PlaybackPageFailedReport:
      type: object
      additionalProperties: true
      required: [severity, code, context]
      description: >-
        Reports that one page could not become ready. On acceptance the
        server replaces Screen.last_page_failure and appends a durable
        project-only playback.page_failed event in the same transaction.
        It does not change screen revision or manifest authority.
      properties:
        severity: { type: string, enum: [error] }
        code: { type: string, enum: [playback.page_failed] }
        context: { $ref: "#/components/schemas/PlaybackPageFailedContext" }
    PlaybackPageFailedContext:
      type: object
      additionalProperties: true
      required: [page_id, code]
      properties:
        page_id: { type: string, pattern: "^[A-Za-z][A-Za-z0-9_-]{0,63}$" }
        code: { type: string, pattern: "^[a-z0-9._-]{1,80}$" }
    ApplicationEventReport: { type: object, additionalProperties: true, required: [severity, code, context], properties: { severity: { type: string, enum: [info] }, code: { type: string, enum: [application.event] }, context: { $ref: "#/components/schemas/ApplicationEventContext" } } }
    ApplicationEventContext: { type: object, additionalProperties: true, required: [primitive_id, code], properties: { primitive_id: { type: string, pattern: "^[A-Za-z][A-Za-z0-9_-]{0,63}$" }, code: { type: string, pattern: "^[A-Za-z0-9._-]{1,64}$" } } }
    RuntimeConditionReport: { type: object, additionalProperties: true, required: [severity, code, context], properties: { severity: { type: string, enum: [info, warning, error] }, code: { type: string, pattern: "^[a-z0-9._-]{1,80}$", not: { enum: [manifest.activated, playback.media_started, playback.video_started, playback.page_failed, application.event] } }, context: { type: object, additionalProperties: true } } }
    ReleaseLaunch: { type: object, additionalProperties: false, required: [launch_url, expires_at], properties: { launch_url: { type: string }, expires_at: { type: string } } }
    DashboardDisplayName:
      type: string
      minLength: 1
      maxLength: 80
      x-maxBytes: 80
      description: Trimmed printable display name, at most 80 UTF-8 bytes. Rejects controls, URL-looking text, @, www., ://, and credential material. Never authorization.
    EventAgent:
      type: object
      additionalProperties: false
      required: [agent_id, name, agent_type]
      description: Safe agent principal attribution present only when the event was directly caused by an authenticated agent bearer. It is never authorization.
      properties:
        agent_id: { type: string, pattern: "^(?:(?:stage|qa|development)_)?agt_" }
        name: { type: string, maxLength: 80 }
        agent_type: { type: string, maxLength: 32 }
    DashboardPasskeyRegistration:
      type: object
      additionalProperties: false
      required: [ceremony_id, creation_options]
      properties:
        ceremony_id: { type: string, description: "Opaque handle for this ceremony. It is bound to the presenting cookie and is not a credential on its own." }
        creation_options: { type: object, additionalProperties: true, description: "WebAuthn PublicKeyCredentialCreationOptions, passed verbatim to navigator.credentials.create. The relying party is the dashboard host, credentials are discoverable, user verification is required, and attestation is none." }
    DashboardPasskeyAssertion:
      type: object
      additionalProperties: false
      required: [ceremony_id, request_options]
      properties:
        ceremony_id: { type: string }
        request_options: { type: object, additionalProperties: true, description: "WebAuthn PublicKeyCredentialRequestOptions, passed verbatim to navigator.credentials.get. It publishes no allowCredentials list, so it is not a user or credential existence oracle." }
    DashboardPasskeyAssertionComplete:
      type: object
      additionalProperties: false
      required: [ceremony_id, credential]
      properties:
        ceremony_id: { type: string }
        credential: { type: object, additionalProperties: true, description: WebAuthn assertion response serialized from the PublicKeyCredential the authenticator returned. }
    DashboardPasswordLogin:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
          description: The person’s verified email address. Unknown email, no password, and wrong password return the same unauthorized response.
        password:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
    DashboardPasswordSet:
      type: object
      additionalProperties: false
      required:
      - password
      - proof
      properties:
        password:
          type: string
          minLength: 12
          maxLength: 128
          pattern: ^\S+$
          writeOnly: true
          x-maxBytes: 128
          description: 12–128 UTF-8 bytes, without whitespace. Cannot equal the email or display name or a bundled common password. Stored only as an Argon2id hash.
        proof:
          $ref: '#/components/schemas/DashboardProof'
    DashboardSession:
      type: object
      additionalProperties: false
      required:
      - user_id
      - display_name
      - email
      - project
      - auth_method
      - authenticated_at
      - expires_at
      - dev_auth
      properties:
        user_id:
          type: string
        display_name:
          $ref: '#/components/schemas/DashboardDisplayName'
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
        project:
          oneOf:
          - $ref: '#/components/schemas/DashboardProjectReference'
          - type: 'null'
        auth_method:
          type: string
          enum:
          - passkey
          - password
        authenticated_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        dev_auth:
          type: boolean
      description: 'Person session. Identifiers are descriptive; the session cookie establishes authority. A person with no projects has project: null.'

    DashboardSummary:
      type: object
      additionalProperties: false
      required: [screens, media, applications]
      properties:
        screens: { $ref: "#/components/schemas/DashboardScreenSummary" }
        media: { $ref: "#/components/schemas/DashboardMediaSummary" }
        applications: { $ref: "#/components/schemas/DashboardApplicationSummary" }
    DashboardProject:
      type: object
      additionalProperties: false
      required:
      - status
      - created_at
      - email
      - email_verified
      - screen_count
      - screen_limit
      - used_bytes
      - reserved_bytes
      - content_limit_bytes
      - event_retention_days
      - name
      description: Status, contact address, enforced limits, usage, retention, and public whole-credit state for one project. The internal plan identifier remains unpublished.
      properties:
        status:
          type: string
          enum:
          - active
          - cancelled
          - deleted
        created_at:
          type: string
          format: date-time
        email:
          type: string
          minLength: 3
          maxLength: 254
          description: Unverified project contact address supplied at enrollment. It grants no sign-in authority and is independent of every person's verified email.
        email_verified:
          type: boolean
          enum:
          - false
          description: Always false. The project contact address stays unverified; invitation acceptance verifies a person's email, not the project contact field.
        screen_count:
          type: integer
          minimum: 0
          description: Paired and pairing-pending screens together. Archived screens are excluded.
        screen_limit:
          type: integer
          minimum: 0
          description: Plan screen cap. Zero means no cap, not a cap of zero.
        used_bytes:
          type: integer
          minimum: 0
          description: 'Every durable byte the project owns: committed media, expanded release trees, and key/value entries.'
        reserved_bytes:
          type: integer
          minimum: 0
          description: Bytes held by uploads in flight.
        content_limit_bytes:
          type: integer
          minimum: 0
          description: Plan storage cap. Zero means no cap, not a cap of zero.
        event_retention_days:
          type: integer
          minimum: 1
          description: Plan event retention window. Agent command records are events, so they expire on this same window.
        credit_remaining:
          type: integer
          minimum: 0
          description: Absent when the credit snapshot is unavailable, which is not the same as zero.
        credit_included:
          type: integer
          minimum: 0
        credit_reset:
          type: string
          format: date-time
        name:
          $ref: '#/components/schemas/ProjectName'
    DashboardBalance:
      type: object
      additionalProperties: false
      required: [credit_remaining, credit_included, credit_reset]
      properties:
        credit_remaining: { type: integer, minimum: 0, description: "Remaining prepaid credits as a whole integer. Never negative." }
        credit_included: { type: integer, minimum: 0, description: "Whole credits in the project's recurring included grant." }
        credit_reset: { type: string, format: date-time, description: "Next instant at which the recurring included grant resets." }
    DashboardScreenSummary:
      type: object
      additionalProperties: false
      required: [total, online, pairing_pending, active, archived]
      description: >-
        Screen counters for the session's project. total is pairing_pending plus
        active and excludes archived, matching project screen_count. online is
        derived from live paired runtime event streams exactly as Screen.online
        is; it is not a stored boolean and not a player heartbeat.
      properties:
        total: { type: integer, minimum: 0 }
        online: { type: integer, minimum: 0 }
        pairing_pending: { type: integer, minimum: 0 }
        active: { type: integer, minimum: 0 }
        archived: { type: integer, minimum: 0 }
    DashboardMediaSummary:
      type: object
      additionalProperties: false
      required: [count, bytes]
      description: Ready media counters for the session's project. bytes counts stored media bytes only; it is not the project used_bytes total, which also covers release trees and key/value entries.
      properties:
        count: { type: integer, minimum: 0 }
        bytes: { type: integer, minimum: 0 }
    DashboardApplicationSummary:
      type: object
      additionalProperties: false
      required: [count]
      properties:
        count: { type: integer, minimum: 0 }
    ProblemField: { type: object, additionalProperties: false, required: [field, code, detail], properties: { field: { type: string }, code: { type: string }, detail: { type: string } } }
    NextAction: { type: object, additionalProperties: false, required: [command, reason], properties: { command: { type: string }, reason: { type: string } } }
    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status, detail, instance, code, request_id, errors]
      allOf:
        - if: { properties: { status: { type: integer, minimum: 500 } }, required: [status] }
          then: { required: [retryable] }
          else: { not: { required: [retryable] } }
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        request_id: { type: string }
        trace_id: { type: string }
        retryable: { type: boolean, description: "Present on every 5xx problem response and absent below 500. True when retrying the same operation may succeed without changing the request; false when the unchanged request is not retryable." }
        action: { type: string, description: "Player action class from the problem registry (docs/player-compatibility.md §5): retry_backoff, hold_lkg, remint, repair, clear_lkg, or upgrade_required. Present when the registry defines one. A reader applies the status default to a class it does not know." }
        server_time: { type: string, format: date-time, description: "Present on proof_clock_skew: the server clock when the proof was rejected. A Player re-signs with its clock offset from this value." }
        player_kind: { type: string, description: "Present on upgrade_required: the version floor that failed, a player kind such as web or shell:<kind> such as shell:tizen (docs/player-compatibility.md §6.1)." }
        min_supported: { type: string, description: "Present on upgrade_required for a version floor: the minimum supported YY.MM.N version for player_kind." }
        required_compat: { type: array, items: { type: string }, description: "Present on upgrade_required for the required-token floor (SCREENRIG__RUNTIME__COMPAT_REQUIRED, docs/player-compatibility.md §14): the required compat tokens this mint would not be granted. player_kind is the mint's player kind when a player was sent." }
        current_revision: { type: integer }
        errors: { type: array, items: { $ref: "#/components/schemas/ProblemField" } }
        next: { $ref: "#/components/schemas/NextAction" }
