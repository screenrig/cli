        "401": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /dashboard/v1/media/{id}:
    servers: [{ url: https://dashboard.screenrig.ai, description: Backend-owned account dashboard origin }]
    parameters: [{ $ref: "#/components/parameters/ResourceID" }]
    get:
      operationId: getDashboardMedia
      description: >-
        Returns metadata for one ready media object owned by the session's
        account. The identifier is not authorization; an object of any other
        account is not_found. There is no dashboard media upload or patch.
      security: [{ dashboardSession: [] }]
      responses:
        "200": { description: Ready private media metadata., headers: { ETag: { schema: { type: string } }, Cache-Control: { schema: { type: string, enum: ["private, no-store"] } } }, content: { application/json: { schema: { $ref: "#/components/schemas/Media" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteDashboardMedia
      description: >-
        Tombstones one media object owned by the session's account. An object a
