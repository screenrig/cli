    get:
      operationId: getRuntimeKV
      security: [{ runtimeCookie: [], placementCapability: [] }, { nativeSessionAuthorization: [], placementCapability: [] }]
      responses:
        "200": { description: Manifest-authorized application KV value, content: { application/json: { schema: { $ref: "#/components/schemas/KVEntry" } } } }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: putRuntimeKV
      security: [{ pairedRuntimeCookie: [], placementCapability: [] }, { nativeSessionAuthorization: [], placementCapability: [] }]
      parameters: [{ $ref: "#/components/parameters/OptionalIfMatch" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/KVWrite" } } } }
      responses:
        "200": { description: Paired-device KV mutation, content: { application/json: { schema: { $ref: "#/components/schemas/KVEntry" } } } }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteRuntimeKV
      security: [{ pairedRuntimeCookie: [], placementCapability: [] }, { nativeSessionAuthorization: [], placementCapability: [] }]
      parameters: [{ $ref: "#/components/parameters/IfMatch" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "204": { description: Paired-device KV deletion }
        default: { $ref: "#/components/responses/Problem" }
components:
  parameters:
    ResourceID: { name: id, in: path, required: true, schema: { type: string } }
    ApplicationID: { name: application_id, in: path, required: true, schema: { type: string } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 200 } }
    ArchiveSHA256: { name: ScreenRig-Archive-SHA256, in: header, required: true, schema: { type: string, pattern: "^[0-9a-f]{64}$" } }
    ExpandedBytes: { name: ScreenRig-Expanded-Bytes, in: header, required: true, schema: { type: integer, minimum: 1, maximum: 262144000 } }
    FileCount: { name: ScreenRig-File-Count, in: header, required: true, schema: { type: integer, minimum: 1, maximum: 5000 } }
    SDKVersion: { name: ScreenRig-SDK-Version, in: header, required: false, schema: { type: string, maxLength: 64 } }
    ApplicationName: { name: ScreenRig-Application-Name, in: header, required: false, schema: { type: string, maxLength: 120 } }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string } }
    OptionalIfMatch: { name: If-Match, in: header, required: false, schema: { type: string }, description: Omit only when creating a new key; updates require the current quoted revision. }
    AfterCursor: { name: after, in: query, required: false, schema: { type: string } }
    LastEventID: { name: Last-Event-ID, in: header, required: false, schema: { type: string }, description: Durable cursor used when after is absent. }
    Range: { name: Range, in: header, required: false, schema: { type: string, pattern: "^bytes=[0-9]*-[0-9]*$" }, description: V1 accepts one byte range only. }
    SecFetchSite: { name: Sec-Fetch-Site, in: header, required: false, schema: { type: string, enum: [same-origin, same-site, cross-site, none] } }
    SecFetchMode: { name: Sec-Fetch-Mode, in: header, required: false, schema: { type: string } }
    SecFetchDest: { name: Sec-Fetch-Dest, in: header, required: false, schema: { type: string } }
  securitySchemes:
    accountBearer: { type: http, scheme: bearer, bearerFormat: sr_live }
    nativePairingAuthorization:
      type: http
      scheme: ScreenRig-Pairing
      description: Native-only temporary pairing authorization. The credential is exactly srp_ plus 43 base64url characters and is never sent in a cookie, URL, or query.
    nativeDeviceAuthorization:
      type: http
      scheme: ScreenRig-Device
      description: Native-only durable device authorization. The credential is exactly srd_ plus a 22-character base64url lookup ID, underscore, and 43-character base64url secret.
    nativeSessionAuthorization:
      type: http
      scheme: ScreenRig-Session
      description: Native-only signed 30-minute runtime authorization. The credential is exactly srs_ plus an opaque signed base64url value.
    runtimeCookie: { type: apiKey, in: cookie, name: __Host-screenrig-runtime }
    pairedRuntimeCookie: { type: apiKey, in: cookie, name: __Host-screenrig-runtime, description: Signed runtime session with paired-device mutation profile. }
    pairedDeviceCookie: { type: apiKey, in: cookie, name: __Host-screenrig-device }
    pairingCookie: { type: apiKey, in: cookie, name: __Host-screenrig-pairing, description: "Signed ten-minute pairing session; never grants account, content, or runtime authority." }
    browserLinkCookie: { type: apiKey, in: cookie, name: __Host-screenrig-browser-link, description: "Apex host-only Secure HttpOnly SameSite=Strict Path=/ ten-minute browser-link owner session; no Domain and never accepted as a Player cookie." }
    placementCapability:
      type: apiKey
      in: header
      name: ScreenRig-Placement-Capability
      description: >-
        Parent-only signed five-minute placement capability bound to the runtime
        session, screen, application release, placement, manifest revision,
        content-access generation, and allowed KV operations. Refresh by fetching
        the current manifest.
    releaseGrantCookie: { type: apiKey, in: cookie, name: __Host-screenrig-release, description: Exact-host release/screen/generation/grant cookie; never valid on runtime or account routes. }
    releaseLaunchTicket: { type: apiKey, in: query, name: ticket, description: Random single-use 30-second ticket consumed only on its exact release host. }
    operatorBearer: { type: http, scheme: bearer }
  responses:
    Problem:
      description: Stable RFC 9457 problem response.
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    RateLimitedProblem:
      description: Stable rate_limited problem. Retry only after the declared interval.
      headers: { Retry-After: { required: true, schema: { type: integer, minimum: 1 } } }
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
  schemas:
    HealthResponse: { type: object, additionalProperties: false, required: [status], properties: { status: { type: string, enum: [alive] } } }
    ReadyResponse: { type: object, additionalProperties: false, required: [status, degraded], properties: { status: { type: string, enum: [ready] }, degraded: { type: array, items: { type: string } } } }
    VersionResponse: { type: object, additionalProperties: false, required: [version, commit, api_version, protocol_version], properties: { version: { type: string }, commit: { type: string }, api_version: { type: string }, protocol_version: { type: string } } }
    Capabilities:
      type: object
      additionalProperties: false
      required: [api_version, protocol_version, application_compressed_bytes, application_expanded_bytes, application_package_bytes, application_file_count, application_file_bytes, application_path_depth, application_path_bytes, playlist_max_pages, playlist_max_items_per_page, transition_max_duration_ms, screens_per_account, account_content_bytes, features]
      properties:
        api_version: { type: string }
        protocol_version: { type: string }
        application_compressed_bytes: { type: integer, enum: [104857600] }
        application_expanded_bytes: { type: integer, enum: [262144000] }
        application_package_bytes: { type: integer, enum: [272629760], description: Maximum normalized immutable webapp package size available to paired native players. }
        application_file_count: { type: integer, enum: [5000] }
        application_file_bytes: { type: integer, enum: [33554432] }
        application_path_depth: { type: integer, enum: [16] }
        application_path_bytes: { type: integer, enum: [255] }
        playlist_max_pages: { type: integer, enum: [100] }
        playlist_max_items_per_page: { type: integer, enum: [24] }
        transition_max_duration_ms: { type: integer, enum: [60000] }
        screens_per_account: { type: integer, enum: [50] }
        account_content_bytes: { type: integer, enum: [1073741824] }
        features: { type: object, additionalProperties: { type: boolean } }
    CLIEnrollmentRequest: { type: object, additionalProperties: false, required: [client_id], properties: { client_id: { type: string, pattern: "^cli_[A-Za-z0-9_-]{43}$", description: "Stable anonymous installation identity generated from 32 CSPRNG bytes and persisted before the first request. It is rate-limit material, not an account credential." } } }
    Account: { type: object, additionalProperties: false, required: [id, revision, status, used_bytes, reserved_bytes, screen_count, content_limit_bytes, screen_limit, created_at, updated_at], properties: { id: { type: string }, revision: { type: integer }, status: { type: string, enum: [active] }, used_bytes: { type: integer }, reserved_bytes: { type: integer }, screen_count: { type: integer }, content_limit_bytes: { type: integer }, screen_limit: { type: integer }, created_at: { type: string, format: date-time }, updated_at: { type: string, format: date-time } } }
    CLIEnrollment: { type: object, additionalProperties: false, required: [account, token, issuance_id, issuance_expires_at], properties: { account: { $ref: "#/components/schemas/Account" }, token: { type: string, minLength: 32, description: Permanent account bearer credential. It has no scheduled expiry and is redelivered only through this short-lived encrypted issuance envelope. }, issuance_id: { type: string, description: Opaque identifier for the encrypted exact-retry delivery envelope. }, issuance_expires_at: { type: string, format: date-time, description: Exact-retry redelivery deadline for this credential issuance; ten minutes after first enrollment. Later exact retries return credential_issuance_expired while the permanent token remains valid. } } }
    Application: { type: object, additionalProperties: true, required: [id, name, revision, state], properties: { id: { type: string }, name: { type: string }, revision: { type: integer }, state: { type: string }, release_id: { type: string } } }
    ApplicationList: { type: object, additionalProperties: false, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Application" } } } }
    OperationAccepted: { type: object, additionalProperties: false, required: [id, operation_id], properties: { id: { type: string }, operation_id: { type: string } } }
    Operation: { type: object, additionalProperties: true, required: [id, kind, state, created_at, updated_at], properties: { id: { type: string }, kind: { type: string }, state: { type: string, enum: [receiving, queued, running, succeeded, failed, cancelled], description: "Receiving means the bounded upload body is still being durably staged. Terminal values are succeeded, failed, and cancelled." }, request_id: { type: string }, created_at: { type: string }, updated_at: { type: string }, result: { type: object, additionalProperties: true }, error: { type: object, additionalProperties: true } } }
    PlaylistWrite:
      type: object
      additionalProperties: false
      required: [name, pages]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        pages: { type: array, minItems: 1, maxItems: 100, items: { $ref: "#/components/schemas/PlaylistPageWrite" } }
    Playlist:
      type: object
      additionalProperties: false
      required: [id, name, revision, pages]
      properties:
        id: { type: string }
        name: { type: string }
        revision: { type: integer }
        pages: { type: array, minItems: 1, maxItems: 100, items: { $ref: "#/components/schemas/PlaylistPage" } }
    PlaylistPageWrite:
      type: object
      additionalProperties: false
      required: [id, canvas, transition, advance, placements]
      properties:
        id: { type: string, pattern: "^[A-Za-z][A-Za-z0-9_-]{0,63}$" }
        canvas: { $ref: "#/components/schemas/PlaylistCanvas" }
        transition: { $ref: "#/components/schemas/PlaylistTransition" }
        advance: { $ref: "#/components/schemas/PlaylistAdvanceWrite" }
        placements: { type: array, minItems: 1, maxItems: 24, items: { $ref: "#/components/schemas/PlaylistPlacementWrite" } }
    PlaylistPage:
      type: object
      additionalProperties: false
      required: [id, canvas, transition, advance, placements]
      properties:
        id: { type: string, pattern: "^[A-Za-z][A-Za-z0-9_-]{0,63}$" }
        canvas: { $ref: "#/components/schemas/PlaylistCanvas" }
        transition: { $ref: "#/components/schemas/PlaylistTransition" }
        advance: { $ref: "#/components/schemas/PlaylistAdvance" }
        placements: { type: array, minItems: 1, maxItems: 24, items: { $ref: "#/components/schemas/PlaylistPlacement" } }
    PlaylistCanvas:
      type: object
      additionalProperties: false
      required: [width, height, background]
      properties:
        width: { type: number, exclusiveMinimum: 0 }
        height: { type: number, exclusiveMinimum: 0 }
        viewport_fit: { type: string, enum: [contain, cover, fill], default: contain }
        background: { type: string, pattern: "^#[0-9A-F]{8}$", description: Canonical uppercase RRGGBBAA color. }
    PlaylistRect:
      type: object
      additionalProperties: false
      required: [x, y, width, height]
      properties:
        x: { type: number }
        y: { type: number }
        width: { type: number, exclusiveMinimum: 0 }
        height: { type: number, exclusiveMinimum: 0 }
    PlaylistTransition:
      type: object
      additionalProperties: false
      required: [type, duration_ms]
      properties:
        type: { type: string, enum: [crossfade] }
        duration_ms: { type: integer, minimum: 0, maximum: 60000 }
    PlaylistAdvanceWrite:
      oneOf:
        - { $ref: "#/components/schemas/PlaylistDurationAdvance" }
        - { $ref: "#/components/schemas/PlaylistApplicationAdvance" }
        - { $ref: "#/components/schemas/PlaylistVideoEndAdvanceWrite" }
      discriminator: { propertyName: mode }
    PlaylistAdvance:
      oneOf:
        - { $ref: "#/components/schemas/PlaylistDurationAdvance" }
        - { $ref: "#/components/schemas/PlaylistApplicationAdvance" }
        - { $ref: "#/components/schemas/PlaylistVideoEndAdvance" }
      discriminator: { propertyName: mode }
    PlaylistDurationAdvance: { type: object, additionalProperties: false, required: [mode, after_ms], properties: { mode: { type: string, enum: [duration] }, after_ms: { type: integer, minimum: 1000, maximum: 86400000 } } }
    PlaylistApplicationAdvance: { type: object, additionalProperties: false, required: [mode, max_ms], properties: { mode: { type: string, enum: [application] }, max_ms: { type: integer, minimum: 1000, maximum: 86400000 } } }
    PlaylistVideoEndAdvanceWrite: { type: object, additionalProperties: false, required: [mode], properties: { mode: { type: string, enum: [video_end] }, max_ms: { type: integer, minimum: 1000, maximum: 86400000, description: Optional client safety hint; the server resolves the authoritative deadline from verified media duration. } } }
    PlaylistVideoEndAdvance: { type: object, additionalProperties: false, required: [mode, max_ms], properties: { mode: { type: string, enum: [video_end] }, max_ms: { type: integer, minimum: 1000, maximum: 86400000 } } }
    PlaylistPlacementWrite:
      oneOf:
        - { $ref: "#/components/schemas/PlaylistApplicationPlacementWrite" }
        - { $ref: "#/components/schemas/PlaylistImagePlacementWrite" }
        - { $ref: "#/components/schemas/PlaylistVideoPlacementWrite" }
        - { $ref: "#/components/schemas/PlaylistIframePlacementWrite" }
    PlaylistPlacement:
      oneOf:
        - { $ref: "#/components/schemas/PlaylistApplicationPlacement" }
        - { $ref: "#/components/schemas/PlaylistImagePlacement" }
        - { $ref: "#/components/schemas/PlaylistVideoPlacement" }
        - { $ref: "#/components/schemas/PlaylistIframePlacement" }
    PlaylistApplicationPlacementWrite: { type: object, additionalProperties: false, required: [id, content, rect, layer, content_fit], properties: { id: { type: string, pattern: "^[A-Za-z][A-Za-z0-9_-]{0,63}$" }, content: { $ref: "#/components/schemas/PlaylistApplicationContent" }, rect: { $ref: "#/components/schemas/PlaylistRect" }, layer: { type: integer, minimum: 0, maximum: 1024 }, content_fit: { type: string, enum: [fill] }, controller: { type: boolean, default: false } } }
    PlaylistImagePlacementWrite: { type: object, additionalProperties: false, required: [id, content, rect, layer, content_fit], properties: { id: { type: string, pattern: "^[A-Za-z][A-Za-z0-9_-]{0,63}$" }, content: { $ref: "#/components/schemas/PlaylistImageContentWrite" }, rect: { $ref: "#/components/schemas/PlaylistRect" }, layer: { type: integer, minimum: 0, maximum: 1024 }, content_fit: { type: string, enum: [contain, cover, fill] } } }
    PlaylistVideoPlacementWrite: { type: object, additionalProperties: false, required: [id, content, rect, layer, content_fit], properties: { id: { type: string, pattern: "^[A-Za-z][A-Za-z0-9_-]{0,63}$" }, content: { $ref: "#/components/schemas/PlaylistVideoContentWrite" }, rect: { $ref: "#/components/schemas/PlaylistRect" }, layer: { type: integer, minimum: 0, maximum: 1024 }, content_fit: { type: string, enum: [contain, cover, fill] } } }
    PlaylistIframePlacementWrite: { type: object, additionalProperties: false, required: [id, content, rect, layer, content_fit], properties: { id: { type: string, pattern: "^[A-Za-z][A-Za-z0-9_-]{0,63}$" }, content: { $ref: "#/components/schemas/PlaylistIframeContent" }, rect: { $ref: "#/components/schemas/PlaylistRect" }, layer: { type: integer, minimum: 0, maximum: 1024 }, content_fit: { type: string, enum: [fill] } } }
    PlaylistApplicationPlacement: { allOf: [{ $ref: "#/components/schemas/PlaylistApplicationPlacementWrite" }] }
    PlaylistImagePlacement: { type: object, additionalProperties: false, required: [id, content, rect, layer, content_fit, controller], properties: { id: { type: string }, content: { $ref: "#/components/schemas/PlaylistImageContent" }, rect: { $ref: "#/components/schemas/PlaylistRect" }, layer: { type: integer, minimum: 0, maximum: 1024 }, content_fit: { type: string, enum: [contain, cover, fill] }, controller: { type: boolean, enum: [false] } } }
    PlaylistVideoPlacement: { type: object, additionalProperties: false, required: [id, content, rect, layer, content_fit, controller], properties: { id: { type: string }, content: { $ref: "#/components/schemas/PlaylistVideoContent" }, rect: { $ref: "#/components/schemas/PlaylistRect" }, layer: { type: integer, minimum: 0, maximum: 1024 }, content_fit: { type: string, enum: [contain, cover, fill] }, controller: { type: boolean, enum: [false] } } }
    PlaylistIframePlacement: { type: object, additionalProperties: false, required: [id, content, rect, layer, content_fit, controller], properties: { id: { type: string }, content: { $ref: "#/components/schemas/PlaylistIframeContent" }, rect: { $ref: "#/components/schemas/PlaylistRect" }, layer: { type: integer, minimum: 0, maximum: 1024 }, content_fit: { type: string, enum: [fill] }, controller: { type: boolean, enum: [false] } } }
    PlaylistApplicationContent: { type: object, additionalProperties: false, required: [type, release_id], properties: { type: { type: string, enum: [application] }, application_id: { type: string, description: Optional ownership assertion; the server resolves the authoritative application from release_id. }, release_id: { type: string } } }
    PlaylistImageContentWrite: { type: object, additionalProperties: false, required: [type, media_id], properties: { type: { type: string, enum: [image] }, media_id: { type: string }, alt: { type: string, maxLength: 300 } } }
    PlaylistVideoContentWrite: { type: object, additionalProperties: false, required: [type, media_id], properties: { type: { type: string, enum: [video] }, media_id: { type: string }, muted: { type: boolean, enum: [true], default: true }, loop: { type: boolean, default: false } } }
    PlaylistImageContent: { type: object, additionalProperties: false, required: [type, media_id, intrinsic_size], properties: { type: { type: string, enum: [image] }, media_id: { type: string }, alt: { type: string, maxLength: 300 }, intrinsic_size: { $ref: "#/components/schemas/PlaylistIntrinsicSize" } } }
    PlaylistVideoContent: { type: object, additionalProperties: false, required: [type, media_id, intrinsic_size, muted, loop], properties: { type: { type: string, enum: [video] }, media_id: { type: string }, intrinsic_size: { $ref: "#/components/schemas/PlaylistIntrinsicSize" }, muted: { type: boolean, enum: [true] }, loop: { type: boolean } } }
    PlaylistIframeContent: { type: object, additionalProperties: false, required: [type, src, title], properties: { type: { type: string, enum: [iframe] }, src: { type: string, format: uri, pattern: "^https://" }, title: { type: string, minLength: 1, maxLength: 200 } } }
    PlaylistIntrinsicSize: { type: object, additionalProperties: false, required: [width, height], properties: { width: { type: number, exclusiveMinimum: 0 }, height: { type: number, exclusiveMinimum: 0 } } }
    PlaylistList: { type: object, additionalProperties: false, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Playlist" } } } }
    ScreenPatch: { type: object, additionalProperties: false, minProperties: 1, properties: { name: { type: string, minLength: 1, maxLength: 120 }, playlist_id: { type: string } } }
    PairScreen: { type: object, additionalProperties: false, required: [code], properties: { code: { type: string, pattern: "^[23456789ABCDEFGHJKMNPQRSTUVWXYZ]{6}$" }, label: { type: string, minLength: 1, maxLength: 120 } } }
    ProvisionScreen: { type: object, additionalProperties: false, properties: { label: { type: string, minLength: 1, maxLength: 120 } } }
    ScreenProvisioning: { type: object, additionalProperties: false, required: [screen, public_url, provisioning_url, expires_at], properties: { screen: { $ref: "#/components/schemas/Screen" }, public_url: { type: string, format: uri }, provisioning_url: { type: string, pattern: "^https?://[^#]+/s/[^#]+#provision=[A-Za-z0-9_-]{43}$" }, expires_at: { type: string, format: date-time } } }
    Screen: { type: object, additionalProperties: false, required: [id, public_id, label, revision, manifest_revision, content_access_generation, state, created_at, updated_at], properties: { id: { type: string }, public_id: { type: string }, label: { type: string }, playlist_id: { type: string }, revision: { type: integer }, manifest_revision: { type: integer }, content_access_generation: { type: integer }, state: { type: string, enum: [pairing_pending, active] }, created_at: { type: string, format: date-time }, updated_at: { type: string, format: date-time } } }
    ScreenList: { type: object, additionalProperties: false, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Screen" } } } }
    Event: { type: object, additionalProperties: true, required: [cursor, sequence, type, severity, message, at], properties: { cursor: { type: string }, sequence: { type: integer }, type: { type: string }, severity: { type: string }, request_id: { type: string }, operation_id: { type: string }, message: { type: string }, resource: { type: object, additionalProperties: true }, details: { type: object, additionalProperties: true }, at: { type: string } } }
    EventList: { type: object, additionalProperties: false, required: [items, next_cursor], properties: { items: { type: array, items: { $ref: "#/components/schemas/Event" } }, next_cursor: { type: string } } }
    KVWrite: { type: object, additionalProperties: false, required: [value_base64, content_type], properties: { value_base64: { type: string, contentEncoding: base64, maxLength: 1398104 }, content_type: { type: string, minLength: 1, maxLength: 127 } } }
    KVEntry: { type: object, additionalProperties: false, required: [application_id, key, value_base64, content_type, bytes, sha256, revision], properties: { application_id: { type: string }, key: { type: string }, value_base64: { type: string, contentEncoding: base64 }, content_type: { type: string }, bytes: { type: integer }, sha256: { type: string, pattern: "^[a-f0-9]{64}$" }, revision: { type: integer } } }
    KVSummary: { type: object, additionalProperties: false, required: [application_id, key, content_type, bytes, sha256, revision], properties: { application_id: { type: string }, key: { type: string }, content_type: { type: string }, bytes: { type: integer }, sha256: { type: string, pattern: "^[a-f0-9]{64}$" }, revision: { type: integer }, created_at: { type: string }, updated_at: { type: string } } }
    KVList: { type: object, additionalProperties: false, required: [items], properties: { items: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/KVSummary" } } } }
    MediaUploadDeclaration: { type: object, additionalProperties: false, required: [filename, content_type, bytes, sha256], properties: { filename: { type: string, minLength: 1, maxLength: 255 }, content_type: { type: string, enum: [image/png, image/jpeg, image/webp, image/gif, video/mp4, video/webm] }, bytes: { type: integer, minimum: 1, maximum: 1073741824 }, sha256: { type: string, pattern: "^[a-f0-9]{64}$" } } }
    MediaCommit: { type: object, additionalProperties: false, required: [content_type, bytes, sha256], properties: { content_type: { type: string, enum: [image/png, image/jpeg, image/webp, image/gif, video/mp4, video/webm] }, bytes: { type: integer, minimum: 1, maximum: 1073741824 }, sha256: { type: string, pattern: "^[a-f0-9]{64}$" } } }
    MediaUploadSession: { type: object, additionalProperties: false, required: [id, operation, upload_url, method, headers, expires_at], properties: { id: { type: string }, operation: { $ref: "#/components/schemas/Operation" }, upload_url: { type: string, format: uri }, method: { type: string, enum: [PUT] }, headers: { type: object, additionalProperties: { type: string }, description: Exact signed request headers; clients must send every field verbatim. }, expires_at: { type: string, format: date-time } } }
    Media: { type: object, additionalProperties: false, required: [id, filename, kind, content_type, operation_id, sha256, bytes, width, height, revision, state, created_at, updated_at], properties: { id: { type: string }, filename: { type: string }, kind: { type: string, enum: [image, video] }, content_type: { type: string }, operation_id: { type: string }, sha256: { type: string, pattern: "^[a-f0-9]{64}$" }, bytes: { type: integer }, width: { type: integer, minimum: 1, description: Verified immutable intrinsic width in pixels. }, height: { type: integer, minimum: 1, description: Verified immutable intrinsic height in pixels. }, duration_ms: { type: integer, minimum: 1, description: "Verified container duration; present for ready video media." }, revision: { type: integer }, state: { type: string, enum: [ready] }, created_at: { type: string, format: date-time }, updated_at: { type: string, format: date-time } } }
    MediaList: { type: object, additionalProperties: false, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Media" } } } }
    PairingSession: { type: object, additionalProperties: false, required: [code, expires_at], properties: { code: { type: string, pattern: "^[23456789ABCDEFGHJKMNPQRSTUVWXYZ]{6}$" }, expires_at: { type: string, format: date-time } } }
    NativePairingSession: { type: object, additionalProperties: false, required: [code, pairing_credential, expires_at], properties: { code: { type: string, pattern: "^[23456789ABCDEFGHJKMNPQRSTUVWXYZ]{6}$" }, pairing_credential: { type: string, pattern: "^srp_[A-Za-z0-9_-]{43}$" }, expires_at: { type: string, format: date-time } } }
    PairingClaimedEvent: { type: object, additionalProperties: false, required: [type, completion_nonce], properties: { type: { type: string, enum: [pairing.claimed] }, completion_nonce: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" } } }
    PairingClaim: { type: object, additionalProperties: false, required: [screen, public_url], properties: { screen: { $ref: "#/components/schemas/Screen" }, public_url: { type: string, format: uri } } }
