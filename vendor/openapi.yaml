      properties:
        kid: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
        completion_nonce: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
        public_key: { $ref: "#/components/schemas/PlayerPublicKey" }
        signature: { type: string, minLength: 80, maxLength: 4096, description: Compact EdDSA JWS with op=pairing.complete and request_hash binding the exact pairing credential and completion nonce. }
        host: { $ref: "#/components/schemas/RuntimeHostHint" }
    NativeIdentityChallengeRequest:
      type: object
      additionalProperties: true
      required: [kid, op, request_hash]
      description: Supply the operation and its request_hash for every challenge. An unknown key also requires public_key and op=pairing.start. Creating a challenge does not enroll the key.
      properties:
        kid: { type: string, pattern: "^[A-Za-z0-9_-]{43}$", description: RFC 7638 SHA-256 JWK thumbprint. }
        public_key: { $ref: "#/components/schemas/PlayerPublicKey" }
        op: { type: string, enum: [pairing.start, pairing.complete, session.mint, identity.reset] }
        request_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
    NativeIdentityChallenge:
      type: object
      additionalProperties: true
      required: [nonce, expires_at, aud, op, request_hash]
      description: Compare the returned op and request_hash with your locally computed values before signing. Each nonce expires in 120 seconds and can be consumed once.
      properties:
        nonce: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
        expires_at: { type: string, format: date-time }
        aud: { type: string, enum: [screenrig-runtime] }
        op: { type: string, enum: [pairing.start, pairing.complete, session.mint, identity.reset] }
        request_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
    NativeIdentityProof:
      type: object
      additionalProperties: true
      required: [kid, public_key, signature]
      description: >-
        Compact JWS protected header is exactly {"alg":"EdDSA"}. Claims are kid,
        nonce, aud=screenrig-runtime, op, integer iat/exp, nonempty jti, and
        request_hash. Contextual proofs last at most 120 seconds and expire no
        later than their issued challenge. request_hash is lowercase SHA-256 hex
        of UTF-8 strings joined by one NUL, with no trailing NUL, starting with
        screenrig.native.identity.request.v1 and op. Append Idempotency-Key for
        pairing.start and session.mint; append the exact srp_ pairing credential
        then completion_nonce for pairing.complete; append nothing for identity.reset.
        Every proof must include request_hash. A cached
        operation result still requires a fresh issued proof or the exact accepted
        proof while its short-lived receipt remains valid. Duplicate or unknown
        JWS/JWK members, noncanonical base64url, and non-prime-order keys are rejected. Unknown request body members are ignored.
      properties:
        kid: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
        public_key: { $ref: "#/components/schemas/PlayerPublicKey" }
        signature: { type: string, minLength: 80, maxLength: 4096, description: Compact EdDSA JWS. }
    NativeIdentitySessionRequest:
      type: object
      additionalProperties: true
      required: [kid, public_key, signature]
      description: >-
        NativeIdentityProof with op=session.mint plus the optional host hint. A
        present host REPLACES the host stored on the screen, because firmware
        and shell versions drift over a screen's life. The hint never affects
        authorization; only the signed proof does. Unknown members are ignored,
        and host and playback are read tolerantly (docs/player-compatibility.md
        §1.1).
      properties:
        kid: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
        public_key: { $ref: "#/components/schemas/PlayerPublicKey" }
        signature: { type: string, minLength: 80, maxLength: 4096, description: Compact EdDSA JWS with op=session.mint. }
        host: { $ref: "#/components/schemas/RuntimeHostHint" }
        playback: { $ref: "#/components/schemas/PlaybackHandshake" }
        player: { $ref: "#/components/schemas/PlayerIdentity" }
    NativePairingCompletion: { type: object, additionalProperties: true, required: [screen, public_url], properties: { screen: { $ref: "#/components/schemas/RuntimePairingScreen" }, public_url: { type: string, format: uri } } }
    BrowserProvisioningExchange: { type: object, additionalProperties: true, required: [provisioning_token, exchange_id], properties: { provisioning_token: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }, exchange_id: { type: string, pattern: "^xchg_[A-Za-z0-9_-]{43}$" } } }
    BrowserProvisioningCompletion: { type: object, additionalProperties: true, required: [screen, public_url], properties: { screen: { $ref: "#/components/schemas/RuntimePairingScreen" }, public_url: { type: string, format: uri } } }
