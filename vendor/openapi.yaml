openapi: 3.1.0
info:
  title: ScreenRig API
  version: 0.3.0
  description: >-
    Agent-operated digital signage control and runtime API.

    Public remaining is whole credits, never millicredits. Authenticated /api/v1
    JSON and problem responses include ScreenRig-Credits-Remaining,
    ScreenRig-Credits-Reset, and ScreenRig-Credits-Included. SSE, runtime,
    content, and unauthenticated responses omit them. The ledger unit remains
    millicredits (1000 mcr = 1 credit); published remaining is floored.

    Authenticated user or agent /api/v1 requests cost 1 credit, debited
    immediately against this server request id. Remaining below 1 whole credit
    is payment_required. GET /api/v1/account and POST
    /api/v1/account/credential/revoke do not debit, so a zero-remaining account
    can recover. Screen messages are exempt from this meter:
    POST /api/v1/screens/{id}/toast, POST /api/v1/screens/{id}/screenshot,
    GET /api/v1/screens/{id}/screenshot, and GET
    /api/v1/screens/{id}/screenshot/status. Runtime, pairing, content, health,
    and unauthenticated routes are not this meter. Inbound media commit,
    application accept, and K/V put bytes, outbound runtime media/package/release
    and K/V get bytes, and stored bytes settle hourly against remaining.
    Public remaining stays whole credits.

    Opening GET /api/v1/events/stream costs 1 credit as the listen subscribe.
    Later billed events on that stream cost 1 credit each. Screen conversation
    events are exempt: screen.*, runtime.*, and application.event. Heartbeats
    and the retry preamble never charge. playlist.*, media.*, kv.*,
    application.published, operation.*, account.*, feedback.*, stream.cursor,
    and stream.resync_required are billed. GET /dashboard/v1/events/stream
    bills arriving events under this same per-event meter and the same
    exemption set; like every SSE response it omits the ScreenRig-Credits-*
    headers. A dashboard session reads the same whole-credit balance through
    GET /dashboard/v1/balance, which never debits and remains available at zero.
    SSE debit idempotency is
    sse-event:<account_id>:<sequence>; reconnect replay is free. An unpaid
    billed event is not written and the stream closes.

    The URL major is the compatibility boundary for the /api/v1, /runtime/v1,
    /content/v1, and /dashboard/v1 families. This document's info.version is
    the contract-document version, not a URL or product API major. The
    lifecycle policy is recorded in x-api-lifecycle below.

    No operation is currently deprecated, so responses emit no Deprecation,
    Sunset, or rel=deprecation Link lifecycle headers today.

    Successful responses from routes that consume a disclosed fixed-window
    policy may include the optional RateLimit-Policy and RateLimit structured
    field list members when the request passes admission. Exact replays and
    deployments without shared admission can answer without them. Fixed-window
    rejections include them according to
    draft-ietf-httpapi-ratelimit-headers-11, an Internet-Draft rather than an
    RFC. Retry-After remains authoritative on 429. Fleet-global quotas,
    internal partition keys, concurrency capacity, and byte-budget capacity
    are not disclosed. Every operation with public fixed-window controls lists
    those controls in x-rate-limit-policies and names its optional admitted
    response headers in x-rate-limit-admitted-response-headers.
x-api-lifecycle:
  documentVersionMeaning: Contract-document version; not a URL or product API major.
  urlMajorFamilies: [/api/v1, /runtime/v1, /content/v1, /dashboard/v1]
  compatibleWithinMajor:
    - Additive endpoints and methods.
    - Optional request members.
    - New problem codes.
    - New fields only where the published schema permits unknown fields.
  breakingWithinMajor:
    - Route or field removal or rename.
    - Type, meaning, or authorization changes.
    - Making optional input required.
    - Adding a member to a closed enum.
    - Adding a field to a closed response object.
  newMajorMinimumOverlapDays: 180
  sunsetMinimumNoticeDays: 90
  deprecationMinimumServiceDays: 90
  deprecationServiceClock: RFC 9745 Deprecation effective date; a later published commitment controls.
  deprecationSignals:
    - OpenAPI deprecated true on the operation.
    - RFC 9745 Deprecation with its effective date.
    - RFC 8594 Sunset once the sunset date is fixed.
    - Link with rel=deprecation to migration documentation.
  migrationChannels:
    - OpenAPI
    - /docs/api/#deprecations
    - /docs/api.md#deprecations
  currentDeprecatedOperations: []
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: https://api.screenrig.ai
    description: Control-plane origin
security: []
paths:
  /.health:
    get:
      operationId: getHealth
      responses:
        "200": { description: Alive, content: { application/json: { schema: { $ref: "#/components/schemas/HealthResponse" } } } }
  /.ready:
    get:
      operationId: getReadiness
      responses:
        "200": { description: Ready, content: { application/json: { schema: { $ref: "#/components/schemas/ReadyResponse" } } } }
        "503": { $ref: "#/components/responses/Problem" }
  /.version:
    get:
      operationId: getVersion
      responses:
        "200": { description: Version, content: { application/json: { schema: { $ref: "#/components/schemas/VersionResponse" } } } }
  /api/v1/capabilities:
    get:
      operationId: getCapabilities
      responses:
        "200": { description: Capability and archive limits, content: { application/json: { schema: { $ref: "#/components/schemas/Capabilities" } } } }
  /api/v1/enrollments:
    post:
      operationId: enrollCLI
      x-rate-limit-policies: [{ name: cli-enrollment-client, quota: 3, windowSeconds: 3600 }, { name: cli-enrollment-ip, quota: 5, windowSeconds: 3600 }]
      x-rate-limit-admitted-response-headers: [RateLimit-Policy, RateLimit]
      description: >-
        Internal bundled-CLI enrollment. It is an explicit step the agent runs, not an
        automatic side effect of the first account-scoped command. The body must carry a
        contact email; a missing or malformed address is rejected with invalid_request and
        the rejection never echoes it. The address is unique across accounts, so a second
        enrollment with the same normalized address is rejected with email_conflict, which
        the same cli-enrollment-client and cli-enrollment-ip policies bound. The address is
        stored unverified and grants no authority by itself. After an authenticated dashboard
        user sets a password on this same account, the normalized address identifies the
        account for password login; there is no email-based signup, recovery, or account
        attachment. Persist client_id, the
        email, and Idempotency-Key before sending; an exact retry redelivers the same
        permanent credential from its encrypted issuance for ten minutes without creating
        another account and without tripping the email conflict. After that delivery window
        the durable idempotency result returns credential_issuance_expired; no follow-up
        mutation is required or supported.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CLIEnrollmentRequest" } } } }
      responses:
        "201": { description: "New account and permanent bearer credential. The account carries the unverified contact address in its trimmed supplied form. Persist and verify the token before reporting enrollment success. The credential has no scheduled expiry but its encrypted exact-retry delivery envelope exists only until issuance_expires_at.", headers: { Cache-Control: { schema: { type: string, enum: ["private, no-store"] } }, RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }, RateLimit: { $ref: "#/components/headers/RateLimit" } }, content: { application/json: { schema: { $ref: "#/components/schemas/CLIEnrollment" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "410": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimitedProblem" }
        "503": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/agent-connections:
    post:
      operationId: startAgentConnection
      description: Starts a ten-minute request to connect another agent to an existing account. The caller supplies an X25519 public JWK and receives a temporary connection credential separately from the browser approval URL. No account bearer, cookie, Origin header, query credential, or Idempotency-Key is accepted. The connection id is descriptive and never authority.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AgentConnectionRequest" } } } }
      responses:
        "201": { description: "Temporary connection authority and safe dashboard approval URL. The temporary credential is never placed in the URL.", headers: { Cache-Control: { schema: { type: string, enum: ["private, no-store"] } }, Referrer-Policy: { schema: { type: string, enum: [no-referrer] } } }, content: { application/json: { schema: { $ref: "#/components/schemas/AgentConnectionStart" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimitedProblem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/agent-connections/{id}/events:
    get:
      operationId: streamAgentConnectionEvents
      description: Status-only SSE authenticated by the temporary ScreenRig-Agent-Connect credential in Authorization. Data contains only AgentConnection metadata and closes on approved, denied, connected, expired, or cancelled. It never contains a bearer, credential envelope, nonce, cookie, or account identifier.
      security: [{ agentConnectionAuthorization: [] }]
      parameters: [{ $ref: "#/components/parameters/ResourceID" }]
      responses:
        "200": { description: Status-only connection SSE., headers: { Cache-Control: { schema: { type: string, enum: ["no-cache, no-store, no-transform"] } }, X-Accel-Buffering: { schema: { type: string, enum: [no] } } }, content: { text/event-stream: { schema: { type: string } } } }
        "401": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/agent-connections/{id}/credential:
    post:
      operationId: collectAgentCredential
      description: Collects the exact replay-safe credential envelope after approval. The temporary connection bearer authenticates the request, while X25519, HKDF-SHA-256, and AES-256-GCM bind the envelope to the recipient key supplied at connection creation. No plaintext account bearer is returned by this route. The envelope is available only for a fresh ten-minute delivery window and is deleted on activation, cancellation, or expiry.
      security: [{ agentConnectionAuthorization: [] }]
      parameters: [{ $ref: "#/components/parameters/ResourceID" }]
      responses:
        "200": { description: Recipient-bound credential envelope., headers: { Cache-Control: { schema: { type: string, enum: ["private, no-store"] } } }, content: { application/json: { schema: { $ref: "#/components/schemas/AgentCredentialCollection" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "410": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/agents/self/activate:
    post:
      operationId: activateCurrentAgent
      description: Proves successful envelope decryption and durable local storage by presenting the pending bearer. Atomically activates both the agent and token, deletes the delivery envelope, and is replay-safe with the now-active bearer. It takes no body and does not debit the API meter.
      security: [{ pendingAgentBearer: [] }]
      responses:
        "200": { description: Active agent., headers: { Cache-Control: { schema: { type: string, enum: ["private, no-store"] } } }, content: { application/json: { schema: { $ref: "#/components/schemas/Agent" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "410": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/agents/self:
    get:
      operationId: getCurrentAgent
      description: Returns the agent installation linked to the calling account bearer plus connection_ready. connection_ready is true when this same account has either a persisted WebAuthn credential or an account password owned by a dashboard user and can therefore authorize another agent. Identity status is diagnostic and does not debit the API meter.
      security: [{ accountBearer: [] }]
      responses:
        "200": { description: Current agent and production connection readiness., headers: { Cache-Control: { schema: { type: string, enum: ["private, no-store"] } } }, content: { application/json: { schema: { $ref: "#/components/schemas/AgentSelfStatus" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/agents/self/disconnect:
    post:
      operationId: disconnectCurrentAgent
      description: Revokes the calling agent and its bearer without deleting the account or content. Repeating with the same cryptographically valid revoked bearer is a no-op success. Disconnecting the last active agent returns agent_lockout_risk unless allow_last_agent is explicit. Does not debit the API meter.
      security: [{ revocableAgentBearer: [] }]
      requestBody: { required: false, content: { application/json: { schema: { $ref: "#/components/schemas/AgentDisconnectRequest" } } } }
      responses:
        "204": { description: Agent disconnected., headers: { Cache-Control: { schema: { type: string, enum: ["private, no-store"] } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/account:
    get:
      operationId: getAccount
      description: >-
        The calling account. Does not debit the 1-credit API meter, so a
        zero-remaining account can still read remaining and recover. After a
        successful account principal, authenticated /api/v1 JSON and problem
        responses include ScreenRig-Credits-Remaining, ScreenRig-Credits-Reset,
        and ScreenRig-Credits-Included as whole credits. SSE, runtime, content,
        and unauthenticated responses omit them.
      security: [{ accountBearer: [] }]
      responses:
        "200":
          description: Account
          headers:
            ScreenRig-Credits-Remaining: { $ref: "#/components/headers/ScreenRigCreditsRemaining" }
            ScreenRig-Credits-Reset: { $ref: "#/components/headers/ScreenRigCreditsReset" }
            ScreenRig-Credits-Included: { $ref: "#/components/headers/ScreenRigCreditsIncluded" }
          content: { application/json: { schema: { $ref: "#/components/schemas/Account" } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/account/credential/revoke:
    post:
      operationId: revokeCurrentAccountCredential
      description: Legacy compatibility alias for POST /api/v1/agents/self/disconnect. It disconnects the agent linked to exactly the calling account bearer and issues no replacement. The account, screens, and content remain. Disconnecting the last active agent returns agent_lockout_risk unless allow_last_agent is explicit. Repeating this request with the same cryptographically valid already-revoked bearer returns 204 only on this endpoint, allowing safe repair of an ambiguous response; every other account route rejects that bearer. This operation is intrinsically idempotent and does not use an Idempotency-Key. It does not debit the 1-credit API meter.
      security: [{ accountBearer: [] }]
      requestBody: { required: false, content: { application/json: { schema: { $ref: "#/components/schemas/AgentDisconnectRequest" } } } }
      responses:
        "204": { description: "The bearer-linked agent is disconnected and no replacement token was issued.", headers: { Cache-Control: { schema: { type: string, enum: ["private, no-store"] } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/account/dashboard-links:
    post:
      operationId: createAccountDashboardLink
      x-rate-limit-policies: [{ name: dashboard-link-account, quota: 30, windowSeconds: 3600 }, { name: dashboard-link-token, quota: 20, windowSeconds: 3600 }, { name: dashboard-link-ip, quota: 30, windowSeconds: 3600 }]
      x-rate-limit-admitted-response-headers: [RateLimit-Policy, RateLimit]
      description: >-
        Mints one single-use dashboard link for the calling account. The link
        carries a 256-bit token in its URL fragment, and its lifetime is the
        separate DashboardLinkTTL constant of ten minutes. That clock is not the
        thirty-minute public handoff locator, not the ten-minute protected
        provisioning delivery window, and not the seventy-two-hour native
        pairing clocks; do not describe it as any of them. There is no
        mint-time user hint in v1: the link names an account, and the claiming
        visitor establishes or selects the dashboard user. A fragment is never
        sent to the server, never lands in an access log, and never appears in a
        Referer header, so the client must strip it with history.replaceState
        before its first network call and then POST it exactly once to
        /dashboard/v1/links/claim. An exact Idempotency-Key retry returns the
        original link and expiry for twenty-four hours. Authenticated /api/v1
        control-plane request; costs 1 credit.
      security: [{ accountBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "201": { description: "Single-use dashboard link. Treat the whole URL as a credential: it is not a shareable address.", headers: { Cache-Control: { schema: { type: string, enum: ["private, no-store"] } }, Referrer-Policy: { schema: { type: string, enum: [no-referrer] } }, RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }, RateLimit: { $ref: "#/components/headers/RateLimit" } }, content: { application/json: { schema: { $ref: "#/components/schemas/DashboardLink" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "402": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimitedProblem" }
        "503": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/applications:
    get:
      operationId: listApplications
      security: [{ accountBearer: [] }]
      responses:
        "200": { description: Applications, content: { application/json: { schema: { $ref: "#/components/schemas/ApplicationList" } } } }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: uploadApplication
      x-rate-limit-policies: [{ name: application-upload, quota: 10, windowSeconds: 60 }]
      x-rate-limit-admitted-response-headers: [RateLimit-Policy, RateLimit]
      description: Streams one CLI-produced tar.gz directly into bounded durable staging. Metadata is carried in headers so the archive is never base64-wrapped or materialized as JSON by the server.
      security: [{ accountBearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/ArchiveSHA256" }
        - { $ref: "#/components/parameters/ExpandedBytes" }
        - { $ref: "#/components/parameters/FileCount" }
        - { $ref: "#/components/parameters/SDKVersion" }
        - { $ref: "#/components/parameters/ApplicationName" }
        - { $ref: "#/components/parameters/ApplicationNameEncoded" }
      requestBody: { required: true, content: { application/gzip: { schema: { type: string, contentMediaType: application/gzip, contentEncoding: binary, maxLength: 104857600 } } } }
      responses:
        "202": { description: Upload accepted, headers: { RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }, RateLimit: { $ref: "#/components/headers/RateLimit" } }, content: { application/json: { schema: { $ref: "#/components/schemas/OperationAccepted" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/applications/{id}/releases:
    post:
      operationId: uploadApplicationRelease
      x-rate-limit-policies: [{ name: application-upload, quota: 10, windowSeconds: 60 }]
      x-rate-limit-admitted-response-headers: [RateLimit-Policy, RateLimit]
      description: >-
        Publishes an immutable new release of an owned application using the same
        bounded tar.gz upload pipeline. If-Match guards the application revision;
        acceptance increments it, and successful publication increments it again
        when latest_ready_release changes. Name and application identity are
        preserved. Existing playlist release pins are not changed. An identical
        idempotent retry returns the original operation even after revision changes.
      security: [{ accountBearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/ResourceID" }
        - { $ref: "#/components/parameters/IfMatch" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/ArchiveSHA256" }
        - { $ref: "#/components/parameters/ExpandedBytes" }
        - { $ref: "#/components/parameters/FileCount" }
        - { $ref: "#/components/parameters/SDKVersion" }
      requestBody: { required: true, content: { application/gzip: { schema: { type: string, contentMediaType: application/gzip, contentEncoding: binary, maxLength: 104857600 } } } }
      responses:
        "202": { description: Upload accepted, headers: { RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }, RateLimit: { $ref: "#/components/headers/RateLimit" } }, content: { application/json: { schema: { $ref: "#/components/schemas/OperationAccepted" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/applications/{id}:
    get:
      operationId: getApplication
      security: [{ accountBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/ResourceID" }]
      responses:
        "200": { description: Application, content: { application/json: { schema: { $ref: "#/components/schemas/Application" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/operations/{id}:
    get:
      operationId: getOperation
      security: [{ accountBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/ResourceID" }]
      responses:
        "200": { description: Operation, content: { application/json: { schema: { $ref: "#/components/schemas/Operation" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/operations/{id}/cancel:
    post:
      operationId: cancelOperation
      security: [{ accountBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/ResourceID" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200": { description: Cancelled durable operation. A current worker fence can no longer finalize it., content: { application/json: { schema: { $ref: "#/components/schemas/Operation" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/playlists:
    get:
      operationId: listPlaylists
      description: Lists playlists. Authenticated /api/v1 control-plane read; costs 1 credit.
      security: [{ accountBearer: [] }]
      responses:
        "200":
          description: Playlists
          headers:
            ScreenRig-Credits-Remaining: { $ref: "#/components/headers/ScreenRigCreditsRemaining" }
            ScreenRig-Credits-Reset: { $ref: "#/components/headers/ScreenRigCreditsReset" }
            ScreenRig-Credits-Included: { $ref: "#/components/headers/ScreenRigCreditsIncluded" }
          content: { application/json: { schema: { $ref: "#/components/schemas/PlaylistList" } } }
        "402": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createPlaylist
      security: [{ accountBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PlaylistWrite" } } } }
      responses:
        "201": { description: Playlist, content: { application/json: { schema: { $ref: "#/components/schemas/Playlist" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/playlists/{id}:
    parameters: [{ $ref: "#/components/parameters/ResourceID" }]
    get:
      operationId: getPlaylist
      security: [{ accountBearer: [] }]
      responses:
        "200": { description: Playlist, content: { application/json: { schema: { $ref: "#/components/schemas/Playlist" } } } }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: updatePlaylist
      security: [{ accountBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/IfMatch" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PlaylistWrite" } } } }
      responses:
        "200": { description: Playlist, content: { application/json: { schema: { $ref: "#/components/schemas/Playlist" } } } }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deletePlaylist
      security: [{ accountBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/IfMatch" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/comment/screen/{id}:
    parameters: [{ $ref: "#/components/parameters/ResourceID" }]
    get:
      operationId: getScreenComments
      description: >-
        Opaque agent comments on the named screen. ScreenRig does not read or
        use them. They are not authorization and are not on the runtime
        manifest. A screen with no comments returns comments null. Archived
        screens remain addressable. Authenticated /api/v1 control-plane read;
        costs 1 credit.
      security: [{ accountBearer: [] }]
      responses:
        "200": { description: Comments, content: { application/json: { schema: { $ref: "#/components/schemas/Comments" } } } }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: putScreenComments
      description: >-
        Replaces opaque agent comments on the named screen. The comments value
        must be a JSON object whose compact UTF-8 form is at most 1024 bytes.
        Last-write-wins on the comments field only; revision, updated_at, and
        the runtime manifest are unchanged.
      security: [{ accountBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CommentsWrite" } } } }
      responses:
        "200": { description: Comments, content: { application/json: { schema: { $ref: "#/components/schemas/Comments" } } } }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteScreenComments
      description: Unsets screen comments. Idempotent if already unset. Does not bump revision or remint the runtime manifest.
