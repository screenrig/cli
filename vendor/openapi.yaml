  /dashboard/v1/screens/{id}/screenshot:
    servers: [{ url: https://dashboard.screenrig.ai, description: Backend-owned account dashboard origin }]
    parameters: [{ $ref: "#/components/parameters/ResourceID" }]
    post:
      operationId: requestDashboardScreenScreenshot
      x-rate-limit-policies: [{ name: screenshot-screen, quota: 10, windowSeconds: 60 }, { name: screenshot-account, quota: 30, windowSeconds: 60 }, { name: screenshot-ip, quota: 30, windowSeconds: 60 }]
      x-rate-limit-admitted-response-headers: [RateLimit-Policy, RateLimit]
      description: >-
        Requests one still screenshot of the named active screen owned by the
        session's account. It is the cookie sibling of POST
        /api/v1/screens/{id}/screenshot and shares one server-side slot and one
        state machine with it. This route is pending-safe: a request that is not
        an exact idempotent retry and is made while the slot is pending returns
        that in-flight capture_id with its expiry unchanged, and starts no second
        capture. An exact idempotent retry is answered from its own idempotency
        record instead, so it returns the capture_id that key first received
        whatever the slot now holds, and the 202 is the authority on that. There
        is one in-flight capture per screen, so concurrent dashboard viewers
        converge on the same capture instead of competing for the slot, and a
        repeated request cannot restart the expiry clock. Outside a replay, the
        idle, ready, and timed_out states each start a fresh capture. The shared
        slot machine is unchanged and stays latest-wins for the bearer route;
        this route reads status first and never takes that replacement path. The
        current ready slot is kept until a later upload succeeds. The server
        status machine is the arbiter of the one-in-flight rule. Image bytes
        never appear on any event stream.
      security: [{ dashboardSession: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "202": { description: "Accepted. The request is durable until expires_at. An exact idempotent retry returns this same capture_id and expiry.", headers: { Cache-Control: { schema: { type: string, enum: [no-store] } }, RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }, RateLimit: { $ref: "#/components/headers/RateLimit" } }, content: { application/json: { schema: { $ref: "#/components/schemas/ScreenScreenshotAccepted" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimitedProblem" }
        default: { $ref: "#/components/responses/Problem" }
    get:
      operationId: getDashboardScreenScreenshot
      description: >-
        Returns the current ready still WebP for the named screen as
        first-party same-origin bytes. There is no signed URL and no object
        key anywhere on this path: a signed URL reaching the dashboard is a
        defect. Optional capture_id must match the current ready slot. A named
        capture_id that elapsed with no upload is screenshot_unavailable, and
        one replaced by a later request is resource_conflict. Range is not
        accepted.
      security: [{ dashboardSession: [] }]
      parameters: [{ $ref: "#/components/parameters/ScreenshotCaptureID" }]
      responses:
        "200":
          description: Current ready still WebP.
          headers:
            Content-Type: { schema: { type: string, enum: [image/webp] } }
            Content-Length: { schema: { type: integer } }
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string, enum: ["private, no-store"] } }
            Content-Disposition: { schema: { type: string } }
          content: { image/webp: { schema: { type: string, format: binary } } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /dashboard/v1/screens/{id}/screenshot/status:
    servers: [{ url: https://dashboard.screenrig.ai, description: Backend-owned account dashboard origin }]
    get:
      operationId: getDashboardScreenScreenshotStatus
      description: >-
        Returns the screenshot state machine for the named screen owned by the
        session's account. It reads the same slot as GET
        /api/v1/screens/{id}/screenshot/status. idle has no request and no ready
        slot. pending is the current capture_id before expires_at with no
        upload. ready means the last successful upload matches the current
        capture_id. timed_out means the current identifier reached expires_at
        with no upload; a client renders screenshot_unavailable inline and backs
        off. Timeout is lazy, and a timed-out request does not delete an older
        ready slot.
      security: [{ dashboardSession: [] }]
      parameters: [{ $ref: "#/components/parameters/ResourceID" }]
      responses:
        "200": { description: Screenshot status for this session account's screen., headers: { Cache-Control: { schema: { type: string, enum: [no-store] } } }, content: { application/json: { schema: { $ref: "#/components/schemas/ScreenScreenshotStatus" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /dashboard/v1/screens/{id}/archive:
    servers: [{ url: https://dashboard.screenrig.ai, description: Backend-owned account dashboard origin }]
    post:
      operationId: archiveDashboardScreen
      description: >-
        Hides the screen from the default list and darkens the live glass. It
        does not unbind the player public key, and it releases screen_count
        quota. Archive is the only screen removal the dashboard offers: hard
        screen delete stays blocked by player identity, so DELETE is absent
        from this path family rather than answering screen_archive_required.
        The durable account event carries the acting dashboard user as actor.
      security: [{ dashboardSession: [] }]
      parameters: [{ $ref: "#/components/parameters/ResourceID" }, { $ref: "#/components/parameters/IfMatch" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200": { description: Screen archived., headers: { Cache-Control: { schema: { type: string, enum: ["private, no-store"] } } }, content: { application/json: { schema: { $ref: "#/components/schemas/Screen" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /dashboard/v1/screens/{id}/unarchive:
    servers: [{ url: https://dashboard.screenrig.ai, description: Backend-owned account dashboard origin }]
    post:
      operationId: unarchiveDashboardScreen
      description: >-
        Restores an archived screen to the default list and remints a normal
