    PlaylistMediaSelectorByID: { type: object, additionalProperties: false, required: [by, media_id], properties: { by: { type: string, enum: [id] }, media_id: { type: string, pattern: "^med_" }, one_at_a_time: { type: boolean, enum: [false], default: false } } }
    PlaylistMediaSelectorByIDs: { type: object, additionalProperties: false, required: [by, media_ids], properties: { by: { type: string, enum: [ids] }, media_ids: { type: array, minItems: 1, maxItems: 32, uniqueItems: true, items: { type: string, pattern: "^med_" } }, one_at_a_time: { type: boolean, default: false } } }
    PlaylistMediaSelectorByAll: { type: object, additionalProperties: false, required: [by], properties: { by: { type: string, enum: [all] }, one_at_a_time: { type: boolean, default: false } } }
    PlaylistMediaSelectorByTag: { type: object, additionalProperties: false, required: [by, tag], properties: { by: { type: string, enum: [tag] }, tag: { type: string, pattern: "^[A-Za-z0-9]{1,32}$" }, one_at_a_time: { type: boolean, default: false } } }
    PlaylistResolvedMedia: { type: object, additionalProperties: false, required: [media_id, intrinsic_size], properties: { media_id: { type: string, pattern: "^med_" }, intrinsic_size: { $ref: "#/components/schemas/PlaylistIntrinsicSize" } } }
    CanvasColor: { type: string, pattern: "^#[0-9A-F]{8}$", description: Canonical uppercase sRGB RRGGBBAA. }
    LinearGradientStop:
      type: object
      additionalProperties: false
      required: [at, color]
      description: One stop on a top-to-bottom linear canvas background. at=0 is the top edge, at=1 is the bottom edge.
      properties:
        at: { type: number, minimum: 0, maximum: 1 }
        color: { $ref: "#/components/schemas/CanvasColor" }
    LinearGradientBackground:
      type: object
      additionalProperties: false
      required: [type, stops]
      description: Top-to-bottom linear gradient. There is no angle field. stops has 2 through 8 entries, strictly increasing at in [0, 1], first at=0, last at=1.
      properties:
        type: { type: string, enum: [linear] }
        stops: { type: array, minItems: 2, maxItems: 8, items: { $ref: "#/components/schemas/LinearGradientStop" } }
    CanvasBackground:
      oneOf:
        - { $ref: "#/components/schemas/CanvasColor" }
        - { $ref: "#/components/schemas/LinearGradientBackground" }
      description: "Solid canonical uppercase #RRGGBBAA, or a top-to-bottom linear gradient."
    PlaylistIntrinsicSize: { type: object, additionalProperties: false, required: [width, height], properties: { width: { type: number, exclusiveMinimum: 0 }, height: { type: number, exclusiveMinimum: 0 } } }
    PlaylistList: { type: object, additionalProperties: false, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Playlist" } } } }
    CommentsWrite:
      type: object
      additionalProperties: false
      required: [comments]
      properties:
        comments: { type: object, additionalProperties: true, description: "Opaque agent JSON object. Compact UTF-8 serialization must be at most 1024 bytes. Nested objects, arrays, and strings are allowed. Arrays, strings, numbers, booleans, and null are rejected as the comments value itself." }
    Comments:
      type: object
      additionalProperties: false
      required: [comments]
      properties:
        comments:
          oneOf:
            - { type: object, additionalProperties: true }
            - { type: "null" }
          description: "Opaque agent JSON object when set. Null when the target exists and comments are unset."
    ScreenPatch: { type: object, additionalProperties: false, minProperties: 1, properties: { name: { type: string, minLength: 1, maxLength: 120 }, playlist_id: { type: string }, timezone: { type: string, minLength: 1, maxLength: 64, description: "IANA time zone identifier, for example America/Los_Angeles. It is the zone every page visibility rule on this screen is evaluated in. Changing it remints the manifest revision. A screen assigned a playlist that uses page visibility must have one." } } }
    PairScreen: { type: object, additionalProperties: false, required: [code], properties: { code: { type: string, pattern: "^[23456789ABCDEFGHJKMNPQRSTUVWXYZ]{6}$" }, label: { type: string, minLength: 1, maxLength: 120 } } }
    ProvisionScreen: { type: object, additionalProperties: false, properties: { label: { type: string, minLength: 1, maxLength: 120 } } }
    ScreenProvisioning: { type: object, additionalProperties: false, required: [screen, public_url, provisioning_url, expires_at], properties: { screen: { $ref: "#/components/schemas/Screen" }, public_url: { type: string, format: uri }, provisioning_url: { type: string, pattern: "^https?://[^#]+/s/[^#]+#provision=[A-Za-z0-9_-]{43}$" }, expires_at: { type: string, format: date-time } } }
    Screen:
      type: object
      additionalProperties: false
      required: [id, public_id, label, revision, manifest_revision, content_access_generation, state, online, created_at, updated_at]
      properties:
        id: { type: string }
        public_id: { type: string }
        label: { type: string }
        playlist_id: { type: string }
        timezone: { type: string, description: "IANA time zone identifier. Absent until it is set. Page visibility rules are evaluated in this zone." }
        observation: { $ref: "#/components/schemas/ScreenObservation" }
        last_page_failure: { $ref: "#/components/schemas/PageFailure" }
        comments: { type: object, additionalProperties: true, description: "Opaque agent JSON object, compact UTF-8 ≤ 1024 bytes. Absent when unset. ScreenRig never reads or uses it. ScreenPatch cannot write it. Not on the runtime manifest and never authorization." }
        ads_unsupported:
          type: object
          additionalProperties: false
          required: [at]
          description: >-
            Present once a paired Player that did not register adslot-v1 was
            served a manifest with an adslot page: that Player shows house
            content only. at is the latest observation, refreshed at most once
            a day. Read-only project health metadata; it does not change screen
            revision or manifest authority.
          properties:
            at: { type: string, format: date-time }
        applications_unsupported:
          type: object
          additionalProperties: false
          required: [at]
          description: >-
            Present while this screen's paired Player cannot show the
            application or iframe primitives its manifest carries: a contract
            Player that did not declare web-content-v1 (the Apple Player never
            does; docs/player-compatibility.md §4.4, §10). The manifest is
            unchanged; the Player drops those primitives, and a page left with
            none. at is when the condition began. It is set once when the
            condition begins and removed when it ends (the Player gains the
            token, or its manifest no longer carries such primitives), each
            transition appending one project-only event,
            screen.applications_unsupported or
            screen.applications_unsupported_cleared. A paired session without
            web-content-v1 sets it when served application or iframe primitives. Read-only project
            health metadata; it does not change screen revision or manifest
            authority.
          properties:
            at: { type: string, format: date-time }
        revision: { type: integer }
        manifest_revision: { type: integer }
        content_access_generation: { type: integer }
        state: { type: string, enum: [pairing_pending, active, archived] }
        storage: { $ref: "#/components/schemas/ScreenStorage" }
        storage_shortfall: { $ref: "#/components/schemas/ScreenStorageShortfall" }
        storage_forecast: { $ref: "#/components/schemas/ScreenStorageForecast" }
        online:
          type: boolean
          description: >-
            True iff at least one paired GET /runtime/v1/events stream for this
            screen is currently connected, including a short reconnect window
            matching the EventSource retry of 3000ms. A paired session mint and
            a paired GET /runtime/v1/manifest also hold the screen online for
            that same window, so a restarting player reads online before its
            stream reconnects. Anonymous and unpaired sessions may hold
            events.read and do not count. Always present: false until the first
            paired runtime connect, and false for pairing_pending screens that
            have never connected. An archived screen whose player stays
            connected remains online, so archive and unarchive responses report
            live presence. Derived from live paired traffic, not a player
            heartbeat or presence.write report. Read-only on the project API;
            ScreenPatch, pairing bodies, session bodies, and the runtime manifest
            body cannot write it.
        last_online_at:
          type: string
          format: date-time
          description: >-
            Instant the screen last came online: a paired runtime events stream
            connected while the screen was offline, or a paired runtime session
            was minted (a new player process always refreshes it, even inside
            the previous online window). Present after the first paired runtime
            connect. Unchanged by a stream reconnect that lands inside the online
            window. When offline, it is the start of the last online period.
            Project cannot write it.
        last_ip:
          type: string
          maxLength: 45
          description: >-
            Last client IP observed when a paired runtime SSE connected, IPv4 or
            IPv6 textual form. Absent until the first paired runtime SSE connect.
            Operational metadata; IDs and IPs are never authorization. Project
            cannot write it.
        host:
          $ref: "#/components/schemas/HostContext"
        host_updated_at:
          type: string
          format: date-time
          description: >-
            Instant the stored host hint was last replaced by a native pairing
            start, completion, or session mint. Absent until a player sends one.
            Project cannot write it.
        recovery_pending:
          $ref: "#/components/schemas/ScreenRecoveryPending"
        archive_reason:
          type: string
          description: >-
            Present only while state is archived: what archived the screen.
            Known values: project (a project or dashboard archive request),
            device_reset (a signed on-player native identity.reset of the key
            bound to this screen), and device_unpair (a cookie-paired
            browser's own POST /runtime/v1/unpair). Every reason has the same
            effect: the screen leaves the default list, its glass is dark, and
            its device binding is kept, so the device keeps minting and
            unarchive resumes it with no re-pairing
            (docs/player-compatibility.md §5.1). Absent on screens archived
            before reasons were recorded. Readers ignore a value they do not
            know. Read-only.
        archived_at:
          type: string
          format: date-time
          description: Present only while state is archived and archive_reason is present. Instant the screen was archived. Read-only.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    HostContext:
      type: object
      additionalProperties: false
      required: [platform]
      description: >-
        The shell and hardware a player runs on, as the player reported it. A
        HINT that names a device; never a credential, never authorization. Only
        the Ed25519 key authorizes. Stored per screen, replaced by every session
        mint that carries one, deleted with the screen, never written to
        operation logs, never echoed in problem responses, and never returned
        to any project other than the owner's. Read-only on the project API;
        ScreenPatch cannot write it.
      properties:
        platform: { type: string, pattern: "^[a-z][a-z0-9-]{0,31}$", description: "Registered values: tizen, android, windows, qt, apple, chromeos, browser, brightsign. Another value matching the pattern is stored as the player reported it." }
        host_version: { type: string, minLength: 1, maxLength: 40, description: "Shell or container product version, CalVer or vendor form." }
        device: { $ref: "#/components/schemas/HostDevice" }
        capabilities: { type: array, maxItems: 32, uniqueItems: true, items: { type: string, pattern: "^[a-z0-9_]{1,40}$" } }
    HostDevice:
      type: object
      additionalProperties: false
      description: Optional hardware identifiers. duid and serial are the only two the recovery hint consults; a failed read on the player omits the field.
      properties:
        duid: { type: string, minLength: 6, maxLength: 128, pattern: "^[A-Za-z0-9:_-]+$" }
        serial: { type: string, minLength: 4, maxLength: 128, pattern: "^[A-Za-z0-9:_-]+$" }
        mac: { type: string, minLength: 6, maxLength: 64, pattern: "^[A-Za-z0-9:_-]+$", description: Colon or dash separated hex accepted as-is. }
        model: { type: string, minLength: 1, maxLength: 80 }
        firmware: { type: string, minLength: 1, maxLength: 80 }
        manufacturer: { type: string, minLength: 1, maxLength: 80 }
    RuntimeHostHint:
      type: object
      additionalProperties: true
      required: [platform]
      description: >-
        The optional native host hint on pairing start, pairing completion, and
        identity session mint. It names a device and is never authorization.
        It is read tolerantly (docs/player-compatibility.md §1.1.1): unknown
        members are ignored, a malformed field or capabilities entry is
        dropped, at most 32 capabilities are kept, and a value that is not an
        object or a platform outside the pattern drops the whole hint. None of
        these refuses the request. A Player still sends only the registered
        platform values and the members below, because a pre-contract backend
        refuses anything else.
      properties:
        platform: { type: string, pattern: "^[a-z][a-z0-9-]{0,31}$", description: "Registered values: tizen, android, windows, qt, apple, chromeos, browser, brightsign." }
        host_version: { type: string, minLength: 1, maxLength: 40 }
        device: { $ref: "#/components/schemas/RuntimeHostHintDevice" }
        capabilities: { type: array, items: { type: string, pattern: "^[a-z0-9_]{1,40}$" } }
    RuntimeHostHintDevice:
      type: object
      additionalProperties: true
      description: Optional hardware identifiers in the native host hint. A malformed field is dropped.
      properties:
        duid: { type: string, minLength: 6, maxLength: 128, pattern: "^[A-Za-z0-9:_-]+$" }
        serial: { type: string, minLength: 4, maxLength: 128, pattern: "^[A-Za-z0-9:_-]+$" }
        mac: { type: string, minLength: 6, maxLength: 64, pattern: "^[A-Za-z0-9:_-]+$" }
        model: { type: string, minLength: 1, maxLength: 80 }
        firmware: { type: string, minLength: 1, maxLength: 80 }
        manufacturer: { type: string, minLength: 1, maxLength: 80 }
    ScreenRecoveryPending:
      type: object
      additionalProperties: false
      required: [expires_at]
      description: >-
        Present while a native pairing session that presented this screen's
        hardware identity is waiting for the owning project to confirm with
        POST /api/v1/screens/{id}/recovery/confirm. Carries the deadline, which
        is the pairing session's own expiry, and the offering device's
        descriptive host fields (never duid, serial, or mac). A DUID is readable
        by any application on the panel, so an offer is a phishing surface:
        compare host.model and host.firmware with the display in front of you
        before confirming. The server refuses an offer while the screen's bound
        key has shown life within the last ten minutes (session mint, runtime
        stream, manifest fetch, or presence heartbeat), and accepts at most
        three offers per screen per rolling hour; a new offer replaces the
        pending one. Absent once confirmed, lapsed, or claimed as a new screen.
        Read-only.
      properties:
        expires_at: { type: string, format: date-time }
        host: { $ref: "#/components/schemas/ScreenRecoveryHost" }
    ScreenRecoveryHost:
      type: object
      additionalProperties: false
      description: >-
        What the device asking to recover this screen says it is, copied from
        the pairing start's host object. Descriptive fields only; it never
        carries duid, serial, or mac. Absent fields were not reported.
      properties:
        platform: { type: string, enum: [tizen, android, windows, qt, apple, chromeos, browser, brightsign] }
        model: { type: string, minLength: 1, maxLength: 80 }
        firmware: { type: string, minLength: 1, maxLength: 80 }
        manufacturer: { type: string, minLength: 1, maxLength: 80 }
    ScreenList: { type: object, additionalProperties: false, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Screen" } } } }
    PageFailure:
