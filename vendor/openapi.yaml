  /dashboard/v1/screens/{id}/screenshot:
    servers: [{ url: https://dashboard.screenrig.ai, description: Backend-owned project dashboard origin }]
    parameters: [{ $ref: "#/components/parameters/ResourceID" }]
    post:
      operationId: requestDashboardScreenScreenshot
      x-rate-limit-policies: [{ name: screenshot-screen, quota: 10, windowSeconds: 60 }, { name: screenshot-project, quota: 30, windowSeconds: 60 }, { name: screenshot-ip, quota: 30, windowSeconds: 60 }]
      x-rate-limit-admitted-response-headers: [RateLimit-Policy, RateLimit]
      description: >-
        Requests one still screenshot of the named active screen owned by the
        session's project. It is the cookie sibling of POST
        /api/v1/screens/{id}/screenshot and shares one server-side slot and one
        state machine with it. This route is pending-safe: a request that is not
        an exact idempotent retry and is made while the slot is pending returns
        that in-flight capture_id with its expiry unchanged, and starts no second
        capture. An exact idempotent retry is answered from its own idempotency
        record instead, so it returns the capture_id that key first received
        whatever the slot now holds, and the 202 is the authority on that. There
        is one in-flight capture per screen, so concurrent dashboard viewers
        converge on the same capture instead of competing for the slot, and a
        repeated request cannot restart the expiry clock. Outside a replay, the
        idle, ready, and timed_out states each start a fresh capture. The shared
        slot machine is unchanged and stays latest-wins for the bearer route;
        this route reads status first and never takes that replacement path. The
        current ready slot is kept until a later upload succeeds. The server
        status machine is the arbiter of the one-in-flight rule. Image bytes
        never appear on any event stream.
      security: [{ dashboardSession: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "202": { description: "Accepted. The request is durable until expires_at. An exact idempotent retry returns this same capture_id and expiry.", headers: { Cache-Control: { schema: { type: string, enum: [no-store] } }, RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }, RateLimit: { $ref: "#/components/headers/RateLimit" } }, content: { application/json: { schema: { $ref: "#/components/schemas/ScreenScreenshotAccepted" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimitedProblem" }
        default: { $ref: "#/components/responses/Problem" }
    get:
      operationId: getDashboardScreenScreenshot
      description: >-
        Returns the current ready still WebP for the named screen as
        first-party same-origin bytes. There is no signed URL and no object
        key anywhere on this path: a signed URL reaching the dashboard is a
        defect. Optional capture_id must match the current ready slot. A named
        capture_id that elapsed with no upload is screenshot_unavailable, and
        one replaced by a later request is resource_conflict. Range is not
        accepted.
      security: [{ dashboardSession: [] }]
      parameters: [{ $ref: "#/components/parameters/ScreenshotCaptureID" }]
      responses:
        "200":
          description: Current ready still WebP.
          headers:
            Content-Type: { schema: { type: string, enum: [image/webp] } }
            Content-Length: { schema: { type: integer } }
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string, enum: ["private, no-store"] } }
            Content-Disposition: { schema: { type: string } }
          content: { image/webp: { schema: { type: string, format: binary } } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /dashboard/v1/screens/{id}/screenshot/status:
    servers: [{ url: https://dashboard.screenrig.ai, description: Backend-owned project dashboard origin }]
    get:
      operationId: getDashboardScreenScreenshotStatus
      description: >-
        Returns the screenshot state machine for the named screen owned by the
        session's project. It reads the same slot as GET
        /api/v1/screens/{id}/screenshot/status. idle has no request and no ready
        slot. pending is the current capture_id before expires_at with no
        upload. ready means the last successful upload matches the current
        capture_id. timed_out means the current identifier reached expires_at
        with no upload; a client renders screenshot_unavailable inline and backs
        off. Timeout is lazy, and a timed-out request does not delete an older
        ready slot.
      security: [{ dashboardSession: [] }]
      parameters: [{ $ref: "#/components/parameters/ResourceID" }]
      responses:
        "200": { description: Screenshot status for this session project's screen., headers: { Cache-Control: { schema: { type: string, enum: [no-store] } } }, content: { application/json: { schema: { $ref: "#/components/schemas/ScreenScreenshotStatus" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /dashboard/v1/screens/{id}/reload:
    servers: [{ url: https://dashboard.screenrig.ai, description: Backend-owned project dashboard origin }]
    post:
      operationId: reloadDashboardScreen
      x-rate-limit-policies: [{ name: reload-project, quota: 60, windowSeconds: 60 }, { name: reload-screen, quota: 6, windowSeconds: 60 }, { name: reload-ip, quota: 60, windowSeconds: 60 }]
      x-rate-limit-admitted-response-headers: [RateLimit-Policy, RateLimit]
      description: >-
        The dashboard twin of POST /api/v1/screens/{id}/reload: same project
        fence, same player.reload event, same problems, and the same 202 body.
      security: [{ dashboardSession: [] }]
      parameters: [{ $ref: "#/components/parameters/ResourceID" }, { $ref: "#/components/parameters/IfMatch" }, { $ref: "#/components/parameters/OptionalIdempotencyKey" }]
      responses:
        "202": { description: "Accepted. The ETag is the unchanged screen revision.", headers: { Cache-Control: { schema: { type: string, enum: [no-store] } }, ETag: { schema: { type: string } }, RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }, RateLimit: { $ref: "#/components/headers/RateLimit" } }, content: { application/json: { schema: { $ref: "#/components/schemas/ScreenReloadAccepted" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimitedProblem" }
        default: { $ref: "#/components/responses/Problem" }
  /dashboard/v1/screens/{id}/archive:
    servers: [{ url: https://dashboard.screenrig.ai, description: Backend-owned project dashboard origin }]
    post:
      operationId: archiveDashboardScreen
      description: >-
        Hides the screen from the default list and darkens the live glass. It
        does not unbind the player public key, and it releases screen_count
        quota. Archive is the only screen removal the dashboard offers: hard
        screen delete stays blocked by player identity, so DELETE is absent
        from this path family rather than answering screen_archive_required.
        The durable project event carries the acting dashboard user as actor.
      security: [{ dashboardSession: [] }]
      parameters: [{ $ref: "#/components/parameters/ResourceID" }, { $ref: "#/components/parameters/IfMatch" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200": { description: Screen archived., headers: { Cache-Control: { schema: { type: string, enum: ["private, no-store"] } } }, content: { application/json: { schema: { $ref: "#/components/schemas/Screen" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /dashboard/v1/screens/{id}/recovery/confirm:
    servers: [{ url: https://dashboard.screenrig.ai, description: Backend-owned project dashboard origin }]
    post:
      operationId: confirmDashboardScreenRecovery
      description: >-
        Cookie-side twin of POST /api/v1/screens/{id}/recovery/confirm for the
        dashboard, which cannot call /api/v1. Confirms the pending recovery
        recorded when a native pairing start presented this screen's host duid
        or serial under a different bound key. The host object is a hint, never
        a credential; nothing is rebound until this confirmation. Completes the
        pending native pairing onto the EXISTING screen, retires the previous
        key with a fifteen-minute grace window, preserves playlists, label,
        schedules, and history, and emits screen.recovered with the acting
        dashboard user as actor. Same project only. If-Match is optional.
        recovery_not_offered, recovery_expired, and recovery_ambiguous are the
        stable problems; none echoes a device identifier.
      security: [{ dashboardSession: [] }]
      parameters: [{ $ref: "#/components/parameters/ResourceID" }, { $ref: "#/components/parameters/OptionalIfMatch" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200": { description: Screen recovered onto the pairing device's key., headers: { Cache-Control: { schema: { type: string, enum: ["private, no-store"] } } }, content: { application/json: { schema: { $ref: "#/components/schemas/Screen" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "410": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /dashboard/v1/screens/{id}/unarchive:
    servers: [{ url: https://dashboard.screenrig.ai, description: Backend-owned project dashboard origin }]
    post:
      operationId: unarchiveDashboardScreen
      description: >-
        Restores an archived screen to the default list and remints a normal
        manifest. It must pass screen admission and it does not change the
        bound public key. The durable project event carries the acting
        dashboard user as actor.
      security: [{ dashboardSession: [] }]
      parameters: [{ $ref: "#/components/parameters/ResourceID" }, { $ref: "#/components/parameters/IfMatch" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200": { description: Screen unarchived., headers: { Cache-Control: { schema: { type: string, enum: ["private, no-store"] } } }, content: { application/json: { schema: { $ref: "#/components/schemas/Screen" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /dashboard/v1/media:
    servers: [{ url: https://dashboard.screenrig.ai, description: Backend-owned project dashboard origin }]
    get:
      operationId: listDashboardMedia
      description: Lists ready media of the session's project. The backend holds one rendition per object and publishes no thumbnail.
      security: [{ dashboardSession: [] }]
      parameters: [{ $ref: "#/components/parameters/MediaTagQuery" }, { $ref: "#/components/parameters/MediaPrimitiveQuery" }]
      responses:
        "200": { description: Media, headers: { Cache-Control: { schema: { type: string, enum: ["private, no-store"] } } }, content: { application/json: { schema: { $ref: "#/components/schemas/MediaList" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /dashboard/v1/media/{id}:
    servers: [{ url: https://dashboard.screenrig.ai, description: Backend-owned project dashboard origin }]
    parameters: [{ $ref: "#/components/parameters/ResourceID" }]
    get:
      operationId: getDashboardMedia
      description: >-
        Returns metadata for one ready media object owned by the session's
        project. The identifier is not authorization; an object of any other
        project is not_found. There is no dashboard media upload or patch.
      security: [{ dashboardSession: [] }]
      responses:
        "200": { description: Ready private media metadata., headers: { ETag: { schema: { type: string } }, Cache-Control: { schema: { type: string, enum: ["private, no-store"] } } }, content: { application/json: { schema: { $ref: "#/components/schemas/Media" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteDashboardMedia
      description: >-
        Tombstones one media object owned by the session's project. An object a
        desired or active grant still references cannot be deleted. The durable
        project event carries the acting dashboard user as actor.
      security: [{ dashboardSession: [] }]
      parameters: [{ $ref: "#/components/parameters/IfMatch" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "204": { description: Tombstoned. Referenced desired or active grants cannot be deleted., headers: { Cache-Control: { schema: { type: string, enum: [no-store] } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /dashboard/v1/media/{id}/content:
    servers: [{ url: https://dashboard.screenrig.ai, description: Backend-owned project dashboard origin }]
    get:
      operationId: getDashboardMediaContent
      description: >-
        Streams the original rendition of one media object owned by the
        session's project as first-party same-origin bytes. Authority is the
        session cookie plus project ownership; the identifier and the object
        path are never authorization, and no signed URL or object key is ever
        published here. Range is accepted so that a plain video element can
        seek. This is not a runtime content grant: it does not read a manifest
        revision, it does not accept a runtime or release cookie, and it does
        not accept any ScreenRig-* Authorization header. V1 accepts one byte
        range only.
      security: [{ dashboardSession: [] }]
      parameters: [{ $ref: "#/components/parameters/ResourceID" }, { $ref: "#/components/parameters/Range" }]
      responses:
        "200":
          description: Complete original rendition.
          headers:
            Accept-Ranges: { schema: { type: string, enum: [bytes] } }
            Content-Length: { schema: { type: integer } }
            Content-Type: { schema: { type: string } }
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string, enum: ["private, no-store"] } }
            Content-Disposition: { schema: { type: string } }
            X-Content-Type-Options: { schema: { type: string, enum: [nosniff] } }
        "206":
          description: One standards-correct byte range.
          headers:
            Accept-Ranges: { schema: { type: string, enum: [bytes] } }
            Content-Range: { schema: { type: string } }
            Content-Length: { schema: { type: integer } }
            Content-Type: { schema: { type: string } }
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string, enum: ["private, no-store"] } }
            X-Content-Type-Options: { schema: { type: string, enum: [nosniff] } }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "416": { description: "Unsatisfiable, multiple, or malformed range.", headers: { Content-Range: { schema: { type: string } }, Accept-Ranges: { schema: { type: string, enum: [bytes] } } }, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "429": { $ref: "#/components/responses/RateLimitedProblem" }
        default: { $ref: "#/components/responses/Problem" }
  /dashboard/v1/playlists:
    servers: [{ url: https://dashboard.screenrig.ai, description: Backend-owned project dashboard origin }]
    get:
      operationId: listDashboardPlaylists
      description: >-
        Lists playlists of the session's project. This family is read-only: the
        dashboard shows what a screen is playing and never authors it, so there
        is no create, update, or delete here and there must not be. Authoring
        stays in the agent conversation and the CLI. (User ruling 2026-08-22.)
      security: [{ dashboardSession: [] }]
      responses:
        "200": { description: Playlists, headers: { Cache-Control: { schema: { type: string, enum: ["private, no-store"] } } }, content: { application/json: { schema: { $ref: "#/components/schemas/PlaylistList" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /dashboard/v1/playlists/{id}:
    servers: [{ url: https://dashboard.screenrig.ai, description: Backend-owned project dashboard origin }]
    parameters: [{ $ref: "#/components/parameters/ResourceID" }]
    get:
      operationId: getDashboardPlaylist
      description: >-
        Returns one playlist owned by the session's project, with its pages and
        their primitives. Authority is the session's project owning the
        playlist; the identifier is not authorization, so a playlist of any
        other project is not_found. There is no dashboard playlist write of any
        kind.
      security: [{ dashboardSession: [] }]
      responses:
        "200": { description: Playlist, headers: { ETag: { schema: { type: string } }, Cache-Control: { schema: { type: string, enum: ["private, no-store"] } } }, content: { application/json: { schema: { $ref: "#/components/schemas/Playlist" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /dashboard/v1/applications:
    servers: [{ url: https://dashboard.screenrig.ai, description: Backend-owned project dashboard origin }]
    get:
      operationId: listDashboardApplications
      description: Lists applications of the session's project. The interface calls them web apps; the contract name stays applications.
      security: [{ dashboardSession: [] }]
      responses:
        "200": { description: Applications, headers: { Cache-Control: { schema: { type: string, enum: ["private, no-store"] } } }, content: { application/json: { schema: { $ref: "#/components/schemas/ApplicationList" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /dashboard/v1/applications/{id}:
    servers: [{ url: https://dashboard.screenrig.ai, description: Backend-owned project dashboard origin }]
    parameters: [{ $ref: "#/components/parameters/ResourceID" }]
    get:
      operationId: getDashboardApplication
      description: Returns one application owned by the session's project. The identifier is not authorization; an application of any other project is not_found. There is no dashboard application upload.
      security: [{ dashboardSession: [] }]
      responses:
        "200": { description: Application, headers: { Cache-Control: { schema: { type: string, enum: ["private, no-store"] } } }, content: { application/json: { schema: { $ref: "#/components/schemas/Application" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteDashboardApplication
      description: >-
        Tombstones one application of the session's project together with its
        releases. It returns application_in_use while a live manifest still
        references any of those releases; the caller must first remove the
        primitive through the authoring surface. The durable project event
        carries the acting dashboard user as actor.
      security: [{ dashboardSession: [] }]
      parameters: [{ $ref: "#/components/parameters/IfMatch" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "204": { description: Application and its releases tombstoned., headers: { Cache-Control: { schema: { type: string, enum: [no-store] } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /dashboard/v1/applications/{id}/preview-launches:
    servers: [{ url: https://dashboard.screenrig.ai, description: Backend-owned project dashboard origin }]
    post:
      operationId: createDashboardApplicationPreviewLaunch
      x-rate-limit-policies: [{ name: dashboard-preview-project, quota: 120, windowSeconds: 60 }]
      x-rate-limit-admitted-response-headers: [RateLimit-Policy, RateLimit]
      description: >-
        Mints one single-use thirty-second launch ticket for the latest ready
        release of an application the session's project owns, on the existing
        exact release host. The ticket converts to the release-grant cookie on
        that host only, so the preview is cross-origin by construction and web
        application code can never read a dashboard cookie. Assign launch_url
        to iframe.src and to nothing else. Authority here is owner authority:
        the session's project owns the application. That is a deliberate second
        authority source alongside exact-current-manifest authority for
        screenrig.webapp-package/v1, and it is scoped to this operation. Do not
        generalize it to media or to protected runtime content. There is no
        parent player, so the browser SDK and the key-value bridge fail closed
        and the preview is presentation-only. An application with no ready
        release is resource_conflict.
      security: [{ dashboardSession: [] }]
      parameters: [{ $ref: "#/components/parameters/ResourceID" }]
      responses:
        "201": { description: Single-use 30-second exact-release-host preview launch., headers: { Cache-Control: { schema: { type: string, enum: [no-store] } }, Referrer-Policy: { schema: { type: string, enum: [no-referrer] } }, RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }, RateLimit: { $ref: "#/components/headers/RateLimit" } }, content: { application/json: { schema: { $ref: "#/components/schemas/ReleaseLaunch" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimitedProblem" }
        default: { $ref: "#/components/responses/Problem" }
  /dashboard/v1/events:
    servers: [{ url: https://dashboard.screenrig.ai, description: Backend-owned project dashboard origin }]
    get:
      operationId: listDashboardEvents
      description: >-
        Lists durable project events for the session's project. Dashboard
        mutations carry an actor naming the acting dashboard user. Events an
        agent or the CLI produced carry no actor. Paging matches
        GET /api/v1/events: pass next_cursor back as after, next_cursor is null
        at the end of the history, and limit accepts 1-200 (default 50) or is
        refused with invalid_request.
      security: [{ dashboardSession: [] }]
      parameters: [{ $ref: "#/components/parameters/AfterCursor" }, { $ref: "#/components/parameters/EventListLimit" }]
      responses:
        "200": { description: Durable events, headers: { Cache-Control: { schema: { type: string, enum: ["private, no-store"] } } }, content: { application/json: { schema: { $ref: "#/components/schemas/EventList" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /dashboard/v1/events/stream:
    servers: [{ url: https://dashboard.screenrig.ai, description: Backend-owned project dashboard origin }]
    get:
      operationId: streamDashboardEvents
      description: >-
        Replayable project event stream for the session's project, used for the
        live activity log and for screen presence changes. The query cursor
        takes precedence over Last-Event-ID. Invalid, future, and pre-retention
        cursors receive stream.resync_required at the current head and close.
        Screenshot image bytes and media bytes never appear on this stream.
      security: [{ dashboardSession: [] }]
      parameters: [{ $ref: "#/components/parameters/AfterCursor" }, { $ref: "#/components/parameters/LastEventID" }]
      responses:
        "200": { description: "Replayable SSE stream. Arriving billable events debit 1 whole credit each under the same meter and exemption set as GET /api/v1/events/stream; heartbeats and the retry preamble never charge. An unpaid billable event is not written and closes the stream; GET /dashboard/v1/balance remains available at zero. No ScreenRig-Credits-* headers.", headers: { Cache-Control: { schema: { type: string, enum: ["no-cache, no-store, no-transform"] } }, X-Accel-Buffering: { schema: { type: string, enum: [no] } } }, content: { text/event-stream: { schema: { type: string } } } }
        "401": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /dashboard/v1/playback:
    servers: [{ url: https://dashboard.screenrig.ai, description: Backend-owned project dashboard origin }]
    get:
      operationId: listDashboardPlaybackAggregates
      description: >-
        Daily playback aggregates for the session's project. One row per
        screen, media, and UTC day, newest days first. Identifiers filter the
        session project's own rows and are never a cross-project lookup.
      security: [{ dashboardSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/PlaybackScreenID" }
        - { $ref: "#/components/parameters/PlaybackMediaID" }
        - { $ref: "#/components/parameters/PlaybackDay" }
      responses:
        "200": { description: Daily playback aggregates for the session's project., headers: { Cache-Control: { schema: { type: string, enum: ["private, no-store"] } } }, content: { application/json: { schema: { $ref: "#/components/schemas/PlaybackAggregateList" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
components:
  headers:
    RateLimitPolicy:
      description: >-
        One or more public fixed-window policy list members using the Structured
        Fields syntax defined by draft-ietf-httpapi-ratelimit-headers-11. That
        specification is an Internet-Draft, not an RFC. Each member is a stable
        public policy name with q and w parameters. Internal keys and the pk
        parameter are never exposed; fleet-global quotas are omitted.
      schema: { type: string, example: '"project-write";q=20;w=60' }
    RateLimit:
      description: >-
        One or more fixed-window service-limit list members using the Structured
        Fields syntax defined by draft-ietf-httpapi-ratelimit-headers-11. Each
        disclosed member carries exact post-request remaining r and reset delay
        t rounded up to seconds. A fleet-global denial may instead carry only
        the opaque member "service";r=0;t=N. Retry-After is authoritative on
        429. Concurrency and byte-budget remaining capacity are not disclosed.
      schema: { type: string, example: '"project-write";r=19;t=42' }
    ScreenRigCreditsRemaining:
      description: Remaining prepaid credits as a whole integer. Same value as credit_remaining. Never negative.
      schema: { type: integer, minimum: 0 }
    ScreenRigCreditsReset:
      description: RFC 3339 UTC instant of the first moment of the next UTC calendar month, when the next included grant is added. Remaining is not replaced.
      schema: { type: string, format: date-time }
    ScreenRigCreditsIncluded:
      description: Whole credits granted by the plan each UTC month.
      schema: { type: integer, minimum: 0 }
  parameters:
    ResourceID: { name: id, in: path, required: true, schema: { type: string } }
    PlaylistPageID: { name: page_id, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z][A-Za-z0-9_-]{0,63}$" }, description: Playlist page id string. }
    ApplicationID: { name: application_id, in: path, required: true, schema: { type: string } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 200 } }
    OptionalIdempotencyKey: { name: Idempotency-Key, in: header, required: false, schema: { type: string, minLength: 8, maxLength: 200 }, description: "Omit for a fresh operation. Supply and reuse a key to deduplicate retries; the CLI manages keys automatically." }
    ArchiveSHA256: { name: ScreenRig-Archive-SHA256, in: header, required: true, schema: { type: string, pattern: "^[0-9a-f]{64}$" } }
    ExpandedBytes: { name: ScreenRig-Expanded-Bytes, in: header, required: true, schema: { type: integer, minimum: 1, maximum: 262144000 } }
    FileCount: { name: ScreenRig-File-Count, in: header, required: true, schema: { type: integer, minimum: 1, maximum: 5000 } }
    SDKVersion: { name: ScreenRig-SDK-Version, in: header, required: false, schema: { type: string, maxLength: 64 } }
    ApplicationName:
      name: ScreenRig-Application-Name
      in: header
      required: false
      description: ASCII application name; mutually exclusive with ScreenRig-Application-Name*. Leading and trailing whitespace is trimmed. Controls and duplicate header values are rejected. The decoded name is limited to 120 Unicode scalar values.
      schema: { type: string, maxLength: 120 }
    ApplicationNameEncoded:
      name: ScreenRig-Application-Name*
      in: header
      required: false
      description: >-
        Unicode application name encoded as RFC 8187 UTF-8'' followed by
        percent-encoded UTF-8 bytes (empty language, exact UTF-8 charset).
        Mutually exclusive with ScreenRig-Application-Name. Invalid escapes,
        invalid UTF-8, controls, and duplicate header values are rejected.
        Leading and trailing whitespace is trimmed; the decoded name is limited
        to 120 Unicode scalar values. Neither name header may rename a release
        update. This avoids raw Unicode in HTTP header values.
      schema: { type: string, maxLength: 1447 }
    IfMatch: { name: If-Match, in: header, required: false, schema: { type: string }, description: "Optional positive resource revision. Omit to write the current resource; a supplied stale revision is revision_conflict." }
    OptionalIfMatch: { name: If-Match, in: header, required: false, schema: { type: string }, description: "Optional positive resource revision. Omit to create or overwrite a key; a supplied stale revision is revision_conflict." }
    AfterCursor: { name: after, in: query, required: false, schema: { type: string } }
    EventListLimit: { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 }, description: "Page size. A value outside 1-200 is refused with invalid_request and an errors[] member whose field is limit." }
    PlaybackScreenID: { name: screen_id, in: query, required: false, schema: { type: string, pattern: "^(?:(?:stage|qa|development)_)?scr_" } }
    PlaybackMediaID: { name: media_id, in: query, required: false, schema: { type: string, pattern: "^med_" } }
    MediaTagQuery: { name: tag, in: query, required: false, schema: { type: string, pattern: "^[A-Za-z0-9]{1,32}$" }, description: Exact media tag. Untagged objects are omitted when this filter is present. }
    MediaPrimitiveQuery: { name: primitive, in: query, required: false, schema: { type: string, enum: [image, video] } }
    PlaybackDay: { name: day, in: query, required: false, schema: { type: string, format: date, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }, description: UTC calendar day of the aggregate. }
    LastEventID: { name: Last-Event-ID, in: header, required: false, schema: { type: string }, description: Durable cursor used when after is absent. }
    Range: { name: Range, in: header, required: false, schema: { type: string, pattern: "^bytes=[0-9]*-[0-9]*$" }, description: V1 accepts one byte range only. }
    ScreenshotCaptureID: { name: capture_id, in: query, required: false, schema: { $ref: "#/components/schemas/ScreenshotCaptureID" } }
    ScreenshotCaptureIDHeader: { name: ScreenRig-Capture-Id, in: header, required: true, schema: { $ref: "#/components/schemas/ScreenshotCaptureID" } }
    ScreenListState: { name: state, in: query, required: false, schema: { type: string, enum: [archived] }, description: Omit for pairing_pending and active. Pass archived to list archived screens only. }
    SecFetchSite: { name: Sec-Fetch-Site, in: header, required: false, schema: { type: string, enum: [same-origin, same-site, cross-site, none] } }
    SecFetchMode: { name: Sec-Fetch-Mode, in: header, required: false, schema: { type: string } }
    SecFetchDest: { name: Sec-Fetch-Dest, in: header, required: false, schema: { type: string } }
  securitySchemes:
    invitationSignup:
      type: apiKey
      in: cookie
      name: __Host-screenrig-signup
      description: Browser-bound link signup. HttpOnly, Secure, SameSite=Strict, Path=/; expires after 30 minutes. The invitation token alone cannot use a verified signup.
    agentConnectionAuthorization:
      type: apiKey
      in: header
      name: Authorization
      description: Temporary `ScreenRig-Agent-Connect <credential>` authority returned only by connection creation. It is never accepted as a project bearer, dashboard cookie, URL parameter, or runtime credential.
    pendingAgentBearer: { type: http, scheme: bearer, bearerFormat: sr_live, description: "Pending agent bearer accepted only for its own activation, plus the same active bearer for exact acknowledgement replay." }
    revocableAgentBearer: { type: http, scheme: bearer, bearerFormat: sr_live, description: "Active agent bearer, or the same cryptographically verified revoked bearer for an idempotent self-disconnect replay." }
    projectBearer: { type: http, scheme: bearer, bearerFormat: sr_live, description: Active agent bearer for its project. Use revocableAgentBearer for self-disconnect retries after revocation. }
    nativePairingAuthorization:
      type: http
      scheme: ScreenRig-Pairing
      description: Native-only temporary pairing authorization. The credential is exactly srp_ plus 43 base64url characters and is never sent in a cookie, URL, or query.
    nativeSessionAuthorization:
      type: http
      scheme: ScreenRig-Session
      description: Native-only signed 24-hour runtime authorization. The credential is exactly srs_ plus an opaque signed base64url value.
    runtimeCookie: { type: apiKey, in: cookie, name: __Host-screenrig-runtime }
    pairedRuntimeCookie: { type: apiKey, in: cookie, name: __Host-screenrig-runtime, description: Signed runtime session with paired-device mutation profile. }
    pairedDeviceCookie: { type: apiKey, in: cookie, name: __Host-screenrig-device }
    pairingCookie: { type: apiKey, in: cookie, name: __Host-screenrig-pairing, description: "Signed 24-hour pairing session; never grants project, content, or runtime authority." }
    browserLinkCookie: { type: apiKey, in: cookie, name: __Host-screenrig-browser-link, description: "Apex host-only Secure HttpOnly SameSite=Strict Path=/ browser-link owner cookie; it authenticates a 24-hour unclaimed locator and, when claimed near the boundary, its fresh ten-minute protected delivery window. It has no Domain and is never accepted as a Player cookie." }
    primitiveCapability:
      type: apiKey
      in: header
      name: ScreenRig-Primitive-Capability
      description: >-
        Parent-only signed five-minute primitive capability bound to the runtime
        session, screen, application release, primitive, manifest revision,
        content-access generation, and allowed KV operations. Refresh by fetching
        the current manifest.
    dashboardSession:
      type: apiKey
      in: cookie
      name: __Host-screenrig-dashboard
      description: Person session cookie. HttpOnly, Secure, SameSite=Strict, Path=/. The current project can be absent; project-scoped operations then return no_project.
    releaseGrantCookie: { type: apiKey, in: cookie, name: __Host-screenrig-release, description: Exact-host release/screen/generation/grant cookie; never valid on runtime or project routes. }
    releaseLaunchTicket: { type: apiKey, in: query, name: ticket, description: Random single-use 30-second ticket consumed only on its exact release host. }
    operatorBearer: { type: http, scheme: bearer }
  responses:
    Problem:
      description: Stable RFC 9457 problem response. A 421 server_draining carries Retry-After of 1 second, a 500 not_ready or dependency_unavailable carries 5, and a 500 manifest_degraded carries 60, unless the handler set a more specific value.
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    RateLimitedProblem:
      description: Stable rate_limited problem. Retry only after the authoritative Retry-After interval. Fixed-window denials also include the applicable RateLimit-Policy and RateLimit members; concurrency and byte-budget denials omit those optional disclosures.
      headers:
        Retry-After: { required: true, schema: { type: integer, minimum: 1 } }
        RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }
        RateLimit: { $ref: "#/components/headers/RateLimit" }
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
  schemas:
    ProjectName:
      type: string
      minLength: 1
      maxLength: 60
      description: Trimmed printable project name. Rejects controls, URL-looking text, @, www., and ://.
    ProjectPatch:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          $ref: '#/components/schemas/ProjectName'
    DashboardProjectReference:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      properties:
        id:
          type: string
        name:
          $ref: '#/components/schemas/ProjectName'
    DashboardProjectListItem:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - last_used_at
      properties:
        id:
          type: string
        name:
          $ref: '#/components/schemas/ProjectName'
        last_used_at:
          type: string
          format: date-time
    DashboardProjectList:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DashboardProjectListItem'
    DashboardMember:
      type: object
      additionalProperties: false
      required:
      - user_id
      - display_name
      - joined_at
      - passkeys
      - password
      properties:
        user_id:
          type: string
        display_name:
          $ref: '#/components/schemas/DashboardDisplayName'
        joined_at:
          type: string
          format: date-time
        passkeys:
          type: integer
          minimum: 0
        password:
          type: boolean
    DashboardMemberList:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DashboardMember'
          maxItems: 200
    DashboardMe:
      type: object
      additionalProperties: false
      required:
      - user_id
      - display_name
      - email
      - password
      - passkeys
      - created_at
      properties:
        user_id:
          type: string
        display_name:
          $ref: '#/components/schemas/DashboardDisplayName'
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
        pending_email:
          $ref: '#/components/schemas/DashboardPendingEmail'
        password:
          type: boolean
        passkeys:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
    DashboardProjectSwitch:
      type: object
      additionalProperties: false
      required:
      - project_id
      properties:
        project_id:
          type: string
          minLength: 1
    DashboardProof:
      oneOf:
      - $ref: '#/components/schemas/DashboardPasskeyProof'
      - $ref: '#/components/schemas/DashboardPasswordProof'
    DashboardPasskeyProof:
      type: object
      additionalProperties: false
      required:
      - type
      - ceremony_id
      - credential
      properties:
        type:
          type: string
          enum:
          - passkey
        ceremony_id:
          type: string
          minLength: 1
        credential:
          type: object
          additionalProperties: true
          description: WebAuthn credential response.
    DashboardPasswordProof:
      type: object
      additionalProperties: false
      required:
      - type
      - password
      properties:
        type:
          type: string
          enum:
          - password
        password:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
    DashboardReauthenticationRequest:
      type: object
      additionalProperties: false
      required:
      - kind
      properties:
        kind:
          type: string
          enum:
          - agent_connection_approval
          - agent_connection_denial
          - agent_disconnect
          - email_change
          - password_set
          - passkey_add
          - passkey_delete
          - invitation_accept
        subject_id:
          type: string
          minLength: 1
    DashboardReauthentication:
      type: object
      additionalProperties: false
      required:
      - ceremony_id
      - options
      properties:
        ceremony_id:
          type: string
        options:
          type: object
          additionalProperties: true
          description: WebAuthn PublicKeyCredentialRequestOptions.
    DashboardProofRequest:
      type: object
      additionalProperties: false
      required:
      - proof
      properties:
        proof:
          $ref: '#/components/schemas/DashboardProof'
    DashboardPasskey:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - created_at
      - last_used_at
      properties:
        id:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 60
        created_at:
          type: string
          format: date-time
        last_used_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
    DashboardPasskeyList:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DashboardPasskey'
    DashboardPasskeyComplete:
      type: object
      additionalProperties: false
      required:
      - ceremony_id
      - credential
      properties:
        ceremony_id:
          type: string
          minLength: 1
        credential:
          type: object
          additionalProperties: true
          description: WebAuthn credential response.
        name:
          type: string
          minLength: 1
          maxLength: 60
          default: Passkey
    DashboardPasskeyPatch:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
    DashboardAgentAction:
      type: object
      additionalProperties: false
      required:
      - project_id
      - proof
      properties:
        project_id:
          type: string
          minLength: 1
        proof:
          $ref: '#/components/schemas/DashboardProof'
    InvitationKind:
      type: string
      enum:
      - project_member
      - ad_buyer
      - sign_in_reset
    InvitationStatus:
      type: string
      enum:
      - queued
      - sent
      - issued
      - accepted
      - revoked
      - expired
      - failed
    InvitationAdvertising:
      type: object
      additionalProperties: false
      required:
      - screen_ids
      - slot_ids
      - policy
      properties:
        screen_ids:
          type: array
          items:
            type: string
        slot_ids:
          type: array
          items:
            type: string
        policy:
          type: string
          enum:
          - trusted
          - review_required
      description: 'Seller-owned scope: at least one screen or slot. Screens only, slots only, or both are accepted.'
    InvitationCreate:
      type: object
      additionalProperties: false
      required:
      - kind
      properties:
        kind:
          type: string
          enum:
          - project_member
          - ad_buyer
        delivery:
          type: string
          enum:
          - email
          - link
          default: email
        emails:
          type: array
          items:
            type: string
            format: email
            minLength: 3
            maxLength: 254
          minItems: 1
          maxItems: 50
        advertising:
          $ref: '#/components/schemas/InvitationAdvertising'
      description: Email delivery requires emails. Link delivery is project_member only and omits emails and advertising. ad_buyer requires advertising. At most 50 outstanding
        member and buyer invitations per project; an outstanding email invitation of the same kind and address is reused.
      oneOf:
      - properties:
          kind:
            type: string
            enum:
            - project_member
          delivery:
            type: string
            enum:
            - email
        required:
        - emails
        not:
          required:
          - advertising
      - properties:
          kind:
            type: string
            enum:
            - project_member
          delivery:
            type: string
            enum:
            - link
        required:
        - delivery
        not:
          anyOf:
          - required:
            - emails
          - required:
            - advertising
      - properties:
          kind:
            type: string
            enum:
            - ad_buyer
          delivery:
            type: string
            enum:
            - email
        required:
        - emails
        - advertising
    Invitation:
      type: object
      additionalProperties: false
      required:
      - id
      - kind
      - delivery
      - status
      - project_id
      - created_at
      - expires_at
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
          - project_member
          - ad_buyer
        delivery:
          type: string
          enum:
          - email
          - link
        status:
          $ref: '#/components/schemas/InvitationStatus'
        recipient_email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
          description: Visible to the owning project, which supplied it.
        project_id:
          type: string
        advertising:
          $ref: '#/components/schemas/InvitationAdvertising'
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    InvitationIssued:
      type: object
      additionalProperties: false
      required:
      - id
      - kind
      - delivery
      - status
      - project_id
      - created_at
      - expires_at
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
          - project_member
          - ad_buyer
        delivery:
          type: string
          enum:
          - email
          - link
        status:
          $ref: '#/components/schemas/InvitationStatus'
        recipient_email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
          description: Visible to the owning project, which supplied it.
        project_id:
          type: string
        advertising:
          $ref: '#/components/schemas/InvitationAdvertising'
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        url:
          type: string
          format: uri
          description: Only for link delivery. Credential URL returned on creation and exact idempotent replay within 24 hours. Never log or store it.
    InvitationCreated:
      type: object
      additionalProperties: false
      required:
      - invitations
      properties:
        invitations:
          type: array
          items:
            $ref: '#/components/schemas/InvitationIssued'
          minItems: 1
          maxItems: 50
    InvitationList:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Invitation'
        next_cursor:
          type: string
    EnrollmentInvitation:
      type: object
      additionalProperties: false
      required:
      - id
      - status
      - expires_at
      properties:
        id:
          type: string
        status:
          $ref: '#/components/schemas/InvitationStatus'
        expires_at:
          type: string
          format: date-time
    SignInResetRequest:
      type: object
      additionalProperties: false
      required:
      - email
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
    SignInResetAccepted:
      type: object
      additionalProperties: false
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - accepted
      description: Identical for known and unknown addresses; no address, credential, project, or delivery status is returned.
    InvitationInspectRequest:
      type: object
      additionalProperties: false
      required:
      - token
      properties:
        token:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          writeOnly: true
    InvitationInspect:
      type: object
      additionalProperties: false
      required:
      - id
      - kind
      - delivery
      - project
      - expires_at
      - person
      - modes
      - methods
      properties:
        id:
          type: string
          description: Invitation id. It is the subject_id of an invitation_accept step-up proof and grants nothing without the token.
        kind:
          $ref: '#/components/schemas/InvitationKind'
        delivery:
          type: string
          enum:
          - email
          - link
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
        project:
          oneOf:
          - type: object
            additionalProperties: false
            required: [name]
            properties:
              name: { $ref: '#/components/schemas/ProjectName' }
          - type: 'null'
          description: Null for sign-in reset; other invitation kinds identify their target project.
        network:
          type: object
          additionalProperties: false
          required:
          - name
          - screens
          - slots
          properties:
            name:
              type: string
            screens:
              type: integer
              minimum: 0
            slots:
              type: integer
              minimum: 0
        expires_at:
          type: string
          format: date-time
        person:
          oneOf:
          - type: string
            enum:
            - new
            - existing
          - type: 'null'
        modes:
          type: array
          items:
            type: string
            enum:
            - create_login
            - signed_in
            - reset
          minItems: 1
          maxItems: 2
        methods:
          type: object
          additionalProperties: false
          required:
          - passkey
          - password
          properties:
            passkey:
              type: boolean
            password:
              type: boolean
      description: Non-consuming inspection. person is null for links. Never reports signup verification state. Email modes are create_login or signed_in; links offer
        both, and resets offer reset.
      allOf:
      - if: { properties: { kind: { const: sign_in_reset } }, required: [kind] }
        then: { properties: { project: { type: 'null' } } }
        else: { properties: { project: { type: object } } }
    InvitationPasskeyOptionsRequest:
      type: object
      additionalProperties: false
      required:
      - token
      - mode
      properties:
        token:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          writeOnly: true
        mode:
          type: string
          enum:
          - create_login
          - reset
        display_name:
          $ref: '#/components/schemas/DashboardDisplayName'
    InvitationEmailVerificationRequest:
      type: object
      additionalProperties: false
      required:
      - token
      - display_name
      - email
      properties:
        token:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          writeOnly: true
        display_name:
          $ref: '#/components/schemas/DashboardDisplayName'
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
    InvitationEmailVerificationAccepted:
      type: object
      additionalProperties: false
      required:
      - status
      - expires_at
      properties:
        status:
          type: string
          enum:
          - sent
        expires_at:
          type: string
          format: date-time
    InvitationSignup:
      type: object
      additionalProperties: false
      required:
      - email
      - display_name
      - verified
      - expires_at
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
        display_name:
          $ref: '#/components/schemas/DashboardDisplayName'
        verified:
          type: boolean
        expires_at:
          type: string
          format: date-time
    InvitationCredential:
      oneOf:
      - $ref: '#/components/schemas/DashboardPasskeyProof'
      - $ref: '#/components/schemas/InvitationPasswordCredential'
    InvitationPasswordCredential:
      type: object
      additionalProperties: false
      required:
      - type
      - password
      properties:
        type:
          type: string
          enum:
          - password
        password:
          type: string
          minLength: 12
          maxLength: 128
          pattern: ^\S+$
          writeOnly: true
          x-maxBytes: 128
          description: 12–128 UTF-8 bytes, without whitespace. Cannot equal the email or display name or a bundled common password. Stored only as an Argon2id hash.
    InvitationBuyer:
      oneOf:
      - type: object
        additionalProperties: false
        required:
        - project_id
        properties:
          project_id:
            type: string
            minLength: 1
      - type: object
        additionalProperties: false
        required:
        - new_project_name
        properties:
          new_project_name:
            $ref: '#/components/schemas/ProjectName'
    InvitationAcceptRequest:
      type: object
      additionalProperties: false
      required:
      - token
      - mode
      properties:
        token:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          writeOnly: true
        mode:
          type: string
          enum:
          - create_login
          - signed_in
          - reset
        display_name:
          $ref: '#/components/schemas/DashboardDisplayName'
        credential:
          $ref: '#/components/schemas/InvitationCredential'
        proof:
          $ref: '#/components/schemas/DashboardProof'
        buyer:
          $ref: '#/components/schemas/InvitationBuyer'
      description: New credentials are required for create_login and reset. Link create_login requires the verified signup cookie and uses its display name and email.
        Email create_login requires display_name. signed_in needs sign-in within ten minutes or an invitation_accept proof bound to the invitation id. buyer applies only
        to ad_buyer; new buyer projects start at zero credit.
      oneOf:
      - properties:
          mode:
            type: string
            enum:
            - create_login
            - reset
        required:
        - credential
        not:
          required:
          - proof
      - properties:
          mode:
            type: string
            enum:
            - signed_in
        not:
          required:
          - credential
    InvitationAccepted:
      type: object
      additionalProperties: false
      required:
      - kind
      - project_id
      - next
      properties:
        kind:
          $ref: '#/components/schemas/InvitationKind'
        project_id:
          oneOf: [{ type: string, minLength: 1 }, { type: 'null' }]
          description: Current project after acceptance. Null only when a sign-in reset leaves the person without any project memberships.
        next:
          type: string
          enum:
          - project
          - network
      allOf:
      - if: { properties: { kind: { enum: [project_member, ad_buyer] } }, required: [kind] }
        then: { properties: { project_id: { type: string, minLength: 1 } } }
    HealthResponse: { type: object, additionalProperties: false, required: [status], properties: { status: { type: string, enum: [alive] } } }
    ReadyResponse:
      type: object
      additionalProperties: false
      required: [status, degraded]
      properties:
        status: { type: string, enum: [ready] }
        degraded: { type: array, items: { type: string }, description: Names of optional dependencies currently unhealthy. The service still serves existing content. }
        degraded_detail:
          type: object
          additionalProperties: { type: string }
          description: >-
            Plain-language consequence of each degraded dependency, keyed by its
            name, for a client to show verbatim. For example application_processing
            states that application upload is unavailable and that
            POST /api/v1/applications answers 500 dependency_unavailable until the
            workers run. Never carries hosts, addresses, or probe error text.
    VersionResponse: { type: object, additionalProperties: false, required: [version, commit, api_version, protocol_version], properties: { version: { type: string }, commit: { type: string }, api_version: { type: string }, protocol_version: { type: string } } }
    Capabilities:
      type: object
      additionalProperties: false
      required: [api_version, protocol_version, application_compressed_bytes, application_expanded_bytes, application_package_bytes, application_file_count, application_file_bytes, application_path_depth, application_path_bytes, media_image_bytes, playlist_max_pages, playlist_max_items_per_page, playlist_max_media_per_selector, transition_max_duration_ms, screens_per_project, project_content_bytes, features]
      properties:
        api_version: { type: string }
        protocol_version: { type: string }
        application_compressed_bytes: { type: integer, enum: [104857600] }
        application_expanded_bytes: { type: integer, enum: [262144000] }
        application_package_bytes: { type: integer, enum: [272629760], description: Maximum normalized immutable webapp package size available to paired native players. }
        application_file_count: { type: integer, enum: [5000] }
        application_file_bytes: { type: integer, enum: [33554432] }
        application_path_depth: { type: integer, enum: [16] }
        application_path_bytes: { type: integer, enum: [255] }
        media_image_bytes: { type: integer, enum: [20971520], description: "Maximum declared byte size of one image upload, 20 MiB. It is a byte-only gate rejected with invalid_request before any byte is transferred; the server never decodes the image, and the bound applies to animated GIF and animated WebP exactly as it applies to a still. Pixel dimensions are not validated. A video declaration is bounded only by the plan-independent transport ceiling." }
        playlist_max_pages: { type: integer, enum: [100] }
        playlist_max_items_per_page: { type: integer, enum: [24] }
        playlist_max_media_per_selector: { type: integer, enum: [32], description: Maximum ready media objects one image or video selector may resolve to. }
        transition_max_duration_ms: { type: integer, enum: [60000] }
        screens_per_project: { type: integer, enum: [100], description: "Screen limit of the default plan. Unarchived pairing_pending and active screens count. Archived screens do not. Zero on a project means no screen cap." }
        project_content_bytes: { type: integer, enum: [0], description: "Storage limit of the default plan. Zero means no product storage cap. A custom storage ceiling, when present, still counts committed media, expanded application release trees, and application key/value entries together, including bytes reserved by an upload in flight. The per-request ceilings above are plan-independent transport bounds." }
        features: { type: object, additionalProperties: { type: boolean } }
    CLIEnrollmentRequest:
      type: object
      additionalProperties: false
      required:
      - client_id
      - email
      properties:
        intent:
          type: string
          enum:
          - signage
          - advertising
          description: Optional enrollment purpose. Omit or signage keeps screens=true, advertiser=false. advertising sets advertiser=true, screens=false, and never changes
            the billing-plan assignment.
        client_id:
          type: string
          pattern: ^cli_[A-Za-z0-9_-]{43}$
          description: Stable anonymous installation identity generated from 32 CSPRNG bytes and persisted before the first request. It is rate-limit material, not a
            project credential.
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
          description: Unverified project contact address. Enrollment always creates a new project and queues its invitation; an address alone grants no authority.
        beta_key:
          type: string
          description: Required when the server has a configured enrollment beta key. Omit when the server does not gate enrollment.
        name:
          type: string
          minLength: 1
          maxLength: 80
          default: ScreenRig CLI
        agent_type:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,31}$
          default: cli
        platform:
          type: string
          maxLength: 80
        version:
          type: string
          maxLength: 40
        project_name:
          $ref: '#/components/schemas/ProjectName'

    Project:
      type: object
      additionalProperties: false
      required:
      - id
      - revision
      - status
      - email
      - email_verified
      - used_bytes
      - reserved_bytes
      - screen_count
      - content_limit_bytes
      - screen_limit
      - credit_remaining
      - created_at
      - updated_at
      - name
      properties:
        id:
          type: string
        features:
          $ref: '#/components/schemas/ProjectFeatures'
        feature_revision:
          type: integer
        revision:
          type: integer
        status:
          type: string
          enum:
          - active
          - cancelled
          - deleted
        email:
          type: string
          minLength: 3
          maxLength: 254
          description: 'Required contact address supplied at enrollment, preserving its capitalization after surrounding whitespace is trimmed. Read-only: no route updates
            it, and it is published only on an authenticated read of the caller''s own project.'
        email_verified:
          type: boolean
          enum:
          - false
          description: Always false. The address is stored unverified; enrollment queues one invitation delivery to it, but no route treats a delivery as proof of possession
            and no flow sets this true. It is published so a later recovery feature cannot mistake an unverified string for authority. It is not an authorization factor.
        used_bytes:
          type: integer
          description: Durable bytes the project owns across media, expanded application release trees, and application key/value entries.
        reserved_bytes:
          type: integer
          description: Bytes held by uploads in flight. They count against a custom storage ceiling until the upload commits or its reservation is released.
        screen_count:
          type: integer
        content_limit_bytes:
          type: integer
          description: Storage ceiling the project's plan allows. Zero means no product storage cap.
        screen_limit:
          type: integer
          description: Screen limit the project's plan allows. Zero means no screen cap.
        credit_remaining:
          type: integer
          minimum: 0
          description: Remaining prepaid credits as a whole integer. Never negative. Standard includes no monthly credit grant. Every project waives the first 10 GB of
            bandwidth, 1 GB-month of storage, and 10,000 API or billed listen-stream taxes each UTC month.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        name:
          $ref: '#/components/schemas/ProjectName'

    RuntimeChrome:
      type: object
      additionalProperties: true
      required: [schema_version, banner]
      description: Runtime-owned chrome (docs/player-compatibility.md §8). Readers read the members they know and ignore the rest; a banner shape a reader does not understand shows no banner.
      properties:
        schema_version: { type: integer, minimum: 1 }
        banner: { oneOf: [{ type: "null" }, { type: object, additionalProperties: true }] }
    RuntimeScreenLabelWrite:
      type: object
      additionalProperties: true
      required: [screen_label]
      description: >-
        The PUT /runtime/v1/screen-label body. The server trims screen_label
        and stores 1 to 120 UTF-8 bytes without control characters. Unknown
        members are ignored (docs/player-compatibility.md §1.1).
      properties:
        screen_label: { type: string, minLength: 1 }
    RuntimeScreenLabel:
      type: object
      additionalProperties: true
      required: [screen_label]
      description: The stored screen name, the value the manifest carries as screen_label.
      properties:
        screen_label: { type: string, minLength: 1, maxLength: 120 }
    CLIEnrollment:
      type: object
      additionalProperties: false
      required:
      - project
      - agent
      - connection_ready
      - token
      - issuance_id
      - issuance_expires_at
      - invitation
      properties:
        project:
          $ref: '#/components/schemas/Project'
        agent:
          $ref: '#/components/schemas/Agent'
        connection_ready:
          type: boolean
          enum:
          - false
          description: A newly enrolled project has neither a registered dashboard passkey nor password, so approval of another agent is not ready. Re-read GET /api/v1/agents/self
            after configuring either retained dashboard credential.
        token:
          type: string
          minLength: 32
          description: Permanent bearer credential for exactly this first agent. It has no scheduled expiry and is redelivered only through this short-lived encrypted
            issuance envelope.
        issuance_id:
          type: string
          description: Opaque identifier for the encrypted exact-retry delivery envelope.
        issuance_expires_at:
          type: string
          format: date-time
          description: Exact-retry redelivery deadline for this credential issuance; ten minutes after first enrollment. Later exact retries return credential_issuance_expired
            while the permanent token remains valid.
        invitation:
          $ref: '#/components/schemas/EnrollmentInvitation'

    AgentInput: { type: object, additionalProperties: false, properties: { name: { type: string, minLength: 1, maxLength: 80, default: "ScreenRig CLI" }, agent_type: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,31}$", default: cli }, platform: { type: string, maxLength: 80 }, version: { type: string, maxLength: 40 } } }
    Agent:
      type: object
      additionalProperties: false
      required: [id, name, agent_type, state, authenticated_requests, metered_credits, created_at]
      properties:
        id: { type: string, pattern: "^(?:(?:stage|qa|development)_)?agt_" }
        name: { type: string, minLength: 1, maxLength: 80 }
        agent_type: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,31}$" }
        platform: { type: string, maxLength: 80 }
        version: { type: string, maxLength: 40 }
        state: { type: string, enum: [pending, active, revoked, cancelled, expired] }
        public_key_kid: { type: string, description: RFC 7638-style thumbprint of the X25519 recipient public JWK. Public key bytes are not returned. }
        authenticated_requests: { type: integer, minimum: 0, description: "Best-effort diagnostic count of successful bearer verifications directly attributable to this agent installation. Authentication success is not coupled to this counter write, so a temporarily unavailable metadata update is intentionally omitted rather than failing the authenticated request." }
        metered_credits: { type: integer, minimum: 0, description: Whole credits directly attributable to requests carrying this agent principal. }
        created_at: { type: string, format: date-time }
        connected_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time }
    AgentList: { type: object, additionalProperties: false, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Agent" } } } }
    AgentSelfStatus: { type: object, additionalProperties: false, required: [agent, connection_ready], properties: { agent: { $ref: "#/components/schemas/Agent" }, connection_ready: { type: boolean, description: True when at least one project member has a passkey or password and can authorize another agent. } } }
    X25519PublicJWK: { type: object, additionalProperties: false, required: [kty, crv, x], properties: { kty: { type: string, enum: [OKP] }, crv: { type: string, enum: [X25519] }, x: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" } } }
    AgentConnectionRequest: { type: object, additionalProperties: false, required: [recipient_public_key], properties: { name: { type: string, minLength: 1, maxLength: 80 }, agent_type: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,31}$" }, platform: { type: string, maxLength: 80 }, version: { type: string, maxLength: 40 }, recipient_public_key: { $ref: "#/components/schemas/X25519PublicJWK" } } }
    AgentConnectionStart: { type: object, additionalProperties: false, required: [connection_id, connection_token, approval_url, expires_at], properties: { connection_id: { type: string, pattern: "^(?:(?:stage|qa|development)_)?acn_" }, connection_token: { type: string, pattern: "^sac_[A-Za-z0-9_-]{43}$", description: Temporary header credential. Never place in a URL or log. }, approval_url: { type: string, format: uri, description: Safe URL containing only the non-authority connection id. }, expires_at: { type: string, format: date-time } } }
    AgentConnection: { type: object, additionalProperties: false, required: [connection_id, name, agent_type, status, expires_at, created_at], properties: { connection_id: { type: string, pattern: "^(?:(?:stage|qa|development)_)?acn_" }, name: { type: string }, agent_type: { type: string }, platform: { type: string }, version: { type: string }, status: { type: string, enum: [pending, approved, connected, denied, expired, cancelled] }, expires_at: { type: string, format: date-time }, created_at: { type: string, format: date-time } } }
    AgentCredentialEnvelope: { type: object, additionalProperties: false, required: [algorithm, ephemeral_public_key, nonce, ciphertext], properties: { algorithm: { type: string, enum: [X25519-HKDF-SHA256-A256GCM] }, ephemeral_public_key: { $ref: "#/components/schemas/X25519PublicJWK" }, nonce: { type: string, description: Unpadded base64url AES-GCM nonce. }, ciphertext: { type: string, description: Unpadded base64url ciphertext and authentication tag. Decrypt with AAD screenrig/agent-credential-envelope/aad/v1 NUL connection_id NUL agent_id. } } }
    AgentCredentialCollection: { type: object, additionalProperties: false, required: [agent, credential_envelope, issuance_expires_at], properties: { agent: { $ref: "#/components/schemas/Agent" }, credential_envelope: { $ref: "#/components/schemas/AgentCredentialEnvelope" }, issuance_expires_at: { type: string, format: date-time } } }
    AgentDisconnectRequest: { type: object, additionalProperties: false, properties: { allow_last_agent: { type: boolean, default: false, description: Explicitly accept loss of the last active agent bearer. A registered dashboard passkey remains independent administrative authority. } } }
    Application: { type: object, additionalProperties: false, required: [id, name, revision, created_at, updated_at], properties: { id: { type: string }, name: { type: string }, revision: { type: integer }, latest_ready_release: { type: string, description: "Release identifier of the newest ready release. Absent until a first publish reaches the ready state. An application has no state of its own; publish state lives on the operation and the release." }, created_at: { type: string, format: date-time }, updated_at: { type: string, format: date-time } } }
    ApplicationList: { type: object, additionalProperties: false, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Application" } } } }
    OperationAccepted: { type: object, additionalProperties: false, required: [id, release_id, operation_id], properties: { id: { type: string, description: Application identifier the upload was attributed to. }, release_id: { type: string, description: "Release identifier created by this upload. Poll the operation and pin this release into a playlist once the operation succeeds." }, operation_id: { type: string } } }
    Operation: { type: object, additionalProperties: true, required: [id, kind, state, created_at, updated_at], properties: { id: { type: string }, kind: { type: string }, state: { type: string, enum: [receiving, queued, running, succeeded, failed, cancelled], description: "Receiving means the bounded upload body is still being durably staged. Terminal values are succeeded, failed, and cancelled." }, request_id: { type: string }, created_at: { type: string }, updated_at: { type: string }, result: { type: object, additionalProperties: true }, error: { type: object, additionalProperties: true } } }
    PlaylistWrite:
      type: object
      additionalProperties: false
      required: [name, pages]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        pages: { type: array, minItems: 1, maxItems: 100, items: { $ref: "#/components/schemas/PlaylistPageWrite" } }
