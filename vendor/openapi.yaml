    FeedbackList: { type: object, additionalProperties: false, required: [items], properties: { items: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/FeedbackSubmission" } } } }
    PairingSession: { type: object, additionalProperties: true, required: [code, expires_at], properties: { code: { type: string, pattern: "^[23456789ABCDEFGHJKMNPQRSTUVWXYZ]{6}$" }, expires_at: { type: string, format: date-time } } }
    NativePairingSession: { type: object, additionalProperties: true, required: [code, pairing_credential, expires_at], properties: { code: { type: string, pattern: "^[23456789ABCDEFGHJKMNPQRSTUVWXYZ]{6}$" }, pairing_credential: { type: string, pattern: "^srp_[A-Za-z0-9_-]{43}$" }, expires_at: { type: string, format: date-time, description: Unclaimed native pairing deadline; seventy-two hours after issuance. After claim this deadline does not expire native delivery or device identity. }, recovery: { $ref: "#/components/schemas/NativePairingRecovery" } } }
    NativePairingRecovery:
      type: object
      additionalProperties: false
      required: [offered]
      description: >-
        Present only when the host duid or serial in the start request matched
        exactly one existing screen bound to a different key. It carries no
        screen, label, or project: the offer is surfaced project-side as
        Screen.recovery_pending and the screen.recovery_offered event, and only
        the owning project can confirm it. It is absent, exactly as without a
        match, when the identifier is ambiguous, when the matched screen's key
        showed life within the last ten minutes, or when that screen already
        took three offers in the rolling hour. The pairing code still issues
        and displays exactly as without a match. The player uses this solely to
        log pairing.recovery_offered.
      properties:
        offered: { type: boolean, enum: [true] }
    PairingClaimedEvent: { type: object, additionalProperties: false, required: [type, completion_nonce], properties: { type: { type: string, enum: [pairing.claimed] }, completion_nonce: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" } } }
    PairingClaim: { type: object, additionalProperties: false, required: [screen, public_url], properties: { screen: { $ref: "#/components/schemas/Screen" }, public_url: { type: string, format: uri } } }
    PairingComplete: { type: object, additionalProperties: true, required: [completion_nonce], properties: { completion_nonce: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" } } }
    PairingCompletion: { type: object, additionalProperties: true, required: [screen, public_url], properties: { screen: { $ref: "#/components/schemas/RuntimePairingScreen" }, public_url: { type: string, format: uri } } }
    PlayerPublicKey:
