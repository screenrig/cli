        not_found.
      properties:
        playlist_id: { type: string, minLength: 1 }
        playlist_revision: { type: integer, minimum: 1, description: "Optional expected playlist revision. A different stored revision is revision_conflict and no forecast is returned." }
    ScreenStorageForecastDryRun:
      type: object
      additionalProperties: false
      required: [fit, excluded_page_count, required_bytes, capacity_bytes, basis, received_at]
      description: >-
        Pre-assignment fit dry run for one playlist. fit,
        excluded_page_count, and required_bytes come from plan A.3 target
        selection against the screen's last reported capacity (basis
        reported_capacity); there is no transition prediction and nothing is
        treated as local. required_bytes is the retained cost of every page
        of the playlist. fit unknown means the screen has no storage report,
        or the playlist's content references are not ready; required_bytes,
        capacity_bytes, and received_at are null then. received_at is the
        storage report's receipt time, and a report older than 24 hours is
        stale but still forecast from, exactly like Screen.storage_forecast.
        It is read-only metadata and never authorization or admission.
      properties:
        fit: { type: string, enum: [fits, partial, none_fit, unknown] }
        excluded_page_count: { type: integer, minimum: 0, maximum: 100 }
        required_bytes: { anyOf: [{ type: integer, minimum: 0, maximum: 9007199254740991 }, { type: "null" }] }
        capacity_bytes: { anyOf: [{ type: integer, minimum: 0, maximum: 9007199254740991 }, { type: "null" }] }
        basis: { type: string, enum: [reported_capacity] }
        received_at: { anyOf: [{ type: string, format: date-time }, { type: "null" }] }
