    post:
      operationId: confirmScreenRecovery
      description: >-
        Confirms a pending screen recovery. A native pairing start that presented
        a host duid or serial matching exactly one screen in exactly one project,
        under a different bound public key, records an offer on that screen
        (Screen.recovery_pending, project event screen.recovery_offered). The
        host object is a hint, never a credential: nothing is rebound until the
        owning project calls this route. A DUID is readable by any application
        on the panel, so an offer is a phishing surface. It is mitigated by
        liveness (no offer while the bound key showed life in the last ten
        minutes), a limit of three offers per screen per rolling hour, and this
        same-project confirmation; recovery_pending.host and the event carry
        the offering device's platform, model, firmware, and manufacturer so
        the operator can compare them with the display in front of them before
        confirming. Confirmation completes the pending
        native pairing onto the EXISTING screen: the pairing device receives
        pairing.claimed as usual and proves possession with pairing.complete,
        the new key becomes the screen identity, and the previous key retires
        with a fifteen-minute grace window in which its runtime sessions keep
        working and it may still mint, after which it is refused. Playlists,
        label, timezone, schedules, and history are preserved. Same project
        only; another project's screen is not_found. If-Match is optional.
