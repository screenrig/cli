        primitive: { type: string, enum: [image, video], description: "Server-resolved primitive of the media at the last upsert. Never client-supplied. Absent only on rows last aggregated before media-neutral starts shipped." }
        day: { type: string, format: date, description: UTC calendar day of the aggregate. }
        play_count: { type: integer, minimum: 1, description: "Starts counted for this screen, media, and UTC day. A start is one visible start of that media." }
        last_page_id: { type: string }
        last_manifest_revision: { type: string }
        first_started_at: { type: string, format: date-time }
        last_started_at: { type: string, format: date-time }
