        unpaired sessions are forbidden. Prepaid remaining credit is not a gate.
      security: [{ pairedRuntimeCookie: [] }, { nativeSessionAuthorization: [] }]
      responses:
        "204": { description: Cookie-paired screen tombstoned. Browser pairing cookies expired., headers: { Cache-Control: { schema: { type: string, enum: [no-store] } } } }
