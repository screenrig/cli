      parameters:
        - { $ref: "#/components/parameters/PlaybackScreenID" }
        - { $ref: "#/components/parameters/PlaybackMediaID" }
        - { $ref: "#/components/parameters/PlaybackDay" }
      responses:
        "200": { description: "Daily playback aggregates for the calling account. One row per screen, media, and UTC day. Newest days first. Identifiers filter the caller's own rows and are never a cross-account lookup.", content: { application/json: { schema: { $ref: "#/components/schemas/PlaybackAggregateList" } } } }
