  /api/v1/feedback/bugs:
    get:
      operationId: listBugReports
      description: >-
        Returns the calling account's own bug reports, newest first, up to one
        hundred. Another account's submissions are never returned and are not
        addressable by identifier. There is no pagination cursor in v1.
      security: [{ accountBearer: [] }]
      responses:
        "200": { description: Bug reports owned by the calling account., content: { application/json: { schema: { $ref: "#/components/schemas/FeedbackList" } } } }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: reportBug
      description: >-
        Records one immutable bug report against the calling account. A submission
        cannot be updated or deleted; a correction is a new submission. An exact
        retry carrying the same Idempotency-Key returns the original submission for
        twenty-four hours instead of creating a duplicate, and a different body under
        that key returns idempotency_mismatch. Never place credentials, cookies,
        Authorization headers, completion nonces, signed URLs, or object keys in
        title, body, or context; recognizable ScreenRig credential material is
        rejected with invalid_request and is not stored.
      security: [{ accountBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/FeedbackWrite" } } } }
      responses:
        "201": { description: "Stored bug report. An exact idempotent retry returns this same submission.", content: { application/json: { schema: { $ref: "#/components/schemas/FeedbackSubmission" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimitedProblem" }
        default: { $ref: "#/components/responses/Problem" }
