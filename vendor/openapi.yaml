      additionalProperties: false
      required: [type, text, font_family, font_weight, italic, font_size, line_height, color, align, vertical_align]
      description: >-
        One text item styled as a whole, with no per-run spans. Lines are separated
        only by a literal line feed; there is no automatic wrapping, because line
        breaking diverges between Blink, the Qt scene graph, and Android Minikin.
        Text that exceeds its placement clips.
      properties:
        type: { type: string, enum: [text] }
        text: { type: string, minLength: 1, maxLength: 4000, description: "Line feed separates lines. Every other control character is rejected." }
        font_family: { type: string, enum: [sans, serif, mono], description: "Closed set of bundled families. An unknown family is rejected; no renderer substitutes a system face." }
        font_weight: { type: integer, enum: [400, 700], description: "Only real bundled faces exist. Synthesis is forbidden, so no other weight is available." }
        italic: { type: boolean, default: false, description: Selects the true italic face; never an oblique slant. }
        font_size: { $ref: "#/components/schemas/PositiveCanvasLength" }
        line_height: { $ref: "#/components/schemas/PositiveCanvasLength" }
        color: { $ref: "#/components/schemas/CanvasColor" }
        align: { type: string, enum: [left, center, right] }
        vertical_align: { type: string, enum: [top, middle, bottom] }
