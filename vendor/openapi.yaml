            Referrer-Policy: { schema: { type: string, enum: [no-referrer] } }
            Cross-Origin-Resource-Policy: { schema: { type: string, enum: [same-origin] } }
            X-Content-Type-Options: { schema: { type: string, enum: [nosniff] } }
            Vary: { schema: { type: string, enum: ["Cookie, Authorization"] } }
        "206":
          description: One standards-correct byte range from the same immutable package.
          headers:
            Accept-Ranges: { schema: { type: string, enum: [bytes] } }
            Content-Range: { schema: { type: string } }
            Content-Length: { schema: { type: integer } }
            Content-Type: { schema: { type: string, enum: [application/vnd.screenrig.webapp-package+tar+gzip] } }
            Content-Disposition: { schema: { type: string } }
            Cache-Control: { schema: { type: string, enum: ["private, max-age=31536000, immutable"] } }
            ETag: { schema: { type: string } }
            Referrer-Policy: { schema: { type: string, enum: [no-referrer] } }
            Cross-Origin-Resource-Policy: { schema: { type: string, enum: [same-origin] } }
            X-Content-Type-Options: { schema: { type: string, enum: [nosniff] } }
            Vary: { schema: { type: string, enum: ["Cookie, Authorization"] } }
        "416": { description: "Unsatisfiable, multiple, or malformed range.", headers: { Content-Range: { schema: { type: string } }, Accept-Ranges: { schema: { type: string, enum: [bytes] } } }, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "429": { $ref: "#/components/responses/RateLimitedProblem" }
        default: { $ref: "#/components/responses/Problem" }
    head:
      operationId: headNativeWebappPackage
      description: Returns the same authorization and immutable identity headers as GET without package bytes.
      security: [{ pairedDeviceCookie: [] }, { nativeSessionAuthorization: [] }]
      responses:
        "200":
          description: Authorized normalized package metadata.
          headers:
            Accept-Ranges: { schema: { type: string, enum: [bytes] } }
            Content-Length: { schema: { type: integer } }
            Content-Type: { schema: { type: string, enum: [application/vnd.screenrig.webapp-package+tar+gzip] } }
            Content-Disposition: { schema: { type: string } }
            Cache-Control: { schema: { type: string, enum: ["private, max-age=31536000, immutable"] } }
            ETag: { schema: { type: string } }
            Referrer-Policy: { schema: { type: string, enum: [no-referrer] } }
            Cross-Origin-Resource-Policy: { schema: { type: string, enum: [same-origin] } }
            X-Content-Type-Options: { schema: { type: string, enum: [nosniff] } }
            Vary: { schema: { type: string, enum: ["Cookie, Authorization"] } }
        "206":
          description: Authorized metadata for one byte range.
          headers:
            Accept-Ranges: { schema: { type: string, enum: [bytes] } }
            Content-Range: { schema: { type: string } }
            Content-Length: { schema: { type: integer } }
            Content-Type: { schema: { type: string, enum: [application/vnd.screenrig.webapp-package+tar+gzip] } }
            Content-Disposition: { schema: { type: string } }
            Cache-Control: { schema: { type: string, enum: ["private, max-age=31536000, immutable"] } }
            ETag: { schema: { type: string } }
            Referrer-Policy: { schema: { type: string, enum: [no-referrer] } }
            Cross-Origin-Resource-Policy: { schema: { type: string, enum: [same-origin] } }
            X-Content-Type-Options: { schema: { type: string, enum: [nosniff] } }
            Vary: { schema: { type: string, enum: ["Cookie, Authorization"] } }
        "416": { description: "Unsatisfiable, multiple, or malformed range.", headers: { Content-Range: { schema: { type: string } }, Accept-Ranges: { schema: { type: string, enum: [bytes] } } } }
        "429": { $ref: "#/components/responses/RateLimitedProblem" }
        default: { $ref: "#/components/responses/Problem" }
  /{asset_path}:
    servers:
      - url: https://r-{release_host_label}.apps.screenrig.ai
        variables:
          release_host_label: { default: 0123456789abcdef0123456789abcdef01234567, description: Domain-separated 160-bit lowercase hexadecimal digest label derived deterministically from the immutable prefixed release ID. }
    get:
      operationId: consumeLaunchTicketOrGetReleaseAsset
      description: >-
        Exact-release-host operation. With a ticket query, atomically consumes the single-use 30-second ticket,
        binds Host/release/screen/content-generation/manifest/grant, sets only the exact-host release-grant cookie,
        and redirects to the same path without the ticket. Without a ticket, validates that cookie on every GET/HEAD.
        The asset_path parameter is greedy (x-screenrig-greedy-path) and is resolved only beneath the ready release root.
        Runtime/account/device cookies and account bearer tokens never authorize this operation.
      x-screenrig-greedy-path: true
      security:
        - releaseLaunchTicket: []
        - releaseGrantCookie: []
      parameters:
        - { name: asset_path, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/SecFetchSite" }
        - { $ref: "#/components/parameters/SecFetchMode" }
        - { $ref: "#/components/parameters/SecFetchDest" }
      responses:
        "200": { description: Exact-host grant-authorized immutable asset., headers: { Referrer-Policy: { schema: { type: string, enum: [no-referrer] } }, X-Content-Type-Options: { schema: { type: string, enum: [nosniff] } }, ETag: { schema: { type: string } } } }
        "302": { description: Ticket consumed once; release-grant cookie issued; ticket removed from Location., headers: { Location: { schema: { type: string } }, Set-Cookie: { schema: { type: string } }, Cache-Control: { schema: { type: string, enum: [no-store] } }, Referrer-Policy: { schema: { type: string, enum: [no-referrer] } } } }
        "403": { description: "Wrong Host/release/screen/generation/grant, stale/replayed ticket, invalid cookie, contradictory Fetch Metadata, or disallowed method.", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "404": { description: Asset absent without exposing release filesystem shape., content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /runtime/v1/apps/{application_id}/kv:
    servers: [{ url: https://play.screenrig.ai, description: Trusted player/runtime origin }]
    get:
      operationId: listRuntimeKV
      description: >-
        Lists metadata for the application placement named by the current manifest. Requires the HttpOnly runtime
        session and the parent-only ScreenRig-Placement-Capability handle issued on the application placement.
        Handles expire after five minutes and are refreshed by fetching the current runtime manifest; uploaded frames
        never receive the handle and must use the validated parent SDK bridge.
      security: [{ runtimeCookie: [], placementCapability: [] }, { nativeSessionAuthorization: [], placementCapability: [] }]
      parameters: [{ $ref: "#/components/parameters/ApplicationID" }]
      responses:
        "200": { description: Manifest-authorized application KV, content: { application/json: { schema: { $ref: "#/components/schemas/KVList" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /runtime/v1/apps/{application_id}/kv/{key}:
    servers: [{ url: https://play.screenrig.ai, description: Trusted player/runtime origin }]
    parameters: [{ $ref: "#/components/parameters/ApplicationID" }, { name: key, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getRuntimeKV
      security: [{ runtimeCookie: [], placementCapability: [] }, { nativeSessionAuthorization: [], placementCapability: [] }]
      responses:
        "200": { description: Manifest-authorized application KV value, content: { application/json: { schema: { $ref: "#/components/schemas/KVEntry" } } } }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: putRuntimeKV
      security: [{ pairedRuntimeCookie: [], placementCapability: [] }, { nativeSessionAuthorization: [], placementCapability: [] }]
      parameters: [{ $ref: "#/components/parameters/OptionalIfMatch" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/KVWrite" } } } }
      responses:
        "200": { description: Paired-device KV mutation, content: { application/json: { schema: { $ref: "#/components/schemas/KVEntry" } } } }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteRuntimeKV
      security: [{ pairedRuntimeCookie: [], placementCapability: [] }, { nativeSessionAuthorization: [], placementCapability: [] }]
      parameters: [{ $ref: "#/components/parameters/IfMatch" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "204": { description: Paired-device KV deletion }
        default: { $ref: "#/components/responses/Problem" }
components:
  headers:
    ScreenRigCreditsRemaining:
      description: Remaining prepaid credits as a whole integer. Same value as credit_remaining. Never negative.
      schema: { type: integer, minimum: 0 }
    ScreenRigCreditsReset:
      description: RFC 3339 UTC instant of the first moment of the next UTC calendar month, when the next included grant is added. Remaining is not replaced.
      schema: { type: string, format: date-time }
    ScreenRigCreditsIncluded:
      description: Whole credits granted by the plan each UTC month.
      schema: { type: integer, minimum: 0 }
  parameters:
    ResourceID: { name: id, in: path, required: true, schema: { type: string } }
    PlaylistPageID: { name: page_id, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z][A-Za-z0-9_-]{0,63}$" }, description: Playlist page id string. }
    ApplicationID: { name: application_id, in: path, required: true, schema: { type: string } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 200 } }
    ArchiveSHA256: { name: ScreenRig-Archive-SHA256, in: header, required: true, schema: { type: string, pattern: "^[0-9a-f]{64}$" } }
    ExpandedBytes: { name: ScreenRig-Expanded-Bytes, in: header, required: true, schema: { type: integer, minimum: 1, maximum: 262144000 } }
    FileCount: { name: ScreenRig-File-Count, in: header, required: true, schema: { type: integer, minimum: 1, maximum: 5000 } }
    SDKVersion: { name: ScreenRig-SDK-Version, in: header, required: false, schema: { type: string, maxLength: 64 } }
    ApplicationName: { name: ScreenRig-Application-Name, in: header, required: false, schema: { type: string, maxLength: 120 } }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string } }
    OptionalIfMatch: { name: If-Match, in: header, required: false, schema: { type: string }, description: Omit only when creating a new key; updates require the current quoted revision. }
    AfterCursor: { name: after, in: query, required: false, schema: { type: string } }
    PlaybackScreenID: { name: screen_id, in: query, required: false, schema: { type: string, pattern: "^scr_" } }
    PlaybackMediaID: { name: media_id, in: query, required: false, schema: { type: string, pattern: "^med_" } }
    MediaTagQuery: { name: tag, in: query, required: false, schema: { type: string, pattern: "^[A-Za-z0-9]{1,32}$" }, description: Exact media tag. Untagged objects are omitted when this filter is present. }
    MediaKindQuery: { name: kind, in: query, required: false, schema: { type: string, enum: [image, video] } }
    PlaybackDay: { name: day, in: query, required: false, schema: { type: string, format: date, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }, description: UTC calendar day of the aggregate. }
    LastEventID: { name: Last-Event-ID, in: header, required: false, schema: { type: string }, description: Durable cursor used when after is absent. }
    Range: { name: Range, in: header, required: false, schema: { type: string, pattern: "^bytes=[0-9]*-[0-9]*$" }, description: V1 accepts one byte range only. }
    ScreenshotCaptureID: { name: capture_id, in: query, required: false, schema: { $ref: "#/components/schemas/ScreenshotCaptureID" } }
    ScreenshotCaptureIDHeader: { name: ScreenRig-Capture-Id, in: header, required: true, schema: { $ref: "#/components/schemas/ScreenshotCaptureID" } }
    ScreenListState: { name: state, in: query, required: false, schema: { type: string, enum: [archived] }, description: Omit for pairing_pending and active. Pass archived to list archived screens only. }
    SecFetchSite: { name: Sec-Fetch-Site, in: header, required: false, schema: { type: string, enum: [same-origin, same-site, cross-site, none] } }
    SecFetchMode: { name: Sec-Fetch-Mode, in: header, required: false, schema: { type: string } }
    SecFetchDest: { name: Sec-Fetch-Dest, in: header, required: false, schema: { type: string } }
  securitySchemes:
    accountBearer: { type: http, scheme: bearer, bearerFormat: sr_live, description: Active account bearer. The credential-revocation operation alone may reverify the same already-revoked bearer to return its idempotent 204 result. }
    nativePairingAuthorization:
      type: http
      scheme: ScreenRig-Pairing
      description: Native-only temporary pairing authorization. The credential is exactly srp_ plus 43 base64url characters and is never sent in a cookie, URL, or query.
    nativeSessionAuthorization:
      type: http
      scheme: ScreenRig-Session
      description: Native-only signed 24-hour runtime authorization. The credential is exactly srs_ plus an opaque signed base64url value.
    runtimeCookie: { type: apiKey, in: cookie, name: __Host-screenrig-runtime }
    pairedRuntimeCookie: { type: apiKey, in: cookie, name: __Host-screenrig-runtime, description: Signed runtime session with paired-device mutation profile. }
    pairedDeviceCookie: { type: apiKey, in: cookie, name: __Host-screenrig-device }
    pairingCookie: { type: apiKey, in: cookie, name: __Host-screenrig-pairing, description: "Signed ten-minute pairing session; never grants account, content, or runtime authority." }
    browserLinkCookie: { type: apiKey, in: cookie, name: __Host-screenrig-browser-link, description: "Apex host-only Secure HttpOnly SameSite=Strict Path=/ browser-link owner cookie; it authenticates a thirty-minute unclaimed locator and, when claimed near the boundary, its fresh ten-minute protected delivery window. It has no Domain and is never accepted as a Player cookie." }
    placementCapability:
      type: apiKey
      in: header
      name: ScreenRig-Placement-Capability
      description: >-
        Parent-only signed five-minute placement capability bound to the runtime
        session, screen, application release, placement, manifest revision,
        content-access generation, and allowed KV operations. Refresh by fetching
        the current manifest.
    releaseGrantCookie: { type: apiKey, in: cookie, name: __Host-screenrig-release, description: Exact-host release/screen/generation/grant cookie; never valid on runtime or account routes. }
    releaseLaunchTicket: { type: apiKey, in: query, name: ticket, description: Random single-use 30-second ticket consumed only on its exact release host. }
    operatorBearer: { type: http, scheme: bearer }
  responses:
    Problem:
      description: Stable RFC 9457 problem response.
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    RateLimitedProblem:
      description: Stable rate_limited problem. Retry only after the declared interval.
      headers: { Retry-After: { required: true, schema: { type: integer, minimum: 1 } } }
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
  schemas:
    HealthResponse: { type: object, additionalProperties: false, required: [status], properties: { status: { type: string, enum: [alive] } } }
    ReadyResponse: { type: object, additionalProperties: false, required: [status, degraded], properties: { status: { type: string, enum: [ready] }, degraded: { type: array, items: { type: string } } } }
    VersionResponse: { type: object, additionalProperties: false, required: [version, commit, api_version, protocol_version], properties: { version: { type: string }, commit: { type: string }, api_version: { type: string }, protocol_version: { type: string } } }
    Capabilities:
      type: object
      additionalProperties: false
      required: [api_version, protocol_version, application_compressed_bytes, application_expanded_bytes, application_package_bytes, application_file_count, application_file_bytes, application_path_depth, application_path_bytes, media_image_bytes, playlist_max_pages, playlist_max_items_per_page, playlist_max_media_per_selector, transition_max_duration_ms, screens_per_account, account_content_bytes, features]
      properties:
        api_version: { type: string }
        protocol_version: { type: string }
        application_compressed_bytes: { type: integer, enum: [104857600] }
        application_expanded_bytes: { type: integer, enum: [262144000] }
        application_package_bytes: { type: integer, enum: [272629760], description: Maximum normalized immutable webapp package size available to paired native players. }
        application_file_count: { type: integer, enum: [5000] }
        application_file_bytes: { type: integer, enum: [33554432] }
        application_path_depth: { type: integer, enum: [16] }
        application_path_bytes: { type: integer, enum: [255] }
        media_image_bytes: { type: integer, enum: [20971520], description: "Maximum declared byte size of one image upload, 20 MiB. It is a byte-only gate rejected with invalid_request before any byte is transferred; the server never decodes the image, and the bound applies to animated GIF and animated WebP exactly as it applies to a still. Pixel dimensions are not validated. A video declaration is bounded only by the plan-independent transport ceiling." }
        playlist_max_pages: { type: integer, enum: [100] }
        playlist_max_items_per_page: { type: integer, enum: [24] }
        playlist_max_media_per_selector: { type: integer, enum: [32], description: Maximum ready media objects one image or video selector may resolve to. }
        transition_max_duration_ms: { type: integer, enum: [60000] }
        screens_per_account: { type: integer, enum: [100], description: "Screen limit of the default plan. Unarchived pairing_pending and active screens count. Archived screens do not. Zero on an account means no screen cap." }
        account_content_bytes: { type: integer, enum: [0], description: "Storage limit of the default plan. Zero means no product storage cap. A custom storage ceiling, when present, still counts committed media, expanded application release trees, and application key/value entries together, including bytes reserved by an upload in flight. The per-request ceilings above are plan-independent transport bounds." }
        features: { type: object, additionalProperties: { type: boolean } }
    CLIEnrollmentRequest: { type: object, additionalProperties: false, required: [client_id], properties: { client_id: { type: string, pattern: "^cli_[A-Za-z0-9_-]{43}$", description: "Stable anonymous installation identity generated from 32 CSPRNG bytes and persisted before the first request. It is rate-limit material, not an account credential." }, beta_key: { type: string, description: "Required when the server has a configured enrollment beta key. Omit when the server does not gate enrollment." } } }
    Account: { type: object, additionalProperties: false, required: [id, revision, status, used_bytes, reserved_bytes, screen_count, content_limit_bytes, screen_limit, credit_remaining, created_at, updated_at], properties: { id: { type: string }, revision: { type: integer }, status: { type: string, enum: [active, cancelled, deleted] }, used_bytes: { type: integer, description: "Durable bytes the account owns across media, expanded application release trees, and application key/value entries." }, reserved_bytes: { type: integer, description: "Bytes held by uploads in flight. They count against a custom storage ceiling until the upload commits or its reservation is released." }, screen_count: { type: integer }, content_limit_bytes: { type: integer, description: "Storage ceiling the account's plan allows. Zero means no product storage cap." }, screen_limit: { type: integer, description: "Screen limit the account's plan allows. Zero means no screen cap." }, credit_remaining: { type: integer, minimum: 0, description: "Remaining prepaid credits as a whole integer. Never negative. Enrollment grants the Standard included remainder of 10000 credits." }, created_at: { type: string, format: date-time }, updated_at: { type: string, format: date-time } } }
    RuntimeChrome: { type: object, additionalProperties: false, required: [schema_version, banner], properties: { schema_version: { type: integer, enum: [1] }, banner: { type: "null" } } }
    CLIEnrollment: { type: object, additionalProperties: false, required: [account, token, issuance_id, issuance_expires_at], properties: { account: { $ref: "#/components/schemas/Account" }, token: { type: string, minLength: 32, description: Permanent account bearer credential. It has no scheduled expiry and is redelivered only through this short-lived encrypted issuance envelope. }, issuance_id: { type: string, description: Opaque identifier for the encrypted exact-retry delivery envelope. }, issuance_expires_at: { type: string, format: date-time, description: Exact-retry redelivery deadline for this credential issuance; ten minutes after first enrollment. Later exact retries return credential_issuance_expired while the permanent token remains valid. } } }
    Application: { type: object, additionalProperties: false, required: [id, name, revision, created_at, updated_at], properties: { id: { type: string }, name: { type: string }, revision: { type: integer }, latest_ready_release: { type: string, description: "Release identifier of the newest ready release. Absent until a first publish reaches the ready state. An application has no state of its own; publish state lives on the operation and the release." }, created_at: { type: string, format: date-time }, updated_at: { type: string, format: date-time } } }
    ApplicationList: { type: object, additionalProperties: false, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Application" } } } }
    OperationAccepted: { type: object, additionalProperties: false, required: [id, release_id, operation_id], properties: { id: { type: string, description: Application identifier the upload was attributed to. }, release_id: { type: string, description: "Release identifier created by this upload. Poll the operation and pin this release into a playlist once the operation succeeds." }, operation_id: { type: string } } }
    Operation: { type: object, additionalProperties: true, required: [id, kind, state, created_at, updated_at], properties: { id: { type: string }, kind: { type: string }, state: { type: string, enum: [receiving, queued, running, succeeded, failed, cancelled], description: "Receiving means the bounded upload body is still being durably staged. Terminal values are succeeded, failed, and cancelled." }, request_id: { type: string }, created_at: { type: string }, updated_at: { type: string }, result: { type: object, additionalProperties: true }, error: { type: object, additionalProperties: true } } }
    PlaylistWrite:
      type: object
      additionalProperties: false
      required: [name, pages]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        pages: { type: array, minItems: 1, maxItems: 100, items: { $ref: "#/components/schemas/PlaylistPageWrite" } }
    Playlist:
      type: object
      additionalProperties: false
      required: [id, name, revision, pages]
      properties:
        id: { type: string }
        name: { type: string }
        revision: { type: integer }
        pages: { type: array, minItems: 1, maxItems: 100, items: { $ref: "#/components/schemas/PlaylistPage" } }
        comments: { type: object, additionalProperties: true, description: "Opaque agent JSON object, compact UTF-8 ≤ 1024 bytes. Absent when unset. ScreenRig never reads or uses it. PlaylistWrite cannot set it. Not on the runtime manifest and never authorization." }
    PlaylistPageWrite:
      type: object
      additionalProperties: false
      required: [id, canvas, transition, advance, placements]
      properties:
        id: { type: string, pattern: "^[A-Za-z][A-Za-z0-9_-]{0,63}$" }
        canvas: { $ref: "#/components/schemas/PlaylistCanvas" }
        transition: { $ref: "#/components/schemas/PlaylistTransition" }
        advance: { $ref: "#/components/schemas/PlaylistAdvanceWrite" }
        visibility: { $ref: "#/components/schemas/PageVisibility" }
        placements: { type: array, minItems: 1, maxItems: 24, items: { $ref: "#/components/schemas/PlaylistPlacementWrite" } }
    PlaylistPage:
      type: object
      additionalProperties: false
      required: [id, canvas, transition, advance, placements]
      properties:
        id: { type: string, pattern: "^[A-Za-z][A-Za-z0-9_-]{0,63}$" }
        canvas: { $ref: "#/components/schemas/PlaylistCanvas" }
        transition: { $ref: "#/components/schemas/PlaylistTransition" }
        advance: { $ref: "#/components/schemas/PlaylistAdvance" }
        visibility: { $ref: "#/components/schemas/PageVisibility" }
        placements: { type: array, minItems: 1, maxItems: 24, items: { $ref: "#/components/schemas/PlaylistPlacement" } }
        comments: { type: object, additionalProperties: true, description: "Opaque agent JSON object, compact UTF-8 ≤ 1024 bytes. Absent when unset. ScreenRig never reads or uses it. PlaylistPageWrite cannot set it. Copied across playlist updates by page id. Not on the runtime manifest." }
    PageVisibility:
      type: object
      additionalProperties: false
      required: [enabled]
      description: >-
        Optional page visibility schedule. It is a sibling of advance and is never part of
        screenrig.canvas/v1; it describes playback orchestration, not geometry. The server
        validates and carries these rules as data. The player evaluates them against the
        screen timezone published at the manifest root. A page is eligible when enabled is
        true, now is inside [from, until), and either windows is absent or at least one
        window matches. Every playlist must keep at least one page with no visibility field
        at all, so eligible content always exists. Conformance vectors for the evaluation
        rules are the screenrig.schedule/v1 family in packages/schedule-contract.
      properties:
        enabled: { type: boolean, description: "False hides the page unconditionally and needs no clock. A visibility object that sets enabled true and carries no from, until, or windows is a no-op and is rejected." }
        from: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}T([01]\\d|2[0-3]):[0-5]\\d$", description: "Inclusive civil lower bound in the screen timezone, minute precision, no offset and no zone suffix." }
        until: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}T([01]\\d|2[0-3]):[0-5]\\d$", description: "Exclusive civil upper bound in the screen timezone. When both bounds are present, from must be strictly earlier than until." }
        windows: { type: array, minItems: 1, maxItems: 16, items: { $ref: "#/components/schemas/PageVisibilityWindow" } }
    PageVisibilityWindow:
      type: object
      additionalProperties: false
      required: [days]
      description: >-
        One recurring civil window. Omitting start and end selects the whole day. When end
        is less than or equal to start the window crosses midnight and the start day owns
        it, so fri 22:00 to 02:00 runs into Saturday morning.
      properties:
        days: { type: array, minItems: 1, maxItems: 7, uniqueItems: true, items: { type: string, enum: [mon, tue, wed, thu, fri, sat, sun] }, description: "Civil days of week. The server stores them in mon-to-sun order; the set carries no author-visible ordering." }
        start: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$", description: "Inclusive civil start time. Required when end is present." }
        end: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$", description: "Exclusive civil end time. Required when start is present." }
    PlaylistCanvas:
      type: object
      additionalProperties: false
      required: [width, height, background]
      properties:
        width: { type: number, exclusiveMinimum: 0 }
        height: { type: number, exclusiveMinimum: 0 }
        viewport_fit: { type: string, enum: [contain, cover, fill], default: contain }
        background: { $ref: "#/components/schemas/CanvasBackground" }
    PlaylistRect:
      type: object
      additionalProperties: false
      required: [x, y, width, height]
      properties:
        x: { type: number }
        y: { type: number }
        width: { type: number, exclusiveMinimum: 0 }
        height: { type: number, exclusiveMinimum: 0 }
    PlaylistTransition:
      type: object
      additionalProperties: false
      required: [type, duration_ms]
      properties:
        type: { type: string, enum: [crossfade] }
