      - $ref: '#/components/parameters/ResourceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DashboardPasskeyPatch'
      responses:
        '200':
          description: Renames a passkey owned by the signed-in person..
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardPasskey'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteDashboardPasskey
      description: Deletes a passkey after fresh proof and sends a sign-in changed notice. Removing the last sign-in method returns last_credential.
      security:
      - dashboardSession: []
      parameters:
      - $ref: '#/components/parameters/ResourceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DashboardProofRequest'
      responses:
        '204':
          description: Deletes a passkey after fresh proof and sends a sign-in changed notice.
        default:
          $ref: '#/components/responses/Problem'
  /dashboard/v1/me/email:
    servers:
    - url: https://dashboard.screenrig.ai
      description: Backend-owned project dashboard origin
    get:
      operationId: getDashboardEmail
      description: Returns the person’s verified and pending email state.
      security:
      - dashboardSession: []
      responses:
        '200':
          description: Returns the person’s verified and pending email state..
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardEmail'
        default:
          $ref: '#/components/responses/Problem'
  /dashboard/v1/me/email/change:
    servers:
    - url: https://dashboard.screenrig.ai
      description: Backend-owned project dashboard origin
    post:
      operationId: changeDashboardEmail
      description: Requests an email change after fresh proof. The verified address stays effective while verification is pending. An address held by another person
        returns user_email_conflict. The old address receives a warning, not an undo link.
      security:
      - dashboardSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserEmailChangeRequest'
      responses:
        '202':
          description: Requests an email change after fresh proof.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEmailChangeAccepted'
        default:
          $ref: '#/components/responses/Problem'
  /.health:
    get:
      operationId: getHealth
      responses:
        "200": { description: Alive, content: { application/json: { schema: { $ref: "#/components/schemas/HealthResponse" } } } }
  /.ready:
    get:
      operationId: getReadiness
      description: >-
        Serving readiness. A draining host answers 421 server_draining with
        Retry-After: 1. A required dependency failure answers 500 not_ready
        with Retry-After. A live database schema that does not satisfy this
        release (a desired index missing or different for more than two
        minutes) answers 500 schema_incompatible without Retry-After: it does
        not clear by waiting.
      responses:
        "200": { description: Ready, content: { application/json: { schema: { $ref: "#/components/schemas/ReadyResponse" } } } }
        "421": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /.version:
    get:
      operationId: getVersion
      responses:
        "200": { description: Version, content: { application/json: { schema: { $ref: "#/components/schemas/VersionResponse" } } } }
  /api/v1/capabilities:
    get:
      operationId: getCapabilities
      responses:
        "200": { description: Capability and archive limits, content: { application/json: { schema: { $ref: "#/components/schemas/Capabilities" } } } }
  /api/v1/enrollments:
    post:
      operationId: enrollCLI
      x-rate-limit-policies:
      - name: cli-enrollment-client
        quota: 3
        windowSeconds: 3600
      - name: cli-enrollment-ip
        quota: 5
        windowSeconds: 3600
      - name: enrollment-recipient
        quota: 3
        windowSeconds: 86400
      x-rate-limit-admitted-response-headers:
      - RateLimit-Policy
      - RateLimit
      description: Creates a new project and its first agent through explicit bundled-CLI enrollment, even when the contact address already belongs to a person or project.
        The contact email stays unverified and grants no authority; malformed addresses return invalid_request. Queues an enrollment invitation in the same transaction.
        project_name is optional; omission uses a readable two-word name. Exact idempotent replay precedes rate limits. Persist the permanent credential before reporting
        success; its replay envelope expires at issuance_expires_at and later retries return credential_issuance_expired. The idempotency record lasts 24 hours.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CLIEnrollmentRequest'
      responses:
        '201':
          description: New project and permanent bearer credential. The project carries the unverified contact address in its trimmed supplied form. Persist and verify
            the token before reporting enrollment success. The credential has no scheduled expiry but its encrypted exact-retry delivery envelope exists only until
            issuance_expires_at.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - private, no-store
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CLIEnrollment'
        '400':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '410':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimitedProblem'
        '500':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
      security: []
  /api/v1/agent-connections:
    post:
      operationId: startAgentConnection
      description: Starts a request to connect another agent to an existing project. The human has 24 hours to approve it. The caller supplies an X25519 public JWK and receives a temporary connection credential separately from the browser approval URL. No project bearer, cookie, Origin header, query credential, or Idempotency-Key is accepted. The connection id is descriptive and never authority.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AgentConnectionRequest" } } } }
      responses:
        "201": { description: "Temporary connection authority and safe dashboard approval URL. The temporary credential is never placed in the URL.", headers: { Cache-Control: { schema: { type: string, enum: ["private, no-store"] } }, Referrer-Policy: { schema: { type: string, enum: [no-referrer] } } }, content: { application/json: { schema: { $ref: "#/components/schemas/AgentConnectionStart" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimitedProblem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/agent-connections/{id}/events:
    get:
      operationId: streamAgentConnectionEvents
      description: Status-only SSE authenticated by the temporary ScreenRig-Agent-Connect credential in Authorization. Data contains only AgentConnection metadata and closes on approved, denied, connected, expired, or cancelled. It never contains a bearer, credential envelope, nonce, cookie, or project identifier.
      security: [{ agentConnectionAuthorization: [] }]
      parameters: [{ $ref: "#/components/parameters/ResourceID" }]
      responses:
        "200": { description: Status-only connection SSE., headers: { Cache-Control: { schema: { type: string, enum: ["no-cache, no-store, no-transform"] } }, X-Accel-Buffering: { schema: { type: string, enum: [no] } } }, content: { text/event-stream: { schema: { type: string } } } }
        "401": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/agent-connections/{id}/credential:
    post:
      operationId: collectAgentCredential
      description: Collects the exact replay-safe credential envelope after approval. The temporary connection bearer authenticates the request, while X25519, HKDF-SHA-256, and AES-256-GCM bind the envelope to the recipient key supplied at connection creation. No plaintext project bearer is returned by this route. Approval starts a fresh 24-hour delivery window so the recipient can resume after being offline. The envelope is deleted on activation, cancellation, or expiry.
      security: [{ agentConnectionAuthorization: [] }]
      parameters: [{ $ref: "#/components/parameters/ResourceID" }]
      responses:
        "200": { description: Recipient-bound credential envelope., headers: { Cache-Control: { schema: { type: string, enum: ["private, no-store"] } } }, content: { application/json: { schema: { $ref: "#/components/schemas/AgentCredentialCollection" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "410": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/agents/self/activate:
    post:
      operationId: activateCurrentAgent
      description: Proves successful envelope decryption and durable local storage by presenting the pending bearer. Atomically activates both the agent and token, deletes the delivery envelope, and is replay-safe with the now-active bearer. It takes no body and does not debit the API meter.
      security: [{ pendingAgentBearer: [] }]
      responses:
        "200": { description: Active agent., headers: { Cache-Control: { schema: { type: string, enum: ["private, no-store"] } } }, content: { application/json: { schema: { $ref: "#/components/schemas/Agent" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "410": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/agents/self:
    get:
      operationId: getCurrentAgent
      description: Returns the agent installation linked to the calling project bearer plus connection_ready. A project is ready when at least one member has a passkey or password. Identity status is diagnostic and does not debit the API meter.
      security: [{ projectBearer: [] }]
      responses:
        "200": { description: "Current agent and project connection readiness.", headers: { Cache-Control: { schema: { type: string, enum: ["private, no-store"] } } }, content: { application/json: { schema: { $ref: "#/components/schemas/AgentSelfStatus" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/agents/self/disconnect:
    post:
      operationId: disconnectCurrentAgent
      description: Revokes the calling agent and its bearer without deleting the project or content. Repeating with the same cryptographically valid revoked bearer is a no-op success. Disconnecting the last active agent returns agent_lockout_risk unless allow_last_agent is explicit. Does not debit the API meter.
      security: [{ revocableAgentBearer: [] }]
      requestBody: { required: false, content: { application/json: { schema: { $ref: "#/components/schemas/AgentDisconnectRequest" } } } }
      responses:
        "204": { description: Agent disconnected., headers: { Cache-Control: { schema: { type: string, enum: ["private, no-store"] } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/project:
    get:
      operationId: getProject
      description: The calling project. Does not debit the 1-credit API meter, so a zero-remaining project can still read remaining and recover. After a successful
        project principal, authenticated /api/v1 JSON and problem responses include ScreenRig-Credits-Remaining, ScreenRig-Credits-Reset, and ScreenRig-Credits-Included
        as whole credits. SSE, runtime, content, and unauthenticated responses omit them.
      security:
      - projectBearer: []
      responses:
        '200':
          description: Project
          headers:
            ScreenRig-Credits-Remaining:
              $ref: '#/components/headers/ScreenRigCreditsRemaining'
            ScreenRig-Credits-Reset:
              $ref: '#/components/headers/ScreenRigCreditsReset'
            ScreenRig-Credits-Included:
              $ref: '#/components/headers/ScreenRigCreditsIncluded'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateProject
      description: Renames the current project. Names contain 1–60 printable characters and no URL-looking text.
      security:
      - projectBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectPatch'
      responses:
        '200':
          description: Renames the current project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/applications:
    get:
      operationId: listApplications
      security: [{ projectBearer: [] }]
      responses:
        "200": { description: Applications, content: { application/json: { schema: { $ref: "#/components/schemas/ApplicationList" } } } }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: uploadApplication
      x-rate-limit-policies: [{ name: application-upload, quota: 10, windowSeconds: 60 }]
      x-rate-limit-admitted-response-headers: [RateLimit-Policy, RateLimit]
      description: Streams one CLI-produced tar.gz directly into bounded durable staging. Metadata is carried in headers so the archive is never base64-wrapped or materialized as JSON by the server.
      security: [{ projectBearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/ArchiveSHA256" }
        - { $ref: "#/components/parameters/ExpandedBytes" }
        - { $ref: "#/components/parameters/FileCount" }
        - { $ref: "#/components/parameters/SDKVersion" }
        - { $ref: "#/components/parameters/ApplicationName" }
        - { $ref: "#/components/parameters/ApplicationNameEncoded" }
      requestBody: { required: true, content: { application/gzip: { schema: { type: string, contentMediaType: application/gzip, contentEncoding: binary, maxLength: 104857600 } } } }
      responses:
        "202": { description: Upload accepted, headers: { RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }, RateLimit: { $ref: "#/components/headers/RateLimit" } }, content: { application/json: { schema: { $ref: "#/components/schemas/OperationAccepted" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/applications/{id}/releases:
    post:
      operationId: uploadApplicationRelease
      x-rate-limit-policies: [{ name: application-upload, quota: 10, windowSeconds: 60 }]
      x-rate-limit-admitted-response-headers: [RateLimit-Policy, RateLimit]
      description: >-
        Publishes an immutable new release of an owned application using the same
        bounded tar.gz upload pipeline. If-Match guards the application revision;
        acceptance increments it, and successful publication increments it again
        when latest_ready_release changes. Name and application identity are
        preserved. Existing playlist release pins are not changed. An identical
        idempotent retry returns the original operation even after revision changes.
      security: [{ projectBearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/ResourceID" }
        - { $ref: "#/components/parameters/IfMatch" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/ArchiveSHA256" }
        - { $ref: "#/components/parameters/ExpandedBytes" }
        - { $ref: "#/components/parameters/FileCount" }
        - { $ref: "#/components/parameters/SDKVersion" }
      requestBody: { required: true, content: { application/gzip: { schema: { type: string, contentMediaType: application/gzip, contentEncoding: binary, maxLength: 104857600 } } } }
      responses:
        "202": { description: Upload accepted, headers: { RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }, RateLimit: { $ref: "#/components/headers/RateLimit" } }, content: { application/json: { schema: { $ref: "#/components/schemas/OperationAccepted" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/applications/{id}:
    get:
      operationId: getApplication
      security: [{ projectBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/ResourceID" }]
      responses:
        "200": { description: Application, content: { application/json: { schema: { $ref: "#/components/schemas/Application" } } } }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteApplication
      description: >-
        Tombstones one application owned by the authenticated project and
        all of its releases. The project bearer is authoritative; an
        unknown or other-project id is not_found. If-Match guards the
        application revision. A live manifest reference blocks deletion
        with application_in_use; there is no force-delete path.
      security: [{ projectBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/ResourceID" }, { $ref: "#/components/parameters/IfMatch" }, { $ref: "#/components/parameters/OptionalIdempotencyKey" }]
      responses:
        "204": { description: Application and releases tombstoned. }
        "409": { description: application_in_use — a live manifest still references one of the application's releases., content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "412": { description: revision_conflict — If-Match is stale; Problem.current_revision carries the current revision., content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/operations/{id}:
    get:
      operationId: getOperation
      security: [{ projectBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/ResourceID" }]
      responses:
        "200": { description: Operation, content: { application/json: { schema: { $ref: "#/components/schemas/Operation" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/operations/{id}/cancel:
    post:
      operationId: cancelOperation
      security: [{ projectBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/ResourceID" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200": { description: Cancelled durable operation. A current worker fence can no longer finalize it., content: { application/json: { schema: { $ref: "#/components/schemas/Operation" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/v2/playlists:
    get:
      operationId: listPlaylistsV2
      description: Versioned playlist list that may expose adslot pages. The v1 list refuses an ad-bearing document with version_required instead of filtering it.
      security: [{ projectBearer: [] }]
      responses:
        "200": { description: Playlists with the adslot page union., content: { application/json: { schema: { $ref: "#/components/schemas/PlaylistV2List" } } } }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createPlaylistV2
      description: Authoring entry for the adslot page union. At most 16 adslot pages, at least one ordinary page with no visibility, and the reuse of one slot definition on different pages remain server checks. Reference resolution and DNS stay server checks.
      security: [{ projectBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/OptionalIdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PlaylistWriteV2" } } } }
      responses:
        "201": { description: Playlist with its adslot pages., content: { application/json: { schema: { $ref: "#/components/schemas/PlaylistV2" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/v2/playlists/{id}:
    get:
      operationId: getPlaylistV2
      security: [{ projectBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/ResourceID" }]
      responses:
        "200": { description: Playlist with its adslot pages., content: { application/json: { schema: { $ref: "#/components/schemas/PlaylistV2" } } } }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: updatePlaylistV2
      description: Versioned update accepting the adslot page union. If-Match carries the playlist revision.
      security: [{ projectBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/ResourceID" }, { $ref: "#/components/parameters/IfMatch" }, { $ref: "#/components/parameters/OptionalIdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PlaylistWriteV2" } } } }
      responses:
        "200": { description: Updated playlist., content: { application/json: { schema: { $ref: "#/components/schemas/PlaylistV2" } } } }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deletePlaylistV2
      security: [{ projectBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/ResourceID" }, { $ref: "#/components/parameters/IfMatch" }, { $ref: "#/components/parameters/OptionalIdempotencyKey" }]
      responses:
        "204": { description: Playlist tombstoned. }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/playlists:
    get:
      operationId: listPlaylists
      description: Lists playlists. Authenticated /api/v1 control-plane read; costs 1 credit.
      security: [{ projectBearer: [] }]
      responses:
        "200":
          description: Playlists
          headers:
            ScreenRig-Credits-Remaining: { $ref: "#/components/headers/ScreenRigCreditsRemaining" }
            ScreenRig-Credits-Reset: { $ref: "#/components/headers/ScreenRigCreditsReset" }
            ScreenRig-Credits-Included: { $ref: "#/components/headers/ScreenRigCreditsIncluded" }
          content: { application/json: { schema: { $ref: "#/components/schemas/PlaylistList" } } }
        "402": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createPlaylist
      security: [{ projectBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/OptionalIdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PlaylistWrite" } } } }
      responses:
        "201": { description: Playlist, content: { application/json: { schema: { $ref: "#/components/schemas/Playlist" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/playlists/{id}:
    parameters: [{ $ref: "#/components/parameters/ResourceID" }]
    get:
      operationId: getPlaylist
      security: [{ projectBearer: [] }]
      responses:
        "200": { description: Playlist, content: { application/json: { schema: { $ref: "#/components/schemas/Playlist" } } } }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: updatePlaylist
      security: [{ projectBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/IfMatch" }, { $ref: "#/components/parameters/OptionalIdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PlaylistWrite" } } } }
      responses:
        "200": { description: Playlist, content: { application/json: { schema: { $ref: "#/components/schemas/Playlist" } } } }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deletePlaylist
      security: [{ projectBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/IfMatch" }, { $ref: "#/components/parameters/OptionalIdempotencyKey" }]
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/comment/screen/{id}:
    parameters: [{ $ref: "#/components/parameters/ResourceID" }]
    get:
      operationId: getScreenComments
      description: >-
        Opaque agent comments on the named screen. ScreenRig does not read or
        use them. They are not authorization and are not on the runtime
        manifest. A screen with no comments returns comments null. Archived
        screens remain addressable. Authenticated /api/v1 control-plane read;
        costs 1 credit.
      security: [{ projectBearer: [] }]
      responses:
        "200": { description: Comments, content: { application/json: { schema: { $ref: "#/components/schemas/Comments" } } } }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: putScreenComments
      description: >-
        Replaces opaque agent comments on the named screen. The comments value
        must be a JSON object whose compact UTF-8 form is at most 1024 bytes.
        Last-write-wins on the comments field only; revision, updated_at, and
        the runtime manifest are unchanged.
      security: [{ projectBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/OptionalIdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CommentsWrite" } } } }
      responses:
        "200": { description: Comments, content: { application/json: { schema: { $ref: "#/components/schemas/Comments" } } } }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteScreenComments
      description: Unsets screen comments. Idempotent if already unset. Does not bump revision or remint the runtime manifest.
      security: [{ projectBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/OptionalIdempotencyKey" }]
      responses:
        "204": { description: Unset }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/comment/playlist/{id}:
    parameters: [{ $ref: "#/components/parameters/ResourceID" }]
    get:
      operationId: getPlaylistComments
      description: >-
        Opaque agent comments on the named playlist. ScreenRig does not read or
        use them. A playlist with no comments returns comments null.
        Authenticated /api/v1 control-plane read; costs 1 credit.
      security: [{ projectBearer: [] }]
      responses:
        "200": { description: Comments, content: { application/json: { schema: { $ref: "#/components/schemas/Comments" } } } }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: putPlaylistComments
