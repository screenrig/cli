      type: object
      additionalProperties: false
      required: [prompt]
      description: >-
        Requests one still image. The prompt is customer bytes and is never returned,
        logged, or published on project SSE. aspect_ratio defaults to 16:9. quality
        is low, medium, or high and defaults to medium. tag is stored on the ready
        media object like an upload tag. Optional references are inline base64 or
        a project media_id; HTTP URLs are rejected. Remaining that cannot cover
        twice the vendor cost of the still, rounded up to whole credits, after the
        intro floor (negative 1,000,000 credits until 2027-01-01, then zero)
        returns payment_required, except development.
      properties:
        prompt: { type: string, minLength: 1, maxLength: 4000 }
        aspect_ratio: { type: string, enum: ["1:1", "16:9", "9:16", "4:3", "3:4", "3:2", "2:3"], default: "16:9" }
        quality: { type: string, enum: [low, medium, high], default: medium }
        tag: { type: string, pattern: "^[A-Za-z0-9]{1,32}$" }
        references: { type: array, maxItems: 16, items: { $ref: "#/components/schemas/MediaGenerationReference" } }
    MediaGenerationReference:
      type: object
      additionalProperties: false
      description: Exactly one of media_id or b64. HTTP URLs are rejected.
      properties:
        media_id: { type: string }
        b64: { type: string }
    MediaGeneration:
      type: object
      additionalProperties: false
      required: [media, usage]
      description: >-
        Ready generated still plus billed usage. Never image bytes, b64_json, object
        keys, signed URLs, vendor URLs, vendor cost, vendor tokens, the deployment
        model name, or the prompt.
      properties:
        media: { $ref: "#/components/schemas/Media" }
        usage: { $ref: "#/components/schemas/MediaGenerationUsage" }
    MediaGenerationUsage:
      type: object
      additionalProperties: false
      required: [quality, credits, usd]
      description: >-
        Customer-facing debit for one stored still. quality is the requested quality
        and changes the image, not a fixed price. credits are twice the vendor cost
        of that still, rounded up to whole ScreenRig credits. usd is the dollar
        equivalent of those credits. Never a vendor name, vendor cost, or token count.
      properties:
        quality: { type: string, enum: [low, medium, high] }
        credits: { type: integer, minimum: 1 }
        usd: { type: string }
    MediaUploadDeclaration: { type: object, additionalProperties: false, required: [filename, content_type, bytes, sha256], description: "Declares one upload. The bytes maximum is a plan-independent transport ceiling, not an achievable size. An image content type is bounded further at 20971520 bytes, 20 MiB, and a larger image declaration is rejected with invalid_request before any byte is transferred. That image bound is a byte-only gate: the server never decodes the image to enforce it, and it applies to animated GIF and animated WebP exactly as it applies to a still. The default plan has no product storage cap. A custom storage ceiling, when present, is checked first and a declaration it cannot hold is rejected with quota_exceeded before any byte is transferred. Remaining prepaid credit of zero rejects declare and commit with payment_required. Read media_image_bytes from the capabilities document to preflight the image bound, and project_content_bytes there, or content_limit_bytes on the project, to know any custom storage ceiling. An optional tag is stored on the ready media object and is not redeclared at commit. An optional source_filename records the caller's original file name when the client transcoded the bytes before upload; the ready object's filename is then derived from it so distinct sources never collide (photo.png uploaded as photo.webp is stored as photo.png.webp, photo.jpg as photo.jpg.webp, and a source photo.webp stays photo.webp).", properties: { filename: { type: string, minLength: 1, maxLength: 255, description: "Name of the bytes being uploaded, as they will be sent." }, source_filename: { type: string, minLength: 1, maxLength: 255, description: "Caller's original file name before any client-side transcode. Bare file name only. Stored verbatim on the ready media as source_filename and used to derive filename." }, content_type: { type: string, enum: [image/png, image/jpeg, image/webp, image/gif, video/mp4, video/webm] }, bytes: { type: integer, minimum: 1, maximum: 1073741824 }, sha256: { type: string, pattern: "^[a-f0-9]{64}$" }, tag: { type: string, pattern: "^[A-Za-z0-9]{1,32}$" } } }
    MediaTagPatch: { type: object, additionalProperties: false, required: [tag], properties: { tag: { oneOf: [{ type: string, pattern: "^[A-Za-z0-9]{1,32}$" }, { type: "null" }], description: "Replacement tag or null to clear it." } } }
    MediaCommit: { type: object, additionalProperties: false, required: [content_type, bytes, sha256], description: "Declares only what the server can re-verify against the stored object byte for byte. Codec identity is not declared here: the server derives it from the container during asynchronous verification, so a client cannot assert a codec that drives player behaviour.", properties: { content_type: { type: string, enum: [image/png, image/jpeg, image/webp, image/gif, video/mp4, video/webm] }, bytes: { type: integer, minimum: 1, maximum: 1073741824 }, sha256: { type: string, pattern: "^[a-f0-9]{64}$" } } }
    MediaUploadSession: { type: object, additionalProperties: false, required: [id, operation, upload_url, method, headers, expires_at], properties: { id: { type: string }, operation: { $ref: "#/components/schemas/Operation" }, upload_url: { type: string, format: uri }, method: { type: string, enum: [PUT] }, headers: { type: object, additionalProperties: { type: string }, description: Exact signed request headers; clients must send every field verbatim. }, expires_at: { type: string, format: date-time } } }
    Media: { type: object, additionalProperties: false, required: [id, filename, primitive, content_type, operation_id, sha256, bytes, width, height, revision, state, created_at, updated_at], properties: { id: { type: string }, filename: { type: string, description: "Stored file name. Derived from source_filename plus the stored extension when a source_filename was declared with a different extension." }, source_filename: { type: string, description: "Caller's original file name as declared at upload. Absent when the upload declared none and for generated stills. This is the human handle for filename-to-id lookups." }, primitive: { type: string, enum: [image, video] }, content_type: { type: string }, operation_id: { type: string }, sha256: { type: string, pattern: "^[a-f0-9]{64}$" }, bytes: { type: integer }, width: { type: integer, minimum: 1, description: Verified immutable intrinsic width in pixels. }, height: { type: integer, minimum: 1, description: Verified immutable intrinsic height in pixels. }, duration_ms: { type: integer, minimum: 1, description: "Verified container duration; present for ready video media." }, codecs: { type: string, maxLength: 128, pattern: "^[A-Za-z0-9]{3,9}(\\.[A-Za-z0-9]{1,10}){0,5}(,[A-Za-z0-9]{3,9}(\\.[A-Za-z0-9]{1,10}){0,5})*$", description: "Verified RFC 6381 codec list derived from the stored bytes, never declared by the client. Always present for ready video media: a video whose codec cannot be established is rejected at commit rather than stored without it. Absent for images, which have no codec." }, tag: { type: string, pattern: "^[A-Za-z0-9]{1,32}$", description: Optional mutable selector tag. Absent when the object is untagged. }, revision: { type: integer }, state: { type: string, enum: [ready] }, created_at: { type: string, format: date-time }, updated_at: { type: string, format: date-time } } }
    MediaList: { type: object, additionalProperties: false, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Media" } } } }
    FeedbackWrite:
      type: object
      additionalProperties: false
      required: [title, body]
      properties:
        title: { type: string, minLength: 1, maxLength: 120, description: "Single-line summary. Leading and trailing whitespace is trimmed, and control characters are rejected." }
        body: { type: string, minLength: 1, maxLength: 4000, description: "Full description. Line feed and tab are the only accepted control characters." }
        context: { $ref: "#/components/schemas/FeedbackContext" }
    FeedbackContext:
